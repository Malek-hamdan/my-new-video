<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>UII Spare Parts</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: rgba(20, 24, 33, 0.86);
    --surface-2: rgba(28, 33, 45, 0.9);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #e8ebf2;
    --muted: #8a93a6;
    --accent: #5b9dff;
    --accent-soft: rgba(91, 157, 255, 0.14);
    --danger: #ff6b6b;
    --danger-soft: rgba(255, 107, 107, 0.12);
    --radius: 14px;
    --mx: 50vw;
    --my: 30vh;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Cursor-following glow: sits behind all content, never intercepts input */
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(520px circle at var(--mx) var(--my), rgba(91, 157, 255, 0.10), transparent 60%),
      radial-gradient(180px circle at var(--mx) var(--my), rgba(140, 190, 255, 0.07), transparent 70%);
    transition: opacity 0.4s ease;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 16px 64px;
  }

  header { margin-bottom: 28px; }

  h1 {
    margin: 0;
    font-size: clamp(40px, 9vw, 64px);
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #a9c6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
    scrollbar-width: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .tab[aria-selected="true"] {
    color: var(--text);
    background: var(--accent-soft);
    border-color: rgba(91, 157, 255, 0.35);
  }
  .tab .count {
    min-width: 22px;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }
  .tab[aria-selected="true"] .count { background: rgba(91,157,255,0.22); color: #cfe0ff; }

  /* Panel */
  .panel {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .panel-head .meta { color: var(--muted); font-size: 13px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .btn:hover {
    border-color: rgba(91,157,255,0.5);
    background: rgba(91,157,255,0.12);
    box-shadow: 0 0 0 3px rgba(91,157,255,0.08);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #06101f; }
  .btn-primary:hover { background: #77afff; border-color: #77afff; }
  .btn svg { width: 16px; height: 16px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 12px 18px;
    text-align: left;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  th.col-num, td.col-num { width: 48px; text-align: center; padding-left: 12px; padding-right: 0; }
  th.col-qty { width: 16%; }
  th.col-ref { width: 24%; }
  th.col-date { width: 19%; }
  .cell.date { min-height: 39px; }
  .cell.date::-webkit-calendar-picker-indicator { opacity: 0.6; cursor: pointer; }
  .cell.date.blank { color: var(--muted); }
  th.col-act, td.col-act { width: 56px; text-align: right; }
  th.col-mach { width: 13%; }
  th.col-used { width: 13%; }
  .tx-text { display: block; padding: 8px 10px; min-height: 39px; overflow-wrap: anywhere; }
  .tx-text.muted { color: var(--muted); }
  .tx-text.qty { font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid rgba(91,157,255,0.3);
    color: #cfe0ff;
    font-size: 12px;
    font-weight: 600;
  }
  .tab.tx { color: #b9c6dc; }
  .tab-sep { flex: 0 0 1px; align-self: stretch; margin: 6px 2px; background: var(--border-strong); }
  body.tx-view #addTop, body.tx-view .panel-foot { display: none; }
  body.tx-view .cell { border-color: var(--border-strong); background: rgba(255,255,255,0.03); }

  tbody tr { transition: background 0.15s ease; }
  tbody tr + tr td { border-top: 1px solid var(--border); }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td { padding: 6px 18px; vertical-align: middle; }
  td.col-num { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .cell {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .cell::placeholder { color: rgba(138,147,166,0.45); }
  tbody tr:hover .cell { border-color: var(--border); }
  .cell:focus {
    outline: none;
    border-color: rgba(91,157,255,0.6);
    background: rgba(91,157,255,0.06);
  }
  .cell.qty { font-variant-numeric: tabular-nums; }

  .del {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  tbody tr:hover .del { opacity: 1; }
  .del:hover, .del:focus-visible {
    opacity: 1;
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(255,107,107,0.3);
    outline: none;
  }
  .del svg { width: 16px; height: 16px; }
  .del.armed {
    width: auto;
    padding: 0 10px;
    opacity: 1;
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(255,107,107,0.45);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  body.readonly #addTop, body.readonly .panel-foot, body.readonly .del { display: none; }

  .empty {
    padding: 48px 18px;
    text-align: center;
    color: var(--muted);
  }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  .panel-foot {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
  }

  .status {
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
    min-height: 18px;
    transition: color 0.3s ease;
  }
  .status.saved { color: #7fd6a4; }
  .status.error { color: var(--danger); }

  /* Mobile: rows become cards */
  @media (max-width: 640px) {
    .wrap { padding-top: 28px; }
    .panel-head { padding: 14px; }
    .panel-head .btn span { display: none; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
    .tab.tx { grid-column: 1 / -1; }
    .tab-sep { display: none; }
    .tab { padding: 9px 4px; gap: 5px; font-size: 14px; min-width: 0; }
    .tab .count { min-width: 18px; padding: 1px 5px; font-size: 11px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      position: relative;
      padding: 10px 14px 12px;
    }
    tbody tr + tr td { border-top: 0; }
    tbody tr + tr { border-top: 1px solid var(--border); }
    tbody td { padding: 3px 0; }
    td.col-num {
      width: auto;
      text-align: left;
      padding: 0 0 4px;
      font-size: 12px;
    }
    td.col-num::before { content: "#"; }
    td[data-label] {
      display: grid;
      grid-template-columns: 82px 1fr;
      align-items: center;
      gap: 8px;
    }
    td[data-label]::before {
      content: attr(data-label);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .cell { border-color: var(--border); background: rgba(255,255,255,0.02); font-size: 16px; }
    td.col-act { position: absolute; top: 6px; right: 10px; width: auto; padding: 0; }
    .del { opacity: 1; }
    .panel-foot { padding: 12px 14px; }
    .panel-foot .btn { width: 100%; justify-content: center; }
  }

  @media (hover: none) {
    .glow { opacity: 0.7; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="glow" id="glow" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1>UII</h1>
    <p class="subtitle">Machine Spare Parts Register</p>
  </header>

  <nav class="tabs" role="tablist" id="tabs" aria-label="Sections"></nav>

  <section class="panel" role="tabpanel" id="panel" aria-labelledby="">
    <div class="panel-head">
      <div>
        <h2 id="panelTitle"></h2>
        <div class="meta" id="panelMeta"></div>
      </div>
      <button class="btn btn-primary" id="addTop" type="button" title="Add row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add row</span>
      </button>
    </div>

    <table>
      <thead id="thead">
        <tr>
          <th class="col-num">#</th>
          <th>Name</th>
          <th class="col-ref">Reference</th>
          <th class="col-qty">Quantity</th>
          <th class="col-date">Date</th>
          <th class="col-act"><span class="sr-only" style="position:absolute;left:-9999px">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="empty" id="empty" hidden>
      <strong>No parts yet</strong>
      <span>Use “Add row” to start this machine’s list.</span>
    </div>

    <div class="panel-foot">
      <button class="btn" id="addBottom" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add row
      </button>
    </div>
  </section>

  <div class="status" id="status" aria-live="polite"></div>
</div>


<script>
(function () {
  "use strict";

  var MACHINES = ["BLM", "BCW3", "Bonal", "Sollas"];
  var STORAGE_KEY = "uii-spare-parts-v1";
  var TAB_KEY = "uii-spare-parts-active-tab";
  var FIELDS = ["name", "reference", "quantity", "date"];
  var TX = "Transaction";
  var TABS = MACHINES.concat([TX]);

  // data[machine] = [{id, name, reference, quantity, created}]
  var data = emptyData();
  var active = MACHINES[0];
  var db = null;          // shared store when running as a published artifact
  var readOnly = false;

  function emptyData() {
    var d = {};
    MACHINES.forEach(function (m) { d[m] = []; });
    return d;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function clean(r, machine) {
    return {
      id: String(r.id),
      machine: machine,
      name: String(r.name || ""),
      reference: String(r.reference || ""),
      quantity: String(r.quantity || ""),
      used: String(r.used || ""),
      date: String(r.date || ""),
      created: Number(r.created) || 0
    };
  }

  // ---- Status line ----
  var statusEl = document.getElementById("status");
  var statusTimer = null;
  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status " + (kind || "");
    clearTimeout(statusTimer);
    if (kind === "saved") {
      statusTimer = setTimeout(function () { statusEl.textContent = ""; statusEl.className = "status"; }, 1600);
    }
  }

  // ---- Local storage (used when the shared store is unavailable) ----
  function loadLocal() {
    var d = emptyData();
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        MACHINES.forEach(function (m) {
          if (Array.isArray(parsed[m])) {
            d[m] = parsed[m].map(function (r) { return clean({ id: r.id || uid(), name: r.name, reference: r.reference, quantity: r.quantity, used: r.used, date: r.date, created: r.created }, m); });
          }
        });
      }
    } catch (e) {}
    return d;
  }
  function saveLocal() {
    try {
      var out = {};
      MACHINES.forEach(function (m) {
        out[m] = data[m].map(function (r) { return { id: r.id, name: r.name, reference: r.reference, quantity: r.quantity, used: r.used, date: r.date, created: r.created }; });
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(out));
      setStatus("Saved", "saved");
    } catch (e) {
      setStatus("Not saved: this browser is blocking storage.", "error");
    }
  }

  // ---- Shared store writes: one at a time per row ----
  var queues = {};
  function enqueue(id, fn) {
    var prev = queues[id] || Promise.resolve();
    var next = prev.then(fn, fn);
    queues[id] = next.catch(function () {});
    return next;
  }
  function onWriteError(e) {
    var code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted" || code === "revoked") {
      readOnly = true;
      document.body.classList.add("readonly");
      setStatus("You can view this list but not edit it.", "error");
    } else if (code === "quota_exceeded") {
      setStatus("Storage is full. Delete unused rows to add more.", "error");
    } else {
      setStatus("Not saved. Check your connection and try again.", "error");
    }
  }
  function writeRow(row) {
    if (!db) { saveLocal(); return; }
    var body = { machine: row.machine, name: row.name, reference: row.reference, quantity: row.quantity, used: row.used, date: row.date, created: row.created };
    enqueue(row.id, function () { return db.collection("parts").doc(row.id).set(body); })
      .then(function () { setStatus("Saved", "saved"); }, onWriteError);
  }
  function removeRow(row) {
    if (!db) { saveLocal(); return; }
    enqueue(row.id, function () { return db.collection("parts").doc(row.id).delete(); })
      .then(function () { setStatus("Deleted", "saved"); }, onWriteError);
  }

  var editTimers = {};
  function scheduleWrite(row) {
    clearTimeout(editTimers[row.id]);
    editTimers[row.id] = setTimeout(function () { delete editTimers[row.id]; writeRow(row); }, 400);
  }
  function flushWrites() {
    Object.keys(editTimers).forEach(function (id) {
      clearTimeout(editTimers[id]);
      delete editTimers[id];
      var row = findRow(id);
      if (row) writeRow(row);
    });
  }
  window.addEventListener("pagehide", flushWrites);
  document.addEventListener("visibilitychange", function () { if (document.hidden) flushWrites(); });

  function findRow(id) {
    for (var i = 0; i < MACHINES.length; i++) {
      var list = data[MACHINES[i]];
      for (var j = 0; j < list.length; j++) if (list[j].id === id) return list[j];
    }
    return null;
  }

  // ---- DOM ----
  var tabsEl = document.getElementById("tabs");
  var rowsEl = document.getElementById("rows");
  var emptyEl = document.getElementById("empty");
  var panelEl = document.getElementById("panel");
  var titleEl = document.getElementById("panelTitle");
  var metaEl = document.getElementById("panelMeta");

  var TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';

  function renderTabs() {
    tabsEl.innerHTML = "";
    TABS.forEach(function (m) {
      if (m === TX) {
        var sep = document.createElement("span");
        sep.className = "tab-sep";
        sep.setAttribute("aria-hidden", "true");
        tabsEl.appendChild(sep);
      }
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (m === TX ? " tx" : "");
      b.id = "tab-" + m;
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", m === active ? "true" : "false");
      b.setAttribute("aria-controls", "panel");
      b.tabIndex = m === active ? 0 : -1;
      b.innerHTML = '<span></span><span class="count"></span>';
      b.firstChild.textContent = m;
      b.lastChild.textContent = tabCount(m);
      b.addEventListener("click", function () { switchTo(m); });
      tabsEl.appendChild(b);
    });
  }

  tabsEl.addEventListener("keydown", function (e) {
    var i = TABS.indexOf(active);
    if (e.key === "ArrowRight") i = (i + 1) % TABS.length;
    else if (e.key === "ArrowLeft") i = (i - 1 + TABS.length) % TABS.length;
    else return;
    e.preventDefault();
    switchTo(TABS[i]);
    document.getElementById("tab-" + active).focus();
  });

  function switchTo(m) {
    active = m;
    try { localStorage.setItem(TAB_KEY, m); } catch (e) {}
    renderTabs();
    renderRows();
  }

  function hasEntry(r) {
    return (r.name + r.reference + r.quantity).trim() !== "";
  }

  // Every filled-in part on every machine, newest first
  function transactions() {
    var out = [];
    MACHINES.forEach(function (m) { data[m].forEach(function (r) { if (hasEntry(r)) out.push(r); }); });
    out.sort(function (a, b) {
      if (a.date !== b.date) {
        if (!a.date) return 1;
        if (!b.date) return -1;
        return a.date < b.date ? 1 : -1;
      }
      return b.created - a.created;
    });
    return out;
  }

  function tabCount(m) {
    return m === TX ? transactions().length : data[m].length;
  }

  function updateCounts() {
    TABS.forEach(function (m) {
      var c = document.querySelector("#tab-" + m + " .count");
      if (c) c.textContent = tabCount(m);
    });
    if (active === TX) return;
    var n = data[active].length;
    metaEl.textContent = n + (n === 1 ? " part" : " parts");
    emptyEl.hidden = n !== 0;
  }

  var MACHINE_HEAD = document.getElementById("thead").innerHTML;
  var TX_HEAD = '<tr><th class="col-num">#</th><th class="col-date">Date</th><th class="col-mach">Machine</th><th>Name</th><th class="col-ref">Reference</th><th class="col-qty">Quantity</th><th class="col-used">Used</th></tr>';

  function txCell(label, text, cls) {
    var td = document.createElement("td");
    td.setAttribute("data-label", label);
    var span = document.createElement("span");
    span.className = "tx-text" + (cls ? " " + cls : "") + (text ? "" : " muted");
    span.textContent = text || "—";
    td.appendChild(span);
    return td;
  }

  function txMeta(list) {
    var pieces = 0;
    list.forEach(function (r) { pieces += parseInt(r.used, 10) || 0; });
    metaEl.textContent = list.length + (list.length === 1 ? " entry" : " entries") + " · " + pieces + (pieces === 1 ? " piece used" : " pieces used");
  }

  var txIds = "";
  function renderTransactions() {
    var list = transactions();
    txIds = list.map(function (r) { return r.id; }).join(",");
    document.getElementById("thead").innerHTML = TX_HEAD;
    titleEl.textContent = TX;
    rowsEl.innerHTML = "";
    list.forEach(function (r, i) {
      var tr = document.createElement("tr");
      var num = document.createElement("td");
      num.className = "col-num";
      num.textContent = i + 1;
      tr.appendChild(num);
      tr.appendChild(txCell("Date", r.date));
      var mtd = document.createElement("td");
      mtd.setAttribute("data-label", "Machine");
      mtd.innerHTML = '<span class="tx-text"><span class="chip"></span></span>';
      mtd.querySelector(".chip").textContent = r.machine;
      tr.appendChild(mtd);
      tr.appendChild(txCell("Name", r.name));
      tr.appendChild(txCell("Reference", r.reference));
      var q = txCell("Quantity", r.quantity, "qty");
      q.firstChild.id = "t-" + r.id + "-quantity";
      tr.appendChild(q);
      tr.appendChild(makeCell(r, "used", "Used"));
      rowsEl.appendChild(tr);
    });
    txMeta(list);
    emptyEl.querySelector("strong").textContent = "No transactions yet";
    emptyEl.querySelector("span").textContent = "Parts you add on any machine tab show up here, ready for the quantity used.";
    emptyEl.hidden = list.length !== 0;
    updateCounts();
  }

  // Same rows as on screen: update values without touching the field being typed in
  function refreshTransactions() {
    var list = transactions();
    if (list.map(function (r) { return r.id; }).join(",") !== txIds) {
      var focused = document.activeElement;
      var keep = focused && focused.id && focused.classList.contains("cell") ? focused.id : null;
      renderTransactions();
      if (keep) { var el = document.getElementById(keep); if (el) el.focus(); }
      return;
    }
    list.forEach(function (r) {
      var q = document.getElementById("t-" + r.id + "-quantity");
      if (q) { q.textContent = r.quantity || "—"; q.classList.toggle("muted", !r.quantity); }
      var u = document.getElementById("f-" + r.id + "-used");
      if (u && u !== document.activeElement && u.value !== r.used) u.value = r.used;
    });
    txMeta(list);
    updateCounts();
  }

  function makeCell(row, field, label) {
    var td = document.createElement("td");
    td.setAttribute("data-label", label);
    var input = document.createElement("input");
    input.className = "cell" + (field === "quantity" || field === "used" ? " qty" : "") + (field === "date" ? " date" : "");
    input.type = field === "date" ? "date" : "text";
    input.id = "f-" + row.id + "-" + field;
    input.value = row[field];
    input.placeholder = label;
    input.setAttribute("aria-label", label);
    input.setAttribute("data-field", field);
    input.autocomplete = "off";
    input.spellcheck = false;
    input.readOnly = readOnly;
    if (field === "quantity" || field === "used") input.inputMode = "numeric";
    if (field === "date") input.classList.toggle("blank", !input.value);
    input.addEventListener("input", function () {
      if ((field === "quantity" || field === "used") && /\D/.test(input.value)) input.value = input.value.replace(/\D/g, "");
      row[field] = input.value;
      updateCounts();
      if (active === TX) txMeta(transactions());
      if (field === "date") input.classList.toggle("blank", !input.value);
      scheduleWrite(row);
    });
    td.appendChild(input);
    return td;
  }

  function disarmAll(except) {
    rowsEl.querySelectorAll(".del.armed").forEach(function (b) {
      if (b === except) return;
      b.classList.remove("armed");
      b.innerHTML = TRASH;
      b.setAttribute("aria-label", b.getAttribute("data-label"));
    });
  }

  function renderRows(focusId) {
    panelEl.setAttribute("aria-labelledby", "tab-" + active);
    document.body.classList.toggle("tx-view", active === TX);
    if (active === TX) { renderTransactions(); return; }
    document.getElementById("thead").innerHTML = MACHINE_HEAD;
    emptyEl.querySelector("strong").textContent = "No parts yet";
    emptyEl.querySelector("span").textContent = "Use \u201CAdd row\u201D to start this machine\u2019s list.";
    titleEl.textContent = active;
    rowsEl.innerHTML = "";
    data[active].forEach(function (row, i) {
      var tr = document.createElement("tr");
      tr.setAttribute("data-id", row.id);

      var num = document.createElement("td");
      num.className = "col-num";
      num.textContent = i + 1;
      tr.appendChild(num);

      tr.appendChild(makeCell(row, "name", "Name"));
      tr.appendChild(makeCell(row, "reference", "Reference"));
      tr.appendChild(makeCell(row, "quantity", "Quantity"));
      tr.appendChild(makeCell(row, "date", "Date"));

      var act = document.createElement("td");
      act.className = "col-act";
      var del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.title = "Delete row";
      del.setAttribute("data-label", "Delete row " + (i + 1));
      del.setAttribute("aria-label", "Delete row " + (i + 1));
      del.innerHTML = TRASH;
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        var hasContent = (row.name + row.reference + row.quantity + row.used + row.date).trim() !== "";
        if (hasContent && !del.classList.contains("armed")) {
          disarmAll(del);
          del.classList.add("armed");
          del.textContent = "Delete?";
          del.setAttribute("aria-label", "Confirm delete row " + (i + 1));
          return;
        }
        deleteRow(row.id);
      });
      act.appendChild(del);
      tr.appendChild(act);

      rowsEl.appendChild(tr);

      if (row.id === focusId) {
        var first = tr.querySelector(".cell");
        setTimeout(function () {
          first.focus();
          tr.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }, 0);
      }
    });
    updateCounts();
  }

  document.addEventListener("click", function () { disarmAll(null); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") disarmAll(null); });

  function addRow() {
    if (readOnly || active === TX) return;
    var row = clean({ id: uid(), created: Date.now() }, active);
    data[active].push(row);
    writeRow(row);
    renderRows(row.id);
  }

  function deleteRow(id) {
    var list = data[active];
    var idx = list.findIndex(function (r) { return r.id === id; });
    if (idx === -1 || readOnly) return;
    var row = list[idx];
    clearTimeout(editTimers[id]);
    delete editTimers[id];
    list.splice(idx, 1);
    removeRow(row);
    renderRows();
  }

  document.getElementById("addTop").addEventListener("click", addRow);
  document.getElementById("addBottom").addEventListener("click", addRow);

  // Enter moves to the next field
  rowsEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || !e.target.classList.contains("cell")) return;
    e.preventDefault();
    var cells = Array.prototype.slice.call(rowsEl.querySelectorAll(".cell"));
    var next = cells[cells.indexOf(e.target) + 1];
    if (next) next.focus(); else e.target.blur();
  });

  // ---- Apply a snapshot from the shared store without disturbing typing ----
  function applySnapshot(snap) {
    var next = emptyData();
    snap.docs.forEach(function (d) {
      var v = d.data() || {};
      if (MACHINES.indexOf(v.machine) === -1) return;
      var row = clean({ id: d.id, name: v.name, reference: v.reference, quantity: v.quantity, used: v.used, date: v.date, created: v.created }, v.machine);
      // keep local text for rows with an edit still waiting to be sent
      var local = editTimers[d.id] && findRow(d.id);
      next[v.machine].push(local || row);
    });
    MACHINES.forEach(function (m) { next[m].sort(function (a, b) { return a.created - b.created || (a.id < b.id ? -1 : 1); }); });

    if (active === TX) { data = next; refreshTransactions(); return; }
    var before = data[active].map(function (r) { return r.id; }).join(",");
    var after = next[active].map(function (r) { return r.id; }).join(",");
    data = next;

    if (before !== after) {
      var focused = document.activeElement;
      var keep = focused && focused.id && focused.classList.contains("cell") ? focused.id : null;
      renderRows();
      if (keep) { var el = document.getElementById(keep); if (el) el.focus(); }
    } else {
      // same rows: refresh values in place, leave the field being typed in alone
      data[active].forEach(function (row) {
        FIELDS.forEach(function (f) {
          var el = document.getElementById("f-" + row.id + "-" + f);
          if (el && el !== document.activeElement && el.value !== row[f]) { el.value = row[f]; if (f === "date") el.classList.toggle("blank", !el.value); }
        });
      });
      updateCounts();
    }
    updateCounts();
  }

  // ---- Glow follows pointer (rAF-throttled) ----
  var glow = document.getElementById("glow");
  var root = document.documentElement;
  var px = window.innerWidth / 2, py = window.innerHeight * 0.3, pending = false;
  function paint() {
    root.style.setProperty("--mx", px + "px");
    root.style.setProperty("--my", py + "px");
    pending = false;
  }
  function track(x, y) {
    px = x; py = y;
    if (!pending) { pending = true; requestAnimationFrame(paint); }
  }
  window.addEventListener("pointermove", function (e) { track(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    var t = e.touches[0]; if (t) track(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener("mouseleave", function () { glow.style.opacity = "0.4"; });
  document.addEventListener("mouseenter", function () { glow.style.opacity = "1"; });
  paint();

  // ---- Boot ----
  try {
    var savedTab = localStorage.getItem(TAB_KEY);
    if (TABS.indexOf(savedTab) !== -1) active = savedTab;
  } catch (e) {}

  var useClaude = window.claude && typeof window.claude.use === "function";
  if (!useClaude) data = loadLocal();
  renderTabs();
  renderRows();

  if (useClaude) {
    setStatus("Loading…");
    window.claude.use("db").then(function (store) {
      if (!store) {
        // No shared store in this view: keep entries in this browser
        data = loadLocal();
        renderTabs();
        renderRows();
        setStatus("Saving in this browser only.", "");
        return;
      }
      db = store;
      setStatus("");
      db.collection("parts").onSnapshot(applySnapshot, function () {
        setStatus("Lost connection to saved data. Reload the page.", "error");
      });
    });
  }
})();
</script>
</body>
</html>

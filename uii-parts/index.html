<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>UII Spare Parts</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: rgba(20, 24, 33, 0.86);
    --surface-2: rgba(28, 33, 45, 0.9);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #e8ebf2;
    --muted: #8a93a6;
    --accent: #5b9dff;
    --accent-soft: rgba(91, 157, 255, 0.14);
    --danger: #ff6b6b;
    --danger-soft: rgba(255, 107, 107, 0.12);
    --radius: 14px;
    --mx: 50vw;
    --my: 30vh;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Cursor-following glow: sits behind all content, never intercepts input */
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(520px circle at var(--mx) var(--my), rgba(91, 157, 255, 0.10), transparent 60%),
      radial-gradient(180px circle at var(--mx) var(--my), rgba(140, 190, 255, 0.07), transparent 70%);
    transition: opacity 0.4s ease;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    margin: 0 auto;
    padding: 40px 16px 64px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
  }
  .btn-export { border-color: rgba(127,214,164,0.4); color: #bfeccf; }
  .btn-export:hover { border-color: rgba(127,214,164,0.7); background: rgba(127,214,164,0.1); box-shadow: 0 0 0 3px rgba(127,214,164,0.08); }
  .btn-export:disabled { opacity: 0.6; cursor: progress; transform: none; }

  h1 {
    margin: 0;
    font-size: clamp(40px, 9vw, 64px);
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #a9c6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Monthly sheets */
  .months-wrap {
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .months { display: flex; align-items: center; gap: 6px; padding-bottom: 4px; width: max-content; }
  .year {
    padding: 0 4px 0 2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .year-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-right: 6px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  .year-switch .year { min-width: 44px; padding: 0 2px; text-align: center; color: var(--text); font-size: 13px; }
  .year-switch .year.has-data { color: #cfe0ff; }
  .year-nav {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .year-nav:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
  .year-nav:disabled { opacity: 0.25; cursor: default; }
  .month {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .month:hover { color: var(--text); border-color: var(--border-strong); }
  .month[aria-current="true"] { color: #06101f; background: var(--accent); border-color: var(--accent); }
  .month .dot { display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; vertical-align: middle; }

  /* Copy parts into an empty month */
  .copy-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px 16px;
    margin-bottom: 12px;
    padding: 14px 16px;
    border: 1px dashed rgba(91,157,255,0.45);
    border-radius: var(--radius);
    background: rgba(91,157,255,0.07);
  }
  .copy-banner strong { display: block; font-size: 15px; }
  .copy-banner span { color: var(--muted); font-size: 13px; }
  .copy-banner[hidden], body.readonly .copy-banner { display: none; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
    scrollbar-width: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .tab[aria-selected="true"] {
    color: var(--text);
    background: var(--accent-soft);
    border-color: rgba(91, 157, 255, 0.35);
  }
  .tab .count {
    min-width: 22px;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }
  .tab[aria-selected="true"] .count { background: rgba(91,157,255,0.22); color: #cfe0ff; }

  /* Panel */
  .panel {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .panel-head .meta { color: var(--muted); font-size: 13px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .btn:hover {
    border-color: rgba(91,157,255,0.5);
    background: rgba(91,157,255,0.12);
    box-shadow: 0 0 0 3px rgba(91,157,255,0.08);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #06101f; }
  .btn-primary:hover { background: #77afff; border-color: #77afff; }
  .btn svg { width: 16px; height: 16px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 12px 18px;
    text-align: left;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  th.col-num, td.col-num { width: 48px; text-align: center; padding-left: 12px; padding-right: 0; }
  th.col-qty { width: 11%; }
  th.col-price { width: 11%; }
  th.col-ref { width: 21%; }
  th.col-date { width: 14%; }
  .cell.date { min-height: 39px; }
  .cell.date::-webkit-calendar-picker-indicator { opacity: 0.6; cursor: pointer; }
  .cell.date.blank { color: var(--muted); }
  th.col-act, td.col-act { width: 56px; text-align: right; }
  th.col-mach { width: 9%; }
  body.tx-view th.col-ref { width: 16%; }
  th.col-when { width: 15%; }
  th.col-type { width: 8%; }
  th.col-change { width: 9%; }
  th.col-after { width: 9%; }
  .tx-text.when { font-variant-numeric: tabular-nums; white-space: pre; }
  .tx-text.pos { color: #7fd6a4; }
  .tx-text.neg { color: var(--danger); }
  .tx-text.after { font-variant-numeric: tabular-nums; }
  .chip.chip-in { background: rgba(127,214,164,0.12); border-color: rgba(127,214,164,0.35); color: #a9e8c4; }
  .chip.chip-out { background: var(--danger-soft); border-color: rgba(255,107,107,0.35); color: #ffb3b3; }
  .tx-text { display: block; padding: 8px 10px; min-height: 39px; overflow-wrap: anywhere; }
  .tx-text.muted { color: var(--muted); }
  .tx-text.qty { font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid rgba(91,157,255,0.3);
    color: #cfe0ff;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tab.tx { color: #b9c6dc; }
  .tab-sep { flex: 0 0 1px; align-self: stretch; margin: 6px 2px; background: var(--border-strong); }
  body.tx-view .add-group, body.tx-view .panel-foot { display: none; }
  .tx-filter { display: none; flex-wrap: wrap; gap: 6px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  body.tx-view .tx-filter { display: flex; }
  .tx-filter button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tx-filter button:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .tx-filter button[aria-pressed="true"] { color: var(--text); background: var(--accent-soft); border-color: rgba(91,157,255,0.5); }
  .tx-filter .count { min-width: 18px; padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,0.07); font-size: 11px; text-align: center; }

  tbody tr { transition: background 0.15s ease; }
  tbody tr + tr td { border-top: 1px solid var(--border); }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  /* Rows added with New arrival */
  tbody tr.arrival { background: rgba(127,214,164,0.13); }
  tbody tr.arrival:hover { background: rgba(127,214,164,0.18); }
  tbody tr.arrival td:first-child { box-shadow: inset 4px 0 0 #7fd6a4; color: #a9e8c4; font-weight: 700; }
  tbody tr.arrival .cell { border-color: rgba(127,214,164,0.25); }
  .btn.btn-arrival { background: rgba(127,214,164,0.16); border-color: rgba(127,214,164,0.55); color: #c6f1d8; }
  .btn.btn-arrival:hover { background: rgba(127,214,164,0.26); border-color: #7fd6a4; box-shadow: 0 0 0 3px rgba(127,214,164,0.1); }
  tbody td { padding: 6px 18px; vertical-align: middle; }
  td.col-num { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .cell {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .cell::placeholder { color: rgba(138,147,166,0.45); }
  tbody tr:hover .cell { border-color: var(--border); }
  .cell:focus {
    outline: none;
    border-color: rgba(91,157,255,0.6);
    background: rgba(91,157,255,0.06);
  }
  .cell.qty { font-variant-numeric: tabular-nums; }

  .del {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  tbody tr:hover .del { opacity: 1; }
  .del:hover, .del:focus-visible {
    opacity: 1;
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(255,107,107,0.3);
    outline: none;
  }
  .del svg { width: 16px; height: 16px; }
  .del.armed {
    width: auto;
    padding: 0 10px;
    opacity: 1;
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(255,107,107,0.45);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  body.readonly .add-group, body.readonly .panel-foot, body.readonly .del { display: none; }

  .empty {
    padding: 48px 18px;
    text-align: center;
    color: var(--muted);
  }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  .add-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .panel-foot {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
  }

  .status {
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
    min-height: 18px;
    transition: color 0.3s ease;
  }
  .status.saved { color: #7fd6a4; }
  .status.error { color: var(--danger); }

  /* Mobile: rows become cards */
  @media (max-width: 640px) {
    .wrap { padding-top: 28px; }
    .panel-head { padding: 14px; }
    .add-group .btn { padding: 8px 10px; font-size: 14px; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
    .tab.tx { grid-column: 1 / -1; }
    .tab-sep { display: none; }
    .tab { padding: 9px 4px; gap: 5px; font-size: 14px; min-width: 0; }
    .tab .count { min-width: 18px; padding: 1px 5px; font-size: 11px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      position: relative;
      padding: 10px 14px 12px;
    }
    tbody tr + tr td { border-top: 0; }
    tbody tr + tr { border-top: 1px solid var(--border); }
    tbody td { padding: 3px 0; }
    td.col-num {
      width: auto;
      text-align: left;
      padding: 0 0 4px;
      font-size: 12px;
    }
    td.col-num::before { content: "#"; }
    tbody tr.arrival { box-shadow: inset 4px 0 0 #7fd6a4; }
    tbody tr.arrival td:first-child { box-shadow: none; }
    tbody tr.arrival td.col-num::after {
      content: "New arrival";
      margin-left: 8px;
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(127,214,164,0.18);
      color: #c6f1d8;
      font-size: 11px;
      font-weight: 600;
    }
    td[data-label] {
      display: grid;
      grid-template-columns: 82px 1fr;
      align-items: center;
      gap: 8px;
    }
    td[data-label]::before {
      content: attr(data-label);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .cell { border-color: var(--border); background: rgba(255,255,255,0.02); font-size: 16px; }
    td.col-act { position: absolute; top: 6px; right: 10px; width: auto; padding: 0; }
    .del { opacity: 1; }
    .panel-foot { padding: 12px 14px; }
    .panel-foot { flex-direction: column; }
    .panel-foot .btn { width: 100%; justify-content: center; }
  }

  @media (hover: none) {
    .glow { opacity: 0.7; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="glow" id="glow" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div>
      <h1>UII</h1>
      <p class="subtitle">Machine Spare Parts Register</p>
    </div>
    <button class="btn btn-export" id="exportBtn" type="button" title="Download this month as an Excel file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 13l6 5M15 13l-6 5"/></svg>
      <span id="exportLabel">Export to Excel</span>
    </button>
  </header>

  <div class="months-wrap">
    <nav class="months" id="months" aria-label="Monthly sheets"></nav>
  </div>

  <div class="copy-banner" id="copyBanner" hidden>
    <div>
      <strong id="copyTitle"></strong>
      <span id="copyText"></span>
    </div>
    <button class="btn btn-primary" id="copyBtn" type="button"></button>
  </div>

  <nav class="tabs" role="tablist" id="tabs" aria-label="Sections"></nav>

  <section class="panel" role="tabpanel" id="panel" aria-labelledby="">
    <div class="panel-head">
      <div>
        <h2 id="panelTitle"></h2>
        <div class="meta" id="panelMeta"></div>
      </div>
      <div class="add-group">
        <button class="btn" id="addTop" type="button" title="Add a part you already have in stock. Its starting quantity is not recorded as a transaction.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add part</span>
        </button>
        <button class="btn btn-arrival" id="recvTop" type="button" title="Add a part that just arrived. Its quantity is recorded as In.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
          <span>New arrival</span>
        </button>
      </div>
    </div>

    <div class="tx-filter" id="txFilter" role="group" aria-label="Show transactions for"></div>

    <table>
      <thead id="thead">
        <tr>
          <th class="col-num">#</th>
          <th>Name</th>
          <th class="col-ref">Reference</th>
          <th class="col-qty">Quantity</th>
          <th class="col-price">Price</th>
          <th class="col-date">Date</th>
          <th class="col-act"><span class="sr-only" style="position:absolute;left:-9999px">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="empty" id="empty" hidden>
      <strong>No parts yet</strong>
      <span>Use “Add part” for stock you already have, or “New arrival” for parts that just came in.</span>
    </div>

    <div class="panel-foot">
      <button class="btn" id="addBottom" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add part
      </button>
      <button class="btn btn-arrival" id="recvBottom" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
        New arrival
      </button>
    </div>
  </section>

  <div class="status" id="status" aria-live="polite"></div>
</div>


<script>
(function () {
  "use strict";

  var MACHINES = ["BLM", "BCW3", "Bonal", "Sollas"];
  var STORAGE_KEY = "uii-spare-parts-v1";
  var TX_KEY = "uii-spare-parts-tx-v1";
  var TAB_KEY = "uii-spare-parts-active-tab";
  var MONTH_KEY = "uii-spare-parts-month";
  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  // One sheet per month from September 2026. The list runs to December of the
  // current year (at least 2027), so each new year appears on its own.
  var FIRST_YEAR = 2026;
  var LAST_YEAR = Math.max(2027, new Date().getFullYear());
  var MONTHS = [];
  (function () {
    for (var y = FIRST_YEAR; y <= LAST_YEAR; y++) {
      for (var mo = y === FIRST_YEAR ? 9 : 1; mo <= 12; mo++) MONTHS.push(y + "-" + (mo < 10 ? "0" : "") + mo);
    }

  // ---- Local storage (used when the shared store is unavailable) ----

  // ---- Transactions: a finished quantity edit logs the difference ----

  var MACHINE_HEAD = document.getElementById("thead").innerHTML;

  function makeCell(row, field, label) {

    exportBtn.title = "Download " + monthLabel(month) + " as an Excel file";
    document.getElementById("exportLabel").textContent = "Export " + MONTH_NAMES[parseInt(month.slice(5), 10) - 1].slice(0, 3) + " " + month.slice(0, 4) + " to Excel";
  }

  // ---- Glow follows pointer (rAF-throttled) ----
  var glow = document.getElementById("glow");
  var root = document.documentElement;
  var px = window.innerWidth / 2, py = window.innerHeight * 0.3, pending = false;
  function paint() {
    root.style.setProperty("--mx", px + "px");
    root.style.setProperty("--my", py + "px");
    pending = false;
  }
  function track(x, y) {
    px = x; py = y;
    if (!pending) { pending = true; requestAnimationFrame(paint); }
  }
  window.addEventListener("pointermove", function (e) { track(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    var t = e.touches[0]; if (t) track(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener("mouseleave", function () { glow.style.opacity = "0.4"; });
  document.addEventListener("mouseenter", function () { glow.style.opacity = "1"; });
  paint();

  // ---- Boot ----
  try {
    var savedTab = localStorage.getItem(TAB_KEY);
    if (TABS.indexOf(savedTab) !== -1) active = savedTab;
    var savedMonth = localStorage.getItem(MONTH_KEY);
    if (MONTHS.indexOf(savedMonth) !== -1) month = savedMonth;
  } catch (e) {}
  openSheet();

  var useClaude = window.claude && typeof window.claude.use === "function";
  if (!useClaude) loadLocal();
  renderMonths();
  renderTabs();
  renderRows();

  if (useClaude) {
    setStatus("Loading…");
    window.claude.use("db").then(function (store) {
      if (!store) {
        // No shared store in this view: keep entries in this browser
        loadLocal();
        renderMonths();
        renderTabs();
        renderRows();
        setStatus("Saving in this browser only.", "");
        return;
      }
      db = store;
      setStatus("");
      var lost = function () { setStatus("Lost connection to saved data. Reload the page.", "error"); };
      db.collection("parts").onSnapshot(applyParts, lost);
      db.collection("transactions").onSnapshot(applyTx, lost);
    });
  }
})();
</script>
</body>
</html>

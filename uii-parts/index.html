<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>UII Spare Parts</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: rgba(20, 24, 33, 0.86);
    --surface-2: rgba(28, 33, 45, 0.9);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #e8ebf2;
    --muted: #8a93a6;
    --accent: #5b9dff;
    --accent-soft: rgba(91, 157, 255, 0.14);
    --danger: #ff6b6b;
    --danger-soft: rgba(255, 107, 107, 0.12);
    --radius: 14px;
    --mx: 50vw;
    --my: 30vh;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Cursor-following glow: sits behind all content, never intercepts input */
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(520px circle at var(--mx) var(--my), rgba(91, 157, 255, 0.10), transparent 60%),
      radial-gradient(180px circle at var(--mx) var(--my), rgba(140, 190, 255, 0.07), transparent 70%);
    transition: opacity 0.4s ease;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    margin: 0 auto;
    padding: 40px 16px 64px;
  }

  header { margin-bottom: 28px; }

  h1 {
    margin: 0;
    font-size: clamp(40px, 9vw, 64px);
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #a9c6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Monthly sheets */
  .months-wrap {
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .months { display: flex; align-items: center; gap: 6px; padding-bottom: 4px; width: max-content; }
  .year {
    padding: 0 4px 0 2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .year + .month { margin-left: 0; }
  .month + .year { margin-left: 10px; padding-left: 12px; border-left: 1px solid var(--border-strong); }
  .month {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .month:hover { color: var(--text); border-color: var(--border-strong); }
  .month[aria-current="true"] { color: #06101f; background: var(--accent); border-color: var(--accent); }
  .month .dot { display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; vertical-align: middle; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
    scrollbar-width: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .tab[aria-selected="true"] {
    color: var(--text);
    background: var(--accent-soft);
    border-color: rgba(91, 157, 255, 0.35);
  }
  .tab .count {
    min-width: 22px;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }
  .tab[aria-selected="true"] .count { background: rgba(91,157,255,0.22); color: #cfe0ff; }

  /* Panel */
  .panel {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .panel-head .meta { color: var(--muted); font-size: 13px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .btn:hover {
    border-color: rgba(91,157,255,0.5);
    background: rgba(91,157,255,0.12);
    box-shadow: 0 0 0 3px rgba(91,157,255,0.08);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #06101f; }
  .btn-primary:hover { background: #77afff; border-color: #77afff; }
  .btn svg { width: 16px; height: 16px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 12px 18px;
    text-align: left;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  th.col-num, td.col-num { width: 48px; text-align: center; padding-left: 12px; padding-right: 0; }
  th.col-qty { width: 12%; }
  th.col-ref { width: 24%; }
  th.col-date { width: 14%; }
  .cell.date { min-height: 39px; }
  .cell.date::-webkit-calendar-picker-indicator { opacity: 0.6; cursor: pointer; }
  .cell.date.blank { color: var(--muted); }
  th.col-act, td.col-act { width: 56px; text-align: right; }
  th.col-mach { width: 9%; }
  body.tx-view th.col-ref { width: 16%; }
  th.col-when { width: 15%; }
  th.col-type { width: 8%; }
  th.col-change { width: 9%; }
  th.col-after { width: 9%; }
  .tx-text.when { font-variant-numeric: tabular-nums; white-space: pre; }
  .tx-text.pos { color: #7fd6a4; }
  .tx-text.neg { color: var(--danger); }
  .tx-text.after { font-variant-numeric: tabular-nums; }
  .chip.chip-in { background: rgba(127,214,164,0.12); border-color: rgba(127,214,164,0.35); color: #a9e8c4; }
  .chip.chip-out { background: var(--danger-soft); border-color: rgba(255,107,107,0.35); color: #ffb3b3; }
  .tx-text { display: block; padding: 8px 10px; min-height: 39px; overflow-wrap: anywhere; }
  .tx-text.muted { color: var(--muted); }
  .tx-text.qty { font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid rgba(91,157,255,0.3);
    color: #cfe0ff;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tab.tx { color: #b9c6dc; }
  .tab-sep { flex: 0 0 1px; align-self: stretch; margin: 6px 2px; background: var(--border-strong); }
  body.tx-view .add-group, body.tx-view .panel-foot { display: none; }

  tbody tr { transition: background 0.15s ease; }
  tbody tr + tr td { border-top: 1px solid var(--border); }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td { padding: 6px 18px; vertical-align: middle; }
  td.col-num { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .cell {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .cell::placeholder { color: rgba(138,147,166,0.45); }
  tbody tr:hover .cell { border-color: var(--border); }
  .cell:focus {
    outline: none;
    border-color: rgba(91,157,255,0.6);
    background: rgba(91,157,255,0.06);
  }
  .cell.qty { font-variant-numeric: tabular-nums; }

  .del {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  tbody tr:hover .del { opacity: 1; }
  .del:hover, .del:focus-visible {
    opacity: 1;
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(255,107,107,0.3);
    outline: none;
  }
  .del svg { width: 16px; height: 16px; }
  .del.armed {
    width: auto;
    padding: 0 10px;
    opacity: 1;
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(255,107,107,0.45);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  body.readonly .add-group, body.readonly .panel-foot, body.readonly .del { display: none; }

  .empty {
    padding: 48px 18px;
    text-align: center;
    color: var(--muted);
  }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  .add-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .panel-foot {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
  }

  .status {
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
    min-height: 18px;
    transition: color 0.3s ease;
  }
  .status.saved { color: #7fd6a4; }
  .status.error { color: var(--danger); }

  /* Mobile: rows become cards */
  @media (max-width: 640px) {
    .wrap { padding-top: 28px; }
    .panel-head { padding: 14px; }
    .add-group .btn { padding: 8px 10px; font-size: 14px; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
    .tab.tx { grid-column: 1 / -1; }
    .tab-sep { display: none; }
    .tab { padding: 9px 4px; gap: 5px; font-size: 14px; min-width: 0; }
    .tab .count { min-width: 18px; padding: 1px 5px; font-size: 11px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      position: relative;
      padding: 10px 14px 12px;
    }
    tbody tr + tr td { border-top: 0; }
    tbody tr + tr { border-top: 1px solid var(--border); }
    tbody td { padding: 3px 0; }
    td.col-num {
      width: auto;
      text-align: left;
      padding: 0 0 4px;
      font-size: 12px;
    }
    td.col-num::before { content: "#"; }
    td[data-label] {
      display: grid;
      grid-template-columns: 82px 1fr;
      align-items: center;
      gap: 8px;
    }
    td[data-label]::before {
      content: attr(data-label);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .cell { border-color: var(--border); background: rgba(255,255,255,0.02); font-size: 16px; }
    td.col-act { position: absolute; top: 6px; right: 10px; width: auto; padding: 0; }
    .del { opacity: 1; }
    .panel-foot { padding: 12px 14px; }
    .panel-foot { flex-direction: column; }
    .panel-foot .btn { width: 100%; justify-content: center; }
  }

  @media (hover: none) {
    .glow { opacity: 0.7; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="glow" id="glow" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1>UII</h1>
    <p class="subtitle">Machine Spare Parts Register</p>
  </header>

  <div class="months-wrap">
    <nav class="months" id="months" aria-label="Monthly sheets"></nav>
  </div>

  <nav class="tabs" role="tablist" id="tabs" aria-label="Sections"></nav>

  <section class="panel" role="tabpanel" id="panel" aria-labelledby="">
    <div class="panel-head">
      <div>
        <h2 id="panelTitle"></h2>
        <div class="meta" id="panelMeta"></div>
      </div>
      <div class="add-group">
        <button class="btn" id="addTop" type="button" title="Add a part you already have in stock. Its starting quantity is not recorded as a transaction.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add part</span>
        </button>
        <button class="btn btn-primary" id="recvTop" type="button" title="Add a part that just arrived. Its quantity is recorded as In.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
          <span>New arrival</span>
        </button>
      </div>
    </div>

    <table>
      <thead id="thead">
        <tr>
          <th class="col-num">#</th>
          <th>Name</th>
          <th class="col-ref">Reference</th>
          <th class="col-qty">Quantity</th>
          <th class="col-date">Date</th>
          <th class="col-act"><span class="sr-only" style="position:absolute;left:-9999px">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="empty" id="empty" hidden>
      <strong>No parts yet</strong>
      <span>Use “Add part” for stock you already have, or “New arrival” for parts that just came in.</span>
    </div>

    <div class="panel-foot">
      <button class="btn" id="addBottom" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add part
      </button>
      <button class="btn" id="recvBottom" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
        New arrival
      </button>
    </div>
  </section>

  <div class="status" id="status" aria-live="polite"></div>
</div>


<script>
(function () {
  "use strict";

  var MACHINES = ["BLM", "BCW3", "Bonal", "Sollas"];
  var STORAGE_KEY = "uii-spare-parts-v1";
  var TX_KEY = "uii-spare-parts-tx-v1";
  var TAB_KEY = "uii-spare-parts-active-tab";
  var MONTH_KEY = "uii-spare-parts-month";
  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  // One sheet per month, September 2026 to December 2027
  var MONTHS = [];
  (function () {
    for (var y = 2026, mo = 9; y < 2028; mo++) {
      if (mo > 12) { mo = 1; y++; if (y === 2028) break; }
      MONTHS.push(y + "-" + (mo < 10 ? "0" : "") + mo);
    }
  })();
  function monthLabel(key) { return MONTH_NAMES[parseInt(key.slice(5), 10) - 1] + " " + key.slice(0, 4); }
  // Month a record belongs to; older records without one use the month they were created in
  function monthOf(v, ts) {
    if (MONTHS.indexOf(v) !== -1) return v;
    var d = new Date(ts || Date.now());
    var k = d.getFullYear() + "-" + (d.getMonth() < 9 ? "0" : "") + (d.getMonth() + 1);
    if (MONTHS.indexOf(k) !== -1) return k;
    return k < MONTHS[0] ? MONTHS[0] : MONTHS[MONTHS.length - 1];
  }
  var FIELDS = ["name", "reference", "quantity", "date"];
  var TX = "Transaction";
  var TABS = MACHINES.concat([TX]);

  // data[machine] = [{id, machine, name, reference, quantity, loggedQty, date, created}]
  // loggedQty is the stock level the last transaction left the part at.
  // allParts[month][machine] = rows; allTx[month] = transactions.
  // data and txList are the open month's sheet.
  var allParts = {};
  var allTx = {};
  var month = monthOf(null, Date.now());
  var data = emptyData();
  // txList = [{id, partId, month, machine, name, reference, change, after, ts}], newest first
  var txList = [];
  function openSheet() {
    if (!allParts[month]) allParts[month] = emptyData();
    if (!allTx[month]) allTx[month] = [];
    data = allParts[month];
    txList = allTx[month];
  }
  var active = MACHINES[0];
  var db = null;          // shared store when running as a published artifact
  var readOnly = false;

  function emptyData() {
    var d = {};
    MACHINES.forEach(function (m) { d[m] = []; });
    return d;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function clean(r, machine) {
    var qty = String(r.quantity || "");
    return {
      id: String(r.id),
      month: monthOf(r.month, r.created),
      machine: machine,
      name: String(r.name || ""),
      reference: String(r.reference || ""),
      quantity: qty,
      // parts saved before transactions existed start from their current stock
      loggedQty: r.loggedQty == null ? qty : String(r.loggedQty),
      date: String(r.date || ""),
      baseline: !!r.baseline,
      created: Number(r.created) || 0
    };
  }

  function cleanTx(t, id) {
    return {
      id: String(id || t.id),
      partId: String(t.partId || ""),
      month: monthOf(t.month, t.ts),
      machine: String(t.machine || ""),
      name: String(t.name || ""),
      reference: String(t.reference || ""),
      change: Number(t.change) || 0,
      after: Number(t.after) || 0,
      ts: Number(t.ts) || 0
    };
  }

  function rowBody(r) {
    return { month: r.month, machine: r.machine, name: r.name, reference: r.reference, quantity: r.quantity, loggedQty: r.loggedQty, date: r.date, baseline: r.baseline, created: r.created };
  }
  function txBody(t) {
    return { partId: t.partId, month: t.month, machine: t.machine, name: t.name, reference: t.reference, change: t.change, after: t.after, ts: t.ts };
  }
  function sortTx(list) {
    list.sort(function (a, b) { return b.ts - a.ts || (a.id < b.id ? 1 : -1); });
  }

  // ---- Status line ----
  var statusEl = document.getElementById("status");
  var statusTimer = null;
  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status " + (kind || "");
    clearTimeout(statusTimer);
    if (kind === "saved") {
      statusTimer = setTimeout(function () { statusEl.textContent = ""; statusEl.className = "status"; }, 1600);
    }
  }

  // ---- Local storage (used when the shared store is unavailable) ----
  function loadLocal() {
    allParts = {};
    allTx = {};
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        // v2 keeps a flat list with each row's month; v1 grouped rows by machine
        var rows = Array.isArray(parsed.parts) ? parsed.parts : [];
        MACHINES.forEach(function (m) {
          if (Array.isArray(parsed[m])) parsed[m].forEach(function (r) { r.machine = m; rows.push(r); });
        });
        rows.forEach(function (r) {
          if (MACHINES.indexOf(r.machine) === -1) return;
          var row = clean({ id: r.id || uid(), month: r.month, name: r.name, reference: r.reference, quantity: r.quantity, loggedQty: r.loggedQty, date: r.date, baseline: r.baseline, created: r.created }, r.machine);
          if (!allParts[row.month]) allParts[row.month] = emptyData();
          allParts[row.month][row.machine].push(row);
        });
      }
      var rawTx = localStorage.getItem(TX_KEY);
      if (rawTx) {
        var arr = JSON.parse(rawTx);
        if (Array.isArray(arr)) arr.forEach(function (t) {
          var tx = cleanTx(t);
          (allTx[tx.month] = allTx[tx.month] || []).push(tx);
        });
      }
    } catch (e) {}
    Object.keys(allTx).forEach(function (k) { sortTx(allTx[k]); });
    openSheet();
  }
  function saveLocal() {
    try {
      var parts = [], txs = [];
      Object.keys(allParts).forEach(function (k) {
        MACHINES.forEach(function (m) {
          allParts[k][m].forEach(function (r) { var b = rowBody(r); b.id = r.id; parts.push(b); });
        });
      });
      Object.keys(allTx).forEach(function (k) {
        allTx[k].forEach(function (t) { var b = txBody(t); b.id = t.id; txs.push(b); });
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ parts: parts }));
      localStorage.setItem(TX_KEY, JSON.stringify(txs));
      setStatus("Saved", "saved");
    } catch (e) {
      setStatus("Not saved: this browser is blocking storage.", "error");
    }
  }

  // ---- Shared store writes: one at a time per document ----
  var queues = {};
  function enqueue(id, fn) {
    var prev = queues[id] || Promise.resolve();
    var next = prev.then(fn, fn);
    queues[id] = next.catch(function () {});
    return next;
  }
  function onWriteError(e) {
    var code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted" || code === "revoked") {
      readOnly = true;
      document.body.classList.add("readonly");
      setStatus("You can view this list but not edit it.", "error");
    } else if (code === "quota_exceeded") {
      setStatus("Storage is full. Delete unused rows to add more.", "error");
    } else {
      setStatus("Not saved. Check your connection and try again.", "error");
    }
  }
  function saveDoc(coll, id, body) {
    if (!db) { saveLocal(); return; }
    enqueue(coll + "/" + id, function () { return db.collection(coll).doc(id).set(body); })
      .then(function () { setStatus("Saved", "saved"); }, onWriteError);
  }
  function deleteDoc(coll, id) {
    if (!db) { saveLocal(); return; }
    enqueue(coll + "/" + id, function () { return db.collection(coll).doc(id).delete(); })
      .then(function () { setStatus("Deleted", "saved"); }, onWriteError);
  }
  function writeRow(row) { saveDoc("parts", row.id, rowBody(row)); }

  var editTimers = {};
  function scheduleWrite(row) {
    clearTimeout(editTimers[row.id]);
    editTimers[row.id] = setTimeout(function () { delete editTimers[row.id]; writeRow(findRow(row.id) || row); }, 400);
  }
  function flushWrites() {
    var el = document.activeElement;
    if (el && el.getAttribute && el.getAttribute("data-field") === "quantity") {
      var r = findRow(el.getAttribute("data-row"));
      if (r) commitQuantity(r);
    }
    Object.keys(editTimers).forEach(function (id) {
      clearTimeout(editTimers[id]);
      delete editTimers[id];
      var row = findRow(id);
      if (row) writeRow(row);
    });
  }
  window.addEventListener("pagehide", flushWrites);
  document.addEventListener("visibilitychange", function () { if (document.hidden) flushWrites(); });

  function findRow(id) {
    for (var i = 0; i < MACHINES.length; i++) {
      var list = data[MACHINES[i]];
      for (var j = 0; j < list.length; j++) if (list[j].id === id) return list[j];
    }
    return null;
  }

  // ---- Transactions: a finished quantity edit logs the difference ----
  function commitQuantity(row) {
    var before = parseInt(row.loggedQty, 10) || 0;
    var after = parseInt(row.quantity, 10) || 0;
    if (before === after) return;
    if (row.baseline) {
      // starting stock for a part already on the shelf: no transaction
      row.baseline = false;
      row.loggedQty = row.quantity;
      clearTimeout(editTimers[row.id]);
      delete editTimers[row.id];
      writeRow(row);
      return;
    }
    var tx = cleanTx({
      partId: row.id, month: row.month, machine: row.machine, name: row.name, reference: row.reference,
      change: after - before, after: after, ts: Date.now()
    }, uid());
    row.loggedQty = row.quantity;
    clearTimeout(editTimers[row.id]);
    delete editTimers[row.id];
    txList.unshift(tx);
    writeRow(row);
    saveDoc("transactions", tx.id, txBody(tx));
    updateCounts();
  }

  // ---- DOM ----
  var tabsEl = document.getElementById("tabs");
  var rowsEl = document.getElementById("rows");
  var emptyEl = document.getElementById("empty");
  var panelEl = document.getElementById("panel");
  var titleEl = document.getElementById("panelTitle");
  var metaEl = document.getElementById("panelMeta");

  var TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';

  var monthsEl = document.getElementById("months");
  function monthHasData(k) {
    var p = allParts[k];
    var n = allTx[k] ? allTx[k].length : 0;
    if (p) MACHINES.forEach(function (m) { n += p[m].length; });
    return n > 0;
  }
  function renderMonths() {
    monthsEl.innerHTML = "";
    var year = "";
    MONTHS.forEach(function (k) {
      if (k.slice(0, 4) !== year) {
        year = k.slice(0, 4);
        var y = document.createElement("span");
        y.className = "year";
        y.textContent = year;
        monthsEl.appendChild(y);
      }
      var b = document.createElement("button");
      b.type = "button";
      b.className = "month";
      b.id = "month-" + k;
      b.title = monthLabel(k);
      b.textContent = MONTH_NAMES[parseInt(k.slice(5), 10) - 1].slice(0, 3);
      if (monthHasData(k)) {
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.setAttribute("aria-label", "has entries");
        b.appendChild(dot);
      }
      if (k === month) b.setAttribute("aria-current", "true");
      b.addEventListener("click", function () { selectMonth(k); });
      monthsEl.appendChild(b);
    });
  }
  function selectMonth(k) {
    if (k === month) return;
    flushWrites();
    month = k;
    try { localStorage.setItem(MONTH_KEY, k); } catch (e) {}
    openSheet();
    renderMonths();
    renderTabs();
    renderRows();
    var b = document.getElementById("month-" + k);
    if (b && b.scrollIntoView) b.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    TABS.forEach(function (m) {
      if (m === TX) {
        var sep = document.createElement("span");
        sep.className = "tab-sep";
        sep.setAttribute("aria-hidden", "true");
        tabsEl.appendChild(sep);
      }
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (m === TX ? " tx" : "");
      b.id = "tab-" + m;
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", m === active ? "true" : "false");
      b.setAttribute("aria-controls", "panel");
      b.tabIndex = m === active ? 0 : -1;
      b.innerHTML = '<span></span><span class="count"></span>';
      b.firstChild.textContent = m;
      b.lastChild.textContent = tabCount(m);
      b.addEventListener("click", function () { switchTo(m); });
      tabsEl.appendChild(b);
    });
  }

  tabsEl.addEventListener("keydown", function (e) {
    var i = TABS.indexOf(active);
    if (e.key === "ArrowRight") i = (i + 1) % TABS.length;
    else if (e.key === "ArrowLeft") i = (i - 1 + TABS.length) % TABS.length;
    else return;
    e.preventDefault();
    switchTo(TABS[i]);
    document.getElementById("tab-" + active).focus();
  });

  function switchTo(m) {
    active = m;
    try { localStorage.setItem(TAB_KEY, m); } catch (e) {}
    renderTabs();
    renderRows();
  }

  function tabCount(m) {
    return m === TX ? txList.length : data[m].length;
  }

  function updateCounts() {
    renderMonths();
    TABS.forEach(function (m) {
      var c = document.querySelector("#tab-" + m + " .count");
      if (c) c.textContent = tabCount(m);
    });
    if (active === TX) return;
    var n = data[active].length;
    metaEl.textContent = monthLabel(month) + " \u00B7 " + n + (n === 1 ? " part" : " parts");
    emptyEl.hidden = n !== 0;
  }

  var MACHINE_HEAD = document.getElementById("thead").innerHTML;
  var TX_HEAD = '<tr><th class="col-num">#</th><th class="col-when">Date</th><th class="col-mach">Machine</th><th>Name</th><th class="col-ref">Reference</th><th class="col-type">Type</th><th class="col-change">Quantity</th><th class="col-after">Stock after</th><th class="col-act"><span style="position:absolute;left:-9999px">Actions</span></th></tr>';

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTime(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "  " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function txCell(label, text, cls) {
    var td = document.createElement("td");
    td.setAttribute("data-label", label);
    var span = document.createElement("span");
    span.dir = "auto";
    span.className = "tx-text" + (cls ? " " + cls : "") + (text ? "" : " muted");
    span.textContent = text || "—";
    td.appendChild(span);
    return td;
  }

  function disarmAll(except) {
    rowsEl.querySelectorAll(".del.armed").forEach(function (b) {
      if (b === except) return;
      b.classList.remove("armed");
      b.innerHTML = TRASH;
      b.setAttribute("aria-label", b.getAttribute("data-label"));
    });
  }

  // Trash button; asks "Delete?" first when `needsConfirm` says so
  function deleteButton(label, needsConfirm, onDelete) {
    var del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.title = "Delete";
    del.setAttribute("data-label", label);
    del.setAttribute("aria-label", label);
    del.innerHTML = TRASH;
    del.addEventListener("click", function (e) {
      e.stopPropagation();
      if (needsConfirm() && !del.classList.contains("armed")) {
        disarmAll(del);
        del.classList.add("armed");
        del.textContent = "Delete?";
        del.setAttribute("aria-label", "Confirm: " + label);
        return;
      }
      onDelete();
    });
    return del;
  }

  function renderTransactions() {
    document.getElementById("thead").innerHTML = TX_HEAD;
    titleEl.textContent = TX;
    rowsEl.innerHTML = "";
    var inSum = 0, outSum = 0;
    txList.forEach(function (t, i) {
      // show the part's current name and reference while it still exists
      var part = findRow(t.partId);
      var name = part && part.name ? part.name : t.name;
      var ref = part && part.reference ? part.reference : t.reference;
      var isIn = t.change > 0;
      if (isIn) inSum += t.change; else outSum -= t.change;

      var tr = document.createElement("tr");
      var num = document.createElement("td");
      num.className = "col-num";
      num.textContent = i + 1;
      tr.appendChild(num);
      tr.appendChild(txCell("Date", fmtTime(t.ts), "when"));
      var mtd = document.createElement("td");
      mtd.setAttribute("data-label", "Machine");
      mtd.innerHTML = '<span class="tx-text"><span class="chip"></span></span>';
      mtd.querySelector(".chip").textContent = t.machine;
      tr.appendChild(mtd);
      tr.appendChild(txCell("Name", name));
      tr.appendChild(txCell("Reference", ref));
      var ttd = document.createElement("td");
      ttd.setAttribute("data-label", "Type");
      ttd.innerHTML = '<span class="tx-text"><span class="chip ' + (isIn ? "chip-in" : "chip-out") + '">' + (isIn ? "In" : "Out") + "</span></span>";
      tr.appendChild(ttd);
      tr.appendChild(txCell("Quantity", (isIn ? "+" : "−") + Math.abs(t.change), "qty " + (isIn ? "pos" : "neg")));
      tr.appendChild(txCell("Stock after", String(t.after), "after"));

      var act = document.createElement("td");
      act.className = "col-act";
      act.appendChild(deleteButton("Delete transaction " + (i + 1), function () { return true; }, function () { deleteTx(t.id); }));
      tr.appendChild(act);
      rowsEl.appendChild(tr);
    });
    var n = txList.length;
    metaEl.textContent = monthLabel(month) + " \u00B7 " + n + (n === 1 ? " entry" : " entries") + " · " + inSum + " in · " + outSum + " out";
    emptyEl.querySelector("strong").textContent = "No transactions yet";
    emptyEl.querySelector("span").textContent = "Set or change a part’s quantity on a machine tab and the difference is recorded here.";
    emptyEl.hidden = n !== 0;
    updateCounts();
  }

  function deleteTx(id) {
    if (readOnly) return;
    var idx = txList.findIndex(function (t) { return t.id === id; });
    if (idx === -1) return;
    txList.splice(idx, 1);
    deleteDoc("transactions", id);
    renderTransactions();
  }

  function makeCell(row, field, label) {
    var td = document.createElement("td");
    td.setAttribute("data-label", label);
    var input = document.createElement("input");
    input.className = "cell" + (field === "quantity" ? " qty" : "") + (field === "date" ? " date" : "");
    input.type = field === "date" ? "date" : "text";
    input.id = "f-" + row.id + "-" + field;
    input.value = row[field];
    input.placeholder = label;
    input.setAttribute("aria-label", label);
    input.setAttribute("data-field", field);
    input.setAttribute("data-row", row.id);
    input.autocomplete = "off";
    input.spellcheck = false;
    input.dir = "auto";
    input.readOnly = readOnly;
    if (field === "quantity") input.inputMode = "numeric";
    if (field === "date") input.classList.toggle("blank", !input.value);
    input.addEventListener("input", function () {
      if (field === "quantity" && /\D/.test(input.value)) input.value = input.value.replace(/\D/g, "");
      var cur = findRow(row.id) || row;
      cur[field] = input.value;
      if (field === "date") input.classList.toggle("blank", !input.value);
      scheduleWrite(cur);
    });
    if (field === "quantity") {
      // fires when the edit is finished (leaving the field or pressing Enter)
      input.addEventListener("change", function () {
        var cur = findRow(row.id) || row;
        cur.quantity = input.value;
        commitQuantity(cur);
      });
    }
    td.appendChild(input);
    return td;
  }

  function renderRows(focusId) {
    panelEl.setAttribute("aria-labelledby", "tab-" + active);
    document.body.classList.toggle("tx-view", active === TX);
    if (active === TX) { renderTransactions(); return; }
    document.getElementById("thead").innerHTML = MACHINE_HEAD;
    emptyEl.querySelector("strong").textContent = "No parts yet";
    emptyEl.querySelector("span").textContent = "Use “Add part” for stock you already have, or “New arrival” for parts that just came in.";
    titleEl.textContent = active;
    rowsEl.innerHTML = "";
    data[active].forEach(function (row, i) {
      var tr = document.createElement("tr");
      tr.setAttribute("data-id", row.id);

      var num = document.createElement("td");
      num.className = "col-num";
      num.textContent = i + 1;
      tr.appendChild(num);

      tr.appendChild(makeCell(row, "name", "Name"));
      tr.appendChild(makeCell(row, "reference", "Reference"));
      tr.appendChild(makeCell(row, "quantity", "Quantity"));
      tr.appendChild(makeCell(row, "date", "Date"));

      var act = document.createElement("td");
      act.className = "col-act";
      act.appendChild(deleteButton("Delete row " + (i + 1), function () {
        var cur = findRow(row.id) || row;
        return (cur.name + cur.reference + cur.quantity + cur.date).trim() !== "";
      }, function () { deleteRow(row.id); }));
      tr.appendChild(act);

      rowsEl.appendChild(tr);

      if (row.id === focusId) {
        var first = tr.querySelector(".cell");
        setTimeout(function () {
          first.focus();
          tr.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }, 0);
      }
    });
    updateCounts();
  }

  document.addEventListener("click", function () { disarmAll(null); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") disarmAll(null); });

  // received = a part that just arrived: its first quantity is logged as In.
  // Otherwise the first quantity is starting stock and is not logged.
  function addRow(received) {
    if (readOnly || active === TX) return;
    var row = clean({ id: uid(), month: month, created: Date.now(), loggedQty: "", baseline: !received }, active);
    data[active].push(row);
    writeRow(row);
    renderRows(row.id);
  }

  function deleteRow(id) {
    var list = data[active];
    var idx = list.findIndex(function (r) { return r.id === id; });
    if (idx === -1 || readOnly) return;
    var row = list[idx];
    clearTimeout(editTimers[id]);
    delete editTimers[id];
    list.splice(idx, 1);
    deleteDoc("parts", row.id);
    renderRows();
  }

  document.getElementById("addTop").addEventListener("click", function () { addRow(false); });
  document.getElementById("addBottom").addEventListener("click", function () { addRow(false); });
  document.getElementById("recvTop").addEventListener("click", function () { addRow(true); });
  document.getElementById("recvBottom").addEventListener("click", function () { addRow(true); });

  // Enter moves to the next field
  rowsEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || !e.target.classList.contains("cell")) return;
    e.preventDefault();
    var cells = Array.prototype.slice.call(rowsEl.querySelectorAll(".cell"));
    var next = cells[cells.indexOf(e.target) + 1];
    if (next) next.focus(); else e.target.blur();
  });

  // ---- Apply snapshots from the shared store without disturbing typing ----
  function applyParts(snap) {
    var nextAll = {};
    snap.docs.forEach(function (d) {
      var v = d.data() || {};
      if (MACHINES.indexOf(v.machine) === -1) return;
      var row = clean({ id: d.id, month: v.month, name: v.name, reference: v.reference, quantity: v.quantity, loggedQty: v.loggedQty, date: v.date, baseline: v.baseline, created: v.created }, v.machine);
      // keep local text for rows with an edit still waiting to be sent
      var local = editTimers[d.id] && findRow(d.id);
      if (local) row = local;
      if (!nextAll[row.month]) nextAll[row.month] = emptyData();
      nextAll[row.month][row.machine].push(row);
    });
    Object.keys(nextAll).forEach(function (k) {
      MACHINES.forEach(function (m) { nextAll[k][m].sort(function (a, b) { return a.created - b.created || (a.id < b.id ? -1 : 1); }); });
    });
    allParts = nextAll;
    var next = allParts[month] || emptyData();
    allParts[month] = next;
    renderMonths();

    if (active === TX) { data = next; renderTransactions(); return; }
    var before = data[active].map(function (r) { return r.id; }).join(",");
    var after = next[active].map(function (r) { return r.id; }).join(",");
    data = next;

    if (before !== after) {
      var focused = document.activeElement;
      var keep = focused && focused.id && focused.classList.contains("cell") ? focused.id : null;
      renderRows();
      if (keep) { var el = document.getElementById(keep); if (el) el.focus(); }
    } else {
      // same rows: refresh values in place, leave the field being typed in alone
      data[active].forEach(function (row) {
        FIELDS.forEach(function (f) {
          var el = document.getElementById("f-" + row.id + "-" + f);
          if (el && el !== document.activeElement && el.value !== row[f]) {
            el.value = row[f];
            if (f === "date") el.classList.toggle("blank", !el.value);
          }
        });
      });
    }
    updateCounts();
  }

  function applyTx(snap) {
    allTx = {};
    snap.docs.forEach(function (d) {
      var tx = cleanTx(d.data() || {}, d.id);
      (allTx[tx.month] = allTx[tx.month] || []).push(tx);
    });
    Object.keys(allTx).forEach(function (k) { sortTx(allTx[k]); });
    if (!allTx[month]) allTx[month] = [];
    txList = allTx[month];
    renderMonths();
    if (active === TX) renderTransactions(); else updateCounts();
  }

  // ---- Glow follows pointer (rAF-throttled) ----
  var glow = document.getElementById("glow");
  var root = document.documentElement;
  var px = window.innerWidth / 2, py = window.innerHeight * 0.3, pending = false;
  function paint() {
    root.style.setProperty("--mx", px + "px");
    root.style.setProperty("--my", py + "px");
    pending = false;
  }
  function track(x, y) {
    px = x; py = y;
    if (!pending) { pending = true; requestAnimationFrame(paint); }
  }
  window.addEventListener("pointermove", function (e) { track(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    var t = e.touches[0]; if (t) track(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener("mouseleave", function () { glow.style.opacity = "0.4"; });
  document.addEventListener("mouseenter", function () { glow.style.opacity = "1"; });
  paint();

  // ---- Boot ----
  try {
    var savedTab = localStorage.getItem(TAB_KEY);
    if (TABS.indexOf(savedTab) !== -1) active = savedTab;
    var savedMonth = localStorage.getItem(MONTH_KEY);
    if (MONTHS.indexOf(savedMonth) !== -1) month = savedMonth;
  } catch (e) {}
  openSheet();

  var useClaude = window.claude && typeof window.claude.use === "function";
  if (!useClaude) loadLocal();
  renderMonths();
  renderTabs();
  renderRows();

  if (useClaude) {
    setStatus("Loading…");
    window.claude.use("db").then(function (store) {
      if (!store) {
        // No shared store in this view: keep entries in this browser
        loadLocal();
        renderMonths();
        renderTabs();
        renderRows();
        setStatus("Saving in this browser only.", "");
        return;
      }
      db = store;
      setStatus("");
      var lost = function () { setStatus("Lost connection to saved data. Reload the page.", "error"); };
      db.collection("parts").onSnapshot(applyParts, lost);
      db.collection("transactions").onSnapshot(applyTx, lost);
    });
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>UII Spare Parts</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: rgba(20, 24, 33, 0.86);
    --surface-2: rgba(28, 33, 45, 0.9);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #e8ebf2;
    --muted: #8a93a6;
    --accent: #5b9dff;
    --accent-soft: rgba(91, 157, 255, 0.14);
    --danger: #ff6b6b;
    --danger-soft: rgba(255, 107, 107, 0.12);
    --radius: 14px;
    --mx: 50vw;
    --my: 30vh;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Cursor-following glow: sits behind all content, never intercepts input */
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(520px circle at var(--mx) var(--my), rgba(91, 157, 255, 0.10), transparent 60%),
      radial-gradient(180px circle at var(--mx) var(--my), rgba(140, 190, 255, 0.07), transparent 70%);
    transition: opacity 0.4s ease;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    margin: 0 auto;
    padding: 40px 16px 64px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
  }
  .btn-export { border-color: rgba(127,214,164,0.4); color: #bfeccf; }
  .btn-export:hover { border-color: rgba(127,214,164,0.7); background: rgba(127,214,164,0.1); box-shadow: 0 0 0 3px rgba(127,214,164,0.08); }
  .btn-export:disabled { opacity: 0.6; cursor: progress; transform: none; }

  h1 {
    margin: 0;
    font-size: clamp(40px, 9vw, 64px);
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #a9c6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Monthly sheets */
  .months-wrap {
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .months { display: flex; align-items: center; gap: 6px; padding-bottom: 4px; width: max-content; }
  .year {
    padding: 0 4px 0 2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .year-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-right: 6px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  .year-switch .year { min-width: 44px; padding: 0 2px; text-align: center; color: var(--text); font-size: 13px; }
  .year-switch .year.has-data { color: #cfe0ff; }
  .year-nav {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .year-nav:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
  .year-nav:disabled { opacity: 0.25; cursor: default; }
  .month {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .month:hover { color: var(--text); border-color: var(--border-strong); }
  .month[aria-current="true"] { color: #06101f; background: var(--accent); border-color: var(--accent); }
  .month .dot { display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; vertical-align: middle; }

  /* Search */
  .search-wrap { margin-bottom: 12px; }
  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-box:focus-within { border-color: rgba(91,157,255,0.6); box-shadow: 0 0 0 3px rgba(91,157,255,0.12); }
  .search-box svg { width: 18px; height: 18px; flex: 0 0 auto; color: var(--muted); }
  .search-box input {
    flex: 1;
    min-width: 0;
    padding: 13px 0;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16px;
  }
  .search-box input:focus { outline: none; }
  .search-box input::placeholder { color: rgba(138,147,166,0.7); }
  .results {
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
  }
  .results[hidden] { display: none; }
  .results-head { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  .results-head strong { color: var(--text); }
  .results-none { padding: 18px 16px; }
  .results-none strong { display: block; color: var(--danger); font-size: 15px; margin-bottom: 2px; }
  .results-none span { color: var(--muted); font-size: 13px; }
  .result {
    display: grid;
    grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.4fr) repeat(4, minmax(0, 1fr)) auto;
    gap: 12px;
    align-items: center;
    width: 100%;
    padding: 12px 16px;
    border: 0;
    border-top: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .result:first-of-type { border-top: 0; }
  .result:hover, .result:focus-visible { background: rgba(91,157,255,0.08); outline: none; }
  .result .r-name { font-weight: 600; overflow-wrap: anywhere; }
  .result .r-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .result .r-ref { overflow-wrap: anywhere; }
  .result .r-k { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .result .r-v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .result .r-go { color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .result mark { background: rgba(255,214,102,0.28); color: inherit; border-radius: 3px; padding: 0 1px; }
  .chip.chip-month { background: rgba(255,255,255,0.06); border-color: var(--border-strong); color: var(--text); }
  @media (max-width: 760px) {
    .result { grid-template-columns: 1fr 1fr; }
    .result > :first-child { grid-column: 1 / -1; }
    .result .r-go { grid-column: 1 / -1; }
  }
  tbody tr.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 40% { background: rgba(255,214,102,0.22); } 100% { background: transparent; } }

  /* Closed (past) months */
  .lock-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-bottom: 12px;
    padding: 12px 16px;
    border: 1px solid rgba(255,196,87,0.4);
    border-radius: var(--radius);
    background: rgba(255,196,87,0.08);
    color: #ffe3a8;
    font-size: 14px;
    font-weight: 600;
  }
  .lock-bar[hidden] { display: none; }
  .lock-bar.open { border-color: rgba(127,214,164,0.4); background: rgba(127,214,164,0.08); color: #c6f1d8; }
  body.locked .add-group, body.locked .panel-foot, body.locked .del, body.locked .copy-banner { display: none; }
  body.locked .cell, body.locked .cur { opacity: 0.85; }

  /* Same reference twice on one machine */
  .cell.dup { border-color: rgba(255,107,107,0.7) !important; background: var(--danger-soft) !important; }
  .meta .warn { color: var(--danger); font-weight: 600; }

  /* Confirm dialog */
  .confirm { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5,7,12,0.7); }
  .confirm[hidden] { display: none; }
  .confirm-card { width: 100%; max-width: 440px; padding: 22px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: #141925; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .confirm-card strong { display: block; font-size: 18px; margin-bottom: 8px; color: #ffe3a8; }
  .confirm-card p { margin: 0 0 18px; color: var(--text); line-height: 1.55; }
  .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

  /* Summary tab */
  .summary { padding: 18px; }
  .summary[hidden] { display: none; }
  body.sum-view table, body.sum-view #empty, body.sum-view .tx-filter, body.sum-view .add-group, body.sum-view .panel-foot { display: none !important; }
  .sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .sum-card { padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,0.02); }
  .sum-card.all { border-color: rgba(91,157,255,0.4); background: rgba(91,157,255,0.06); }
  .sum-card h3 { margin: 0 0 10px; font-size: 15px; }
  .sum-line { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .sum-line .k { color: var(--muted); font-size: 13px; }
  .sum-line .v { font-weight: 700; text-align: right; }
  .sum-line .v.in { color: #7fd6a4; }
  .sum-line .v.out { color: var(--danger); }
  .sum-cmp { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .sum-cmp b { color: var(--text); }
  .insights { margin-top: 18px; }
  .insights h3 { margin: 0 0 10px; font-size: 15px; }
  .insight { display: flex; gap: 10px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px; background: rgba(255,255,255,0.02); line-height: 1.5; }
  .insight.warn { border-left-color: #ffc457; }
  .insight.bad { border-left-color: var(--danger); }
  .insight.good { border-left-color: #7fd6a4; }
  .insight.info { border-left-color: var(--accent); }
  .insight .fix { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* Copy parts into an empty month */
  .copy-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px 16px;
    margin-bottom: 12px;
    padding: 14px 16px;
    border: 1px dashed rgba(91,157,255,0.45);
    border-radius: var(--radius);
    background: rgba(91,157,255,0.07);
  }
  .copy-banner strong { display: block; font-size: 15px; }
  .copy-banner span { color: var(--muted); font-size: 13px; }
  .copy-banner[hidden], body.readonly .copy-banner { display: none; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
    scrollbar-width: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .tab[aria-selected="true"] {
    color: var(--text);
    background: var(--accent-soft);
    border-color: rgba(91, 157, 255, 0.35);
  }
  .tab .count {
    min-width: 22px;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }
  .tab[aria-selected="true"] .count { background: rgba(91,157,255,0.22); color: #cfe0ff; }

  /* Panel */
  .panel {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .panel-head .meta { color: var(--muted); font-size: 13px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .btn:hover {
    border-color: rgba(91,157,255,0.5);
    background: rgba(91,157,255,0.12);
    box-shadow: 0 0 0 3px rgba(91,157,255,0.08);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #06101f; }
  .btn-primary:hover { background: #77afff; border-color: #77afff; }
  .btn svg { width: 16px; height: 16px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 12px 18px;
    text-align: left;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  th.col-num, td.col-num { width: 48px; text-align: center; padding-left: 12px; padding-right: 0; }
  th.col-qty { width: 10%; }
  th.col-price { width: 16%; }
  th.col-total { width: 12%; }
  th.col-ref { width: 16%; }
  .price-wrap { display: flex; gap: 6px; align-items: center; }
  .price-wrap .cell { min-width: 0; flex: 1; }
  .cur {
    flex: 0 0 auto;
    padding: 7px 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .cur:focus { outline: none; border-color: rgba(91,157,255,0.6); }
  .cur.unset { color: var(--muted); }
  .total-text { display: block; padding: 8px 10px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .total-text.muted { color: var(--muted); font-weight: 400; }
  th.col-date { width: 14%; }
  .cell.date { min-height: 39px; }
  .cell.date::-webkit-calendar-picker-indicator { opacity: 0.6; cursor: pointer; }
  .cell.date.blank { color: var(--muted); }
  th.col-act, td.col-act { width: 56px; text-align: right; }
  th.col-mach { width: 9%; }
  body.tx-view th.col-ref { width: 13%; }
  th.col-when { width: 14%; }
  th.col-type { width: 7%; }
  th.col-change { width: 8%; }
  th.col-value { width: 10%; }
  th.col-after { width: 8%; }
  .tx-text.when { font-variant-numeric: tabular-nums; white-space: pre; }
  .tx-text.pos { color: #7fd6a4; }
  .tx-text.neg { color: var(--danger); }
  .tx-text.after { font-variant-numeric: tabular-nums; }
  .chip.chip-in { background: rgba(127,214,164,0.12); border-color: rgba(127,214,164,0.35); color: #a9e8c4; }
  .chip.chip-out { background: var(--danger-soft); border-color: rgba(255,107,107,0.35); color: #ffb3b3; }
  .tx-text { display: block; padding: 8px 10px; min-height: 39px; overflow-wrap: anywhere; }
  .tx-text.muted { color: var(--muted); }
  .tx-text.qty { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  body.tx-view .cell.date { border-color: var(--border-strong); background: rgba(255,255,255,0.03); }
  .chip {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid rgba(91,157,255,0.3);
    color: #cfe0ff;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tab.tx { color: #b9c6dc; }
  .tab-sep { flex: 0 0 1px; align-self: stretch; margin: 6px 2px; background: var(--border-strong); }
  body.tx-view .add-group, body.tx-view .panel-foot { display: none; }
  .tx-filter { display: none; flex-wrap: wrap; gap: 6px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  body.tx-view .tx-filter { display: flex; }
  .tx-filter button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tx-filter button:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .tx-filter button[aria-pressed="true"] { color: var(--text); background: var(--accent-soft); border-color: rgba(91,157,255,0.5); }
  .tx-filter .count { min-width: 18px; padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,0.07); font-size: 11px; text-align: center; }

  tbody tr { transition: background 0.15s ease; }
  tbody tr + tr td { border-top: 1px solid var(--border); }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  /* Rows added with New arrival */
  tbody tr.arrival { background: rgba(127,214,164,0.13); }
  tbody tr.arrival:hover { background: rgba(127,214,164,0.18); }
  tbody tr.arrival td:first-child { box-shadow: inset 4px 0 0 #7fd6a4; color: #a9e8c4; font-weight: 700; }
  tbody tr.arrival .cell { border-color: rgba(127,214,164,0.25); }
  .btn.btn-arrival { background: rgba(127,214,164,0.16); border-color: rgba(127,214,164,0.55); color: #c6f1d8; }
  .btn.btn-arrival:hover { background: rgba(127,214,164,0.26); border-color: #7fd6a4; box-shadow: 0 0 0 3px rgba(127,214,164,0.1); }
  tbody td { padding: 6px 18px; vertical-align: middle; }
  td.col-num { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .cell {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .cell::placeholder { color: rgba(138,147,166,0.45); }
  tbody tr:hover .cell { border-color: var(--border); }
  .cell:focus {
    outline: none;
    border-color: rgba(91,157,255,0.6);
    background: rgba(91,157,255,0.06);
  }
  .cell.qty { font-variant-numeric: tabular-nums; }

  .del {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  tbody tr:hover .del { opacity: 1; }
  .del:hover, .del:focus-visible {
    opacity: 1;
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(255,107,107,0.3);
    outline: none;
  }
  .del svg { width: 16px; height: 16px; }
  .del.armed {
    width: auto;
    padding: 0 10px;
    opacity: 1;
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(255,107,107,0.45);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  body.readonly .add-group, body.readonly .panel-foot, body.readonly .del { display: none; }

  .empty {
    padding: 48px 18px;
    text-align: center;
    color: var(--muted);
  }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  .add-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .panel-foot {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
  }

  .status {
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
    min-height: 18px;
    transition: color 0.3s ease;
  }
  .status.saved { color: #7fd6a4; }
  .status.error { color: var(--danger); }

  /* Mobile: rows become cards */
  @media (max-width: 640px) {
    .wrap { padding-top: 28px; }
    .panel-head { padding: 14px; }
    .add-group .btn { padding: 8px 10px; font-size: 14px; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
    .tab.tx { grid-column: span 2; }
    .tab-sep { display: none; }
    .tab { padding: 9px 4px; gap: 5px; font-size: 14px; min-width: 0; }
    .tab .count { min-width: 18px; padding: 1px 5px; font-size: 11px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      position: relative;
      padding: 10px 14px 12px;
    }
    tbody tr + tr td { border-top: 0; }
    tbody tr + tr { border-top: 1px solid var(--border); }
    tbody td { padding: 3px 0; }
    td.col-num {
      width: auto;
      text-align: left;
      padding: 0 0 4px;
      font-size: 12px;
    }
    td.col-num::before { content: "#"; }
    tbody tr.arrival { box-shadow: inset 4px 0 0 #7fd6a4; }
    tbody tr.arrival td:first-child { box-shadow: none; }
    tbody tr.arrival td.col-num::after {
      content: "New arrival";
      margin-left: 8px;
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(127,214,164,0.18);
      color: #c6f1d8;
      font-size: 11px;
      font-weight: 600;
    }
    td[data-label] {
      display: grid;
      grid-template-columns: 82px 1fr;
      align-items: center;
      gap: 8px;
    }
    td[data-label]::before {
      content: attr(data-label);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .cell { border-color: var(--border); background: rgba(255,255,255,0.02); font-size: 16px; }
    td.col-act { position: absolute; top: 6px; right: 10px; width: auto; padding: 0; }
    .del { opacity: 1; }
    .panel-foot { padding: 12px 14px; }
    .panel-foot { flex-direction: column; }
    .panel-foot .btn { width: 100%; justify-content: center; }
  }

  @media (hover: none) {
    .glow { opacity: 0.7; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="glow" id="glow" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div>
      <h1>UII</h1>
      <p class="subtitle">Machine Spare Parts Register</p>
    </div>
    <button class="btn btn-export" id="exportBtn" type="button" title="Download this month as an Excel file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 13l6 5M15 13l-6 5"/></svg>
      <span id="exportLabel">Export to Excel</span>
    </button>
  </header>

  <div class="months-wrap">
    <nav class="months" id="months" aria-label="Monthly sheets"></nav>
  </div>

  <div class="search-wrap">
    <label class="search-box" for="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" type="search" placeholder="Search by reference or name, across all machines and months" autocomplete="off" spellcheck="false" dir="auto">
    </label>
    <div class="results" id="results" hidden></div>
  </div>

  <div class="copy-banner" id="copyBanner" hidden>
    <div>
      <strong id="copyTitle"></strong>
      <span id="copyText"></span>
    </div>
    <button class="btn btn-primary" id="copyBtn" type="button"></button>
  </div>

  <div class="lock-bar" id="lockBar" hidden>
    <span id="lockText"></span>
    <button class="btn" id="lockBtn" type="button"></button>
  </div>

  <nav class="tabs" role="tablist" id="tabs" aria-label="Sections"></nav>

  <section class="panel" role="tabpanel" id="panel" aria-labelledby="">
    <div class="panel-head">
      <div>
        <h2 id="panelTitle"></h2>
        <div class="meta" id="panelMeta"></div>
      </div>
      <div class="add-group">
        <button class="btn" id="addTop" type="button" title="Add a part you already have in stock. Its starting quantity is not recorded as a transaction.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add part</span>
        </button>
        <button class="btn btn-arrival" id="recvTop" type="button" title="Add a part that just arrived. Its quantity is recorded as In.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
          <span>New arrival</span>
        </button>
      </div>
    </div>

    <div class="tx-filter" id="txFilter" role="group" aria-label="Show transactions for"></div>

    <div class="summary" id="summary" hidden></div>

    <table>
      <thead id="thead">
        <tr>
          <th class="col-num">#</th>
          <th>Name</th>
          <th class="col-ref">Reference</th>
          <th class="col-qty">Quantity</th>
          <th class="col-price">Unit price</th>
          <th class="col-total">Total price</th>
          <th class="col-date">Date</th>
          <th class="col-act"><span class="sr-only" style="position:absolute;left:-9999px">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="empty" id="empty" hidden>
      <strong>No parts yet</strong>
      <span>Use “Add part” for stock you already have, or “New arrival” for parts that just came in.</span>
    </div>

    <div class="panel-foot">
      <button class="btn" id="addBottom" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add part
      </button>
      <button class="btn btn-arrival" id="recvBottom" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
        New arrival
      </button>
    </div>
  </section>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="confirm" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-card">
      <strong id="confirmTitle">Big change in quantity</strong>
      <p id="confirmText"></p>
      <div class="confirm-actions">
        <button class="btn" id="confirmNo" type="button">No, undo it</button>
        <button class="btn btn-primary" id="confirmYes" type="button">Yes, record it</button>
      </div>
    </div>
  </div>
</div>


<script>
(function () {
  "use strict";

  var MACHINES = ["BLM", "BCW3", "Bonal", "Sollas"];
  var STORAGE_KEY = "uii-spare-parts-v1";
  var TX_KEY = "uii-spare-parts-tx-v1";
  var TAB_KEY = "uii-spare-parts-active-tab";
  var MONTH_KEY = "uii-spare-parts-month";
  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  // One sheet per month from September 2026. The list runs to December of the
  // current year (at least 2027), so each new year appears on its own.
  var FIRST_YEAR = 2026;
  var LAST_YEAR = Math.max(2027, new Date().getFullYear());
  var MONTHS = [];
  (function () {
    for (var y = FIRST_YEAR; y <= LAST_YEAR; y++) {
      for (var mo = y === FIRST_YEAR ? 9 : 1; mo <= 12; mo++) MONTHS.push(y + "-" + (mo < 10 ? "0" : "") + mo);
    }
  })();
  function monthLabel(key) { return MONTH_NAMES[parseInt(key.slice(5), 10) - 1] + " " + key.slice(0, 4); }
  // Month a record belongs to; older records without one use the month they were created in
  function monthOf(v, ts) {
    if (MONTHS.indexOf(v) !== -1) return v;
    var d = new Date(ts || Date.now());
    var k = d.getFullYear() + "-" + (d.getMonth() < 9 ? "0" : "") + (d.getMonth() + 1);
    if (MONTHS.indexOf(k) !== -1) return k;
    return k < MONTHS[0] ? MONTHS[0] : MONTHS[MONTHS.length - 1];
  }
  var FIELDS = ["name", "reference", "quantity", "price", "currency", "date"];
  var CURRENCIES = ["USD", "EUR"];
  var CUR_SIGN = { USD: "$", EUR: "\u20AC" };
  var CUR_KEY = "uii-spare-parts-currency";
  var TX = "Transaction";
  var SUM = "Summary";
  var TABS = MACHINES.concat([TX, SUM]);

  // data[machine] = [{id, machine, name, reference, quantity, loggedQty, date, created}]
  // loggedQty is the stock level the last transaction left the part at.
  // allParts[month][machine] = rows; allTx[month] = transactions.
  // data and txList are the open month's sheet.
  var allParts = {};
  var allTx = {};
  var month = monthOf(null, Date.now());
  var data = emptyData();
  // txList = [{id, partId, month, machine, name, reference, change, after, ts}], newest first
  var txList = [];
  function openSheet() {
    if (!allParts[month]) allParts[month] = emptyData();
    if (!allTx[month]) allTx[month] = [];
    data = allParts[month];
    txList = allTx[month];
  }
  var active = MACHINES[0];
  var db = null;          // shared store when running as a published artifact
  var readOnly = false;
  // Months before the current one are closed (view only) until unlocked
  var CURRENT_MONTH = monthOf(null, Date.now());
  var unlocked = {};
  function isLocked() { return month < CURRENT_MONTH && !unlocked[month]; }
  function ro() { return readOnly || isLocked(); }

  function emptyData() {
    var d = {};
    MACHINES.forEach(function (m) { d[m] = []; });
    return d;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function clean(r, machine) {
    var qty = String(r.quantity || "");
    return {
      id: String(r.id),
      month: monthOf(r.month, r.created),
      machine: machine,
      name: String(r.name || ""),
      reference: String(r.reference || ""),
      quantity: qty,
      price: String(r.price || ""),
      currency: CURRENCIES.indexOf(r.currency) !== -1 ? r.currency : "",
      // parts saved before transactions existed start from their current stock
      loggedQty: r.loggedQty == null ? qty : String(r.loggedQty),
      date: String(r.date || ""),
      baseline: !!r.baseline,
      arrival: !!r.arrival,
      created: Number(r.created) || 0
    };
  }

  function cleanTx(t, id) {
    return {
      id: String(id || t.id),
      partId: String(t.partId || ""),
      month: monthOf(t.month, t.ts),
      machine: String(t.machine || ""),
      name: String(t.name || ""),
      reference: String(t.reference || ""),
      change: Number(t.change) || 0,
      after: Number(t.after) || 0,
      // date shown in Transaction; editable, defaults to the day it was recorded
      date: /^\d{4}-\d{2}-\d{2}$/.test(t.date) ? t.date : "",
      ts: Number(t.ts) || 0
    };
  }

  function rowBody(r) {
    return { month: r.month, machine: r.machine, name: r.name, reference: r.reference, quantity: r.quantity, price: r.price, currency: r.currency, loggedQty: r.loggedQty, date: r.date, baseline: r.baseline, arrival: r.arrival, created: r.created };
  }
  function txBody(t) {
    return { partId: t.partId, month: t.month, machine: t.machine, name: t.name, reference: t.reference, change: t.change, after: t.after, date: t.date, ts: t.ts };
  }
  function ymd(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + (d.getMonth() < 9 ? "0" : "") + (d.getMonth() + 1) + "-" + (d.getDate() < 10 ? "0" : "") + d.getDate();
  }
  function txDate(t) { return t.date || ymd(t.ts); }
  // newest date first; same day: most recently recorded first
  function sortTx(list) {
    list.sort(function (a, b) {
      var da = txDate(a), dbb = txDate(b);
      if (da !== dbb) return da < dbb ? 1 : -1;
      return b.ts - a.ts || (a.id < b.id ? 1 : -1);
    });
  }

  // ---- Status line ----
  var statusEl = document.getElementById("status");
  var statusTimer = null;
  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status " + (kind || "");
    clearTimeout(statusTimer);
    if (kind === "saved") {
      statusTimer = setTimeout(function () { statusEl.textContent = ""; statusEl.className = "status"; }, 1600);
    }
  }

  // ---- Local storage (used when the shared store is unavailable) ----
  function loadLocal() {
    allParts = {};
    allTx = {};
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        // v2 keeps a flat list with each row's month; v1 grouped rows by machine
        var rows = Array.isArray(parsed.parts) ? parsed.parts : [];
        MACHINES.forEach(function (m) {
          if (Array.isArray(parsed[m])) parsed[m].forEach(function (r) { r.machine = m; rows.push(r); });
        });
        rows.forEach(function (r) {
          if (MACHINES.indexOf(r.machine) === -1) return;
          var row = clean({ id: r.id || uid(), month: r.month, name: r.name, reference: r.reference, quantity: r.quantity, price: r.price, currency: r.currency, loggedQty: r.loggedQty, date: r.date, baseline: r.baseline, arrival: r.arrival, created: r.created }, r.machine);
          if (!allParts[row.month]) allParts[row.month] = emptyData();
          allParts[row.month][row.machine].push(row);
        });
      }
      var rawTx = localStorage.getItem(TX_KEY);
      if (rawTx) {
        var arr = JSON.parse(rawTx);
        if (Array.isArray(arr)) arr.forEach(function (t) {
          var tx = cleanTx(t);
          (allTx[tx.month] = allTx[tx.month] || []).push(tx);
        });
      }
    } catch (e) {}
    Object.keys(allTx).forEach(function (k) { sortTx(allTx[k]); });
    openSheet();
  }
  function saveLocal() {
    try {
      var parts = [], txs = [];
      Object.keys(allParts).forEach(function (k) {
        MACHINES.forEach(function (m) {
          allParts[k][m].forEach(function (r) { var b = rowBody(r); b.id = r.id; parts.push(b); });
        });
      });
      Object.keys(allTx).forEach(function (k) {
        allTx[k].forEach(function (t) { var b = txBody(t); b.id = t.id; txs.push(b); });
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ parts: parts }));
      localStorage.setItem(TX_KEY, JSON.stringify(txs));
      setStatus("Saved", "saved");
    } catch (e) {
      setStatus("Not saved: this browser is blocking storage.", "error");
    }
  }

  // ---- Shared store writes: one at a time per document ----
  var queues = {};
  function enqueue(id, fn) {
    var prev = queues[id] || Promise.resolve();
    var next = prev.then(fn, fn);
    queues[id] = next.catch(function () {});
    return next;
  }
  function onWriteError(e) {
    var code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted" || code === "revoked") {
      readOnly = true;
      document.body.classList.add("readonly");
      setStatus("You can view this list but not edit it.", "error");
    } else if (code === "quota_exceeded") {
      setStatus("Storage is full. Delete unused rows to add more.", "error");
    } else {
      setStatus("Not saved. Check your connection and try again.", "error");
    }
  }
  function saveDoc(coll, id, body) {
    if (!db) { saveLocal(); return; }
    enqueue(coll + "/" + id, function () { return db.collection(coll).doc(id).set(body); })
      .then(function () { setStatus("Saved", "saved"); }, onWriteError);
  }
  function deleteDoc(coll, id) {
    if (!db) { saveLocal(); return; }
    enqueue(coll + "/" + id, function () { return db.collection(coll).doc(id).delete(); })
      .then(function () { setStatus("Deleted", "saved"); }, onWriteError);
  }
  function writeRow(row) { saveDoc("parts", row.id, rowBody(row)); }

  var editTimers = {};
  function scheduleWrite(row) {
    clearTimeout(editTimers[row.id]);
    editTimers[row.id] = setTimeout(function () { delete editTimers[row.id]; writeRow(findRow(row.id) || row); }, 400);
  }
  function flushWrites() {
    var el = document.activeElement;
    if (el && el.getAttribute && el.getAttribute("data-field") === "quantity") {
      var r = findRow(el.getAttribute("data-row"));
      if (r && !pendingConfirm) commitQuantity(r, true);
    }
    Object.keys(editTimers).forEach(function (id) {
      clearTimeout(editTimers[id]);
      delete editTimers[id];
      var row = findRow(id);
      if (row) writeRow(row);
    });
  }
  window.addEventListener("pagehide", flushWrites);
  document.addEventListener("visibilitychange", function () { if (document.hidden) flushWrites(); });

  function findRow(id) {
    for (var i = 0; i < MACHINES.length; i++) {
      var list = data[MACHINES[i]];
      for (var j = 0; j < list.length; j++) if (list[j].id === id) return list[j];
    }
    return null;
  }

  // ---- Transactions: a finished quantity edit logs the difference ----
  var confirmEl = document.getElementById("confirm");
  var pendingConfirm = null;
  function isBigChange(before, after) {
    var ch = Math.abs(after - before);
    return ch >= 50 || (before >= 2 && after >= before * 5);
  }
  function askBigChange(row, before, after) {
    var ch = after - before;
    document.getElementById("confirmText").textContent =
      row.machine + " \u00B7 " + (row.name || "this part") + ": " + before + " \u2192 " + after +
      ". This records " + (ch > 0 ? "In +" : "Out \u2212") + Math.abs(ch) + ". Is that right, or was it a typo?";
    pendingConfirm = row;
    confirmEl.hidden = false;
    document.getElementById("confirmNo").focus();
  }
  function closeConfirm(yes) {
    var row = pendingConfirm;
    pendingConfirm = null;
    confirmEl.hidden = true;
    if (!row) return;
    if (yes) { commitQuantity(row, true); return; }
    // put the quantity back to what was recorded
    row.quantity = row.loggedQty;
    var el = document.getElementById("f-" + row.id + "-quantity");
    if (el) { el.value = row.quantity; el.focus(); }
    clearTimeout(editTimers[row.id]);
    delete editTimers[row.id];
    writeRow(row);
    updateTotal(row);
  }
  document.getElementById("confirmYes").addEventListener("click", function () { closeConfirm(true); });
  document.getElementById("confirmNo").addEventListener("click", function () { closeConfirm(false); });
  confirmEl.addEventListener("keydown", function (e) { if (e.key === "Escape") closeConfirm(false); });

  function commitQuantity(row, confirmed) {
    var before = parseInt(row.loggedQty, 10) || 0;
    var after = parseInt(row.quantity, 10) || 0;
    if (before === after) return;
    if (!row.baseline && !confirmed && isBigChange(before, after)) { askBigChange(row, before, after); return; }
    if (row.baseline) {
      // starting stock for a part already on the shelf: no transaction
      row.baseline = false;
      row.loggedQty = row.quantity;
      clearTimeout(editTimers[row.id]);
      delete editTimers[row.id];
      writeRow(row);
      return;
    }
    var tx = cleanTx({
      partId: row.id, month: row.month, machine: row.machine, name: row.name, reference: row.reference,
      change: after - before, after: after, date: row.date, ts: Date.now()
    }, uid());
    row.loggedQty = row.quantity;
    clearTimeout(editTimers[row.id]);
    delete editTimers[row.id];
    txList.unshift(tx);
    sortTx(txList);
    writeRow(row);
    saveDoc("transactions", tx.id, txBody(tx));
    updateTotal(row);
    updateCounts();
  }

  // ---- DOM ----
  var tabsEl = document.getElementById("tabs");
  var rowsEl = document.getElementById("rows");
  var emptyEl = document.getElementById("empty");
  var panelEl = document.getElementById("panel");
  var titleEl = document.getElementById("panelTitle");
  var metaEl = document.getElementById("panelMeta");

  var TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';

  var monthsEl = document.getElementById("months");
  function monthHasData(k) {
    var p = allParts[k];
    var n = allTx[k] ? allTx[k].length : 0;
    if (p) MACHINES.forEach(function (m) { n += p[m].length; });
    return n > 0;
  }
  var viewYear = 0;
  function yearHasData(y) {
    return MONTHS.some(function (k) { return k.slice(0, 4) === String(y) && monthHasData(k); });
  }
  function renderMonths() {
    if (typeof updateExportLabel === "function") updateExportLabel();
    if (!viewYear) viewYear = parseInt(month.slice(0, 4), 10);
    monthsEl.innerHTML = "";

    var prev = document.createElement("button");
    prev.type = "button";
    prev.className = "year-nav";
    prev.textContent = "\u2039";
    prev.setAttribute("aria-label", "Previous year");
    prev.disabled = viewYear <= FIRST_YEAR;
    prev.addEventListener("click", function () { viewYear--; renderMonths(); });
    var label = document.createElement("span");
    label.className = "year" + (yearHasData(viewYear) ? " has-data" : "");
    label.textContent = viewYear;
    var next = document.createElement("button");
    next.type = "button";
    next.className = "year-nav";
    next.textContent = "\u203A";
    next.setAttribute("aria-label", "Next year");
    next.disabled = viewYear >= LAST_YEAR;
    next.addEventListener("click", function () { viewYear++; renderMonths(); });
    var nav = document.createElement("span");
    nav.className = "year-switch";
    nav.appendChild(prev);
    nav.appendChild(label);
    nav.appendChild(next);
    monthsEl.appendChild(nav);

    MONTHS.forEach(function (k) {
      if (k.slice(0, 4) !== String(viewYear)) return;

    function txSheet(name, title, list, withMachine, tab) {
      var rows = list.map(function (t, i) {
        var part = findRow(t.partId), isIn = t.change > 0;
        var cells = [{ v: txDate(t), s: z("center", i) }];
        if (withMachine) cells.push({ v: t.machine, s: z("center", i) });
        return cells.concat([
          { v: part && part.name ? part.name : t.name, s: z("text", i) },
          { v: part && part.reference ? part.reference : t.reference, s: z("center", i) },
          { v: isIn ? "In" : "Out", s: isIn ? "typeIn" : "typeOut" },
          { v: t.change, s: z(isIn ? "qtyPos" : "qtyNeg", i) },
          { v: part ? priceVal(part.price) : "", s: z("money", i) },
          { v: part ? part.currency : "", s: z("center", i) },
          { v: txValue(t, part) === null ? "" : txValue(t, part), s: z("moneyBold", i) },
          { v: t.after, s: z("center", i) }]);
      });
      var totals = [];
      var cols = [{ name: "Date", width: 14 }];
      if (withMachine) cols.push({ name: "Machine", width: 12 });
      cols = cols.concat([{ name: "Name", width: 40 }, { name: "Reference", width: 22 }, { name: "Type", width: 10 }, { name: "Quantity", width: 11 }, { name: "Unit price", width: 13 }, { name: "Currency", width: 11 }, { name: "Value", width: 14 }, { name: "Stock after", width: 12 }]);
      return { name: name, xml: sheetXml({
        title: title, subtitle: "Transactions · " + label + " · " + list.length + (list.length === 1 ? " entry" : " entries") + " · " + stamp,
        tab: tab, rows: rows, totals: totals, columns: cols
      }) };
    }

    // Each machine gets its parts sheet followed by its own transaction sheet
    var sheets = [];
    MACHINES.forEach(function (m) {
      sheets.push(partsSheet(m));
      sheets.push(txSheet(m + " " + TX, "UII — " + m + " " + TX, txList.filter(function (t) { return t.machine === m; }), false, "1E7B45"));
    });
    sheets.push(txSheet("All " + TX + "s", "UII — All " + TX + "s", txList, true, "6B7280"));

    var files = [];
    files.push(["[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map(function (sh, i) { return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join("") + "</Types>"]);
    files.push(["_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>']);
    files.push(["xl/workbook.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      sheets.map(function (sh, i) { return '<sheet name="' + xmlEsc(sh.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>'; }).join("") + "</sheets><calcPr calcId=\"191029\" fullCalcOnLoad=\"1\"/></workbook>"]);
    files.push(["xl/_rels/workbook.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map(function (sh, i) { return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>'; }).join("") +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>']);
    files.push(["xl/styles.xml", stylesXml()]);
    sheets.forEach(function (sh, i) { files.push(["xl/worksheets/sheet" + (i + 1) + ".xml", sh.xml]); });
    return zipStore(files);
  }

  // Minimal zip writer (stored, no compression)
  var CRC_TABLE = (function () {
    var t = [];
    for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zipStore(files) {
    var enc = new TextEncoder();
    var chunks = [], central = [], offset = 0;
    function u16(v) { return [v & 0xFF, (v >>> 8) & 0xFF]; }
    function u32(v) { return [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]; }
    files.forEach(function (f) {
      var name = enc.encode(f[0]), body = enc.encode(f[1]), crc = crc32(body);
      var common = [].concat(u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(body.length), u32(body.length), u16(name.length), u16(0));
      var local = new Uint8Array([].concat(u32(0x04034B50), common));
      chunks.push(local, name, body);
      central.push(new Uint8Array([].concat(u32(0x02014B50), u16(20), common, u16(0), u16(0), u16(0), u32(0), u32(offset))), name);
      offset += local.length + name.length + body.length;
    });
    var size = central.reduce(function (n, c) { return n + c.length; }, 0);
    var end = new Uint8Array([].concat(u32(0x06054B50), u16(0), u16(0), u16(files.length), u16(files.length), u32(size), u32(offset), u16(0)));
    var parts = chunks.concat(central, [end]);
    var total = parts.reduce(function (n, c) { return n + c.length; }, 0);
    var out = new Uint8Array(total), pos = 0;
    parts.forEach(function (c) { out.set(c, pos); pos += c.length; });
    return out;
  }

  var exportBtn = document.getElementById("exportBtn");
  function exportFilename() { return "UII-" + monthLabel(month).replace(" ", "-") + ".xlsx"; }
  exportBtn.addEventListener("click", function () {
    flushWrites();
    var bytes = buildWorkbook();
    var filename = exportFilename();
    var useHost = window.claude && typeof window.claude.use === "function";
    if (!useHost) {
      // standalone file: an ordinary browser download
      var url = URL.createObjectURL(new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      setStatus("Downloaded " + filename, "saved");
      return;
    }
    exportBtn.disabled = true;
    window.claude.use("downloads").then(function (dl) {
      if (!dl) { setStatus("Excel export isn't available in this view.", "error"); return; }
      return dl.save({ filename: filename, data: bytes }).then(function () {
        setStatus("Downloaded " + filename, "saved");
      }, function (e) {
        var code = e && e.code;
        if (code === "declined") setStatus("");
        else if (code === "rate_limited") setStatus("A download is already waiting for your answer.", "error");
        else setStatus("Couldn't create the Excel file. Try again.", "error");
      });
    }).then(function () { exportBtn.disabled = false; }, function () { exportBtn.disabled = false; });
  });
  function updateExportLabel() {
    exportBtn.title = "Download " + monthLabel(month) + " as an Excel file";
    document.getElementById("exportLabel").textContent = "Export " + MONTH_NAMES[parseInt(month.slice(5), 10) - 1].slice(0, 3) + " " + month.slice(0, 4) + " to Excel";
  }

  // ---- Glow follows pointer (rAF-throttled) ----
  var glow = document.getElementById("glow");
  var root = document.documentElement;
  var px = window.innerWidth / 2, py = window.innerHeight * 0.3, pending = false;
  function paint() {
    root.style.setProperty("--mx", px + "px");
    root.style.setProperty("--my", py + "px");
    pending = false;
  }
  function track(x, y) {
    px = x; py = y;
    if (!pending) { pending = true; requestAnimationFrame(paint); }
  }
  window.addEventListener("pointermove", function (e) { track(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    var t = e.touches[0]; if (t) track(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener("mouseleave", function () { glow.style.opacity = "0.4"; });
  document.addEventListener("mouseenter", function () { glow.style.opacity = "1"; });
  paint();

  // ---- Boot ----
  try {
    var savedTab = localStorage.getItem(TAB_KEY);
    if (TABS.indexOf(savedTab) !== -1) active = savedTab;
    var savedMonth = localStorage.getItem(MONTH_KEY);
    if (MONTHS.indexOf(savedMonth) !== -1) month = savedMonth;
  } catch (e) {}
  openSheet();

  var useClaude = window.claude && typeof window.claude.use === "function";
  if (!useClaude) loadLocal();
  renderMonths();
  renderTabs();
  renderRows();

  if (useClaude) {
    setStatus("Loading…");
    window.claude.use("db").then(function (store) {
      if (!store) {
        // No shared store in this view: keep entries in this browser
        loadLocal();
        renderMonths();
        renderTabs();
        renderRows();
        setStatus("Saving in this browser only.", "");
        return;
      }
      db = store;
      setStatus("");
      var lost = function () { setStatus("Lost connection to saved data. Reload the page.", "error"); };
      db.collection("parts").onSnapshot(applyParts, lost);
      db.collection("transactions").onSnapshot(applyTx, lost);
    });
  }
})();
</script>
</body>

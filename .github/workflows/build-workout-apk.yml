name: Build Workout APK

on:
  push:
    paths:
      - 'workout-app/**'
      - '.github/workflows/build-workout-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk StrengthProgram.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StrengthProgram-apk
          path: workout-app/StrengthProgram.apk

      - name: Publish to release "workout-app-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=workout-app-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" StrengthProgram.apk --clobber
          else
            gh release create "$TAG" StrengthProgram.apk --target "$GITHUB_SHA" \
              --title "Strength Program APK" \
              --notes "Latest build of the workout app. Download StrengthProgram.apk on your phone and install it."
          fi

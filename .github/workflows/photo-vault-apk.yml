name: Build Photo Vault APK

on:
  push:
    paths:
      - "photo-vault/**"
      - "!photo-vault/dist/**"
      - ".github/workflows/photo-vault-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: photo-vault
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p photo-vault/dist
          cp photo-vault/app/build/outputs/apk/release/app-release.apk photo-vault/dist/PhotoVault.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoVault-apk
          path: photo-vault/dist/PhotoVault.apk

      - name: Commit APK to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f photo-vault/dist/PhotoVault.apk
          git commit -m "Build PhotoVault.apk (run ${{ github.run_number }}) [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}

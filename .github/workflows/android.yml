name: Build FieldLog APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null 2>&1 || true

      - name: Download RNNoise model
        working-directory: android-app/app/src/main/cpp/rnnoise
        run: |
          hash=$(cat model_version)
          echo "Model: $hash"
          wget -q "https://media.xiph.org/rnnoise/models/rnnoise_data-$hash.tar.gz"
          tar xzf "rnnoise_data-$hash.tar.gz"
          test -f src/rnnoise_data.c && echo "model OK"

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | grep -vE '^[[:space:]]+at |^[[:space:]]+\.\.\. '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FieldLog-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

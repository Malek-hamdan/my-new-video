name: EnglishPath Android APK

on:
  push:
    paths:
      - "englishpath/**"
      - ".github/workflows/englishpath-android.yml"
  pull_request:
    paths:
      - "englishpath/**"
  workflow_dispatch:

concurrency:
  group: englishpath-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: englishpath

jobs:
  build:
    name: Test, build web, assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: englishpath/package-lock.json

      - name: Set up JDK 21 (required by Capacitor 8 / AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (exact lockfile)
        run: npm ci

      - name: Type check + unit tests
        run: |
          npx tsc -b
          npx vitest run

      - name: Build web app
        run: npx vite build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK (installable, signed with the debug key)
        working-directory: englishpath/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p ../dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ../dist-apk/EnglishPath-${{ github.run_number }}.apk
          ls -la ../dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishPath-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

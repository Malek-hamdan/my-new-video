name: Build Android APK

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        working-directory: game/android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp game/android/app/build/outputs/apk/debug/app-debug.apk RollingBall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RollingBall-apk
          path: RollingBall.apk

      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest RollingBall.apk \
            --title "دحرج الطابة - آخر نسخة" \
            --notes "نزّل RollingBall.apk على تلفون أندرويد وافتحه. (commit ${GITHUB_SHA::7})" \
            --target "$GITHUB_SHA" --prerelease

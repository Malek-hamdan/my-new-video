name: Build AnimeWear APK

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # Every APK must be signed with the same key, or Android refuses to
      # install it over the previous one. The permanent key lives in the
      # repository secrets; until they are set, a key kept in the cache is used.
      - name: Restore signing key
        id: debugkey
        if: ${{ env.KEYSTORE_B64 == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: animewear-debug-keystore-v1

      - name: Stop if the usual signing key is missing
        if: ${{ env.KEYSTORE_B64 == '' && steps.debugkey.outputs.cache-hit != 'true' }}
        run: |
          echo "::error::No signing key found. Set ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD in the repository secrets."
          exit 1

      - name: Use release key from secrets
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=animewear\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      # The build number is the run number, so every build is newer than the
      # last and installed apps can tell an update is waiting.
      - name: Build APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Name the APK and write version.json
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AnimeWear.apk
          echo "APK=AnimeWear.apk" >> "$GITHUB_ENV"
          NOTES=$(git log -1 --pretty=%s)
          python3 -c 'import json,sys; print(json.dumps({"version": sys.argv[1], "build": int(sys.argv[2]), "notes": sys.argv[3]}))' \
            "$VERSION" "$GITHUB_RUN_NUMBER" "$NOTES" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeWear-apk
          path: app/${{ env.APK }}

      - name: Publish as the latest download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: animewear-latest
          name: AnimeWear app (latest)
          prerelease: false
          make_latest: true
          body: |
            Latest AnimeWear Ledger build #${{ github.run_number }} from `${{ github.ref_name }}`.
            On Android: download the .apk below, open it, and allow installing from this source.
          files: |
            app/${{ env.APK }}
            app/version.json

name: Build Android APK

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Every build is signed with the same upload key, so updates install over the previous
      # version and keep the player's saved progress. See game/SIGNING.md.
      - name: Restore the upload key
        env:
          RB_KEYSTORE_B64: ${{ secrets.RB_KEYSTORE_B64 }}
        run: |
          if [ -z "$RB_KEYSTORE_B64" ]; then
            echo "::error::Missing the RB_KEYSTORE_B64 and RB_STORE_PASSWORD secrets; see game/SIGNING.md"
            exit 1
          fi
          echo "$RB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RB_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        working-directory: game/android
        env:
          RB_STORE_PASSWORD: ${{ secrets.RB_STORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          cp game/android/app/build/outputs/apk/release/app-release.apk RollingBall.apk
          cp game/android/app/build/outputs/bundle/release/app-release.aab RollingBall.aab

      - uses: actions/upload-artifact@v4
        with:
          name: RollingBall
          path: |
            RollingBall.apk
            RollingBall.aab

      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest RollingBall.apk RollingBall.aab \
            --title "دحرج الطابة - آخر نسخة" \
            --notes "نزّل RollingBall.apk على تلفون أندرويد وافتحه. (commit ${GITHUB_SHA::7})" \
            --target "$GITHUB_SHA" --prerelease

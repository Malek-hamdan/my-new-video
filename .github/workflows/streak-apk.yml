name: Build Streak APK
on:
  push:
    paths: ['streak-app/**', '.github/workflows/streak-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: streak-app
        run: gradle assembleDebug --no-daemon
      - run: cp streak-app/app/build/outputs/apk/debug/app-debug.apk Streak.apk
      - uses: actions/upload-artifact@v4
        with: { name: Streak-apk, path: Streak.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: streak-v${{ github.run_number }}
          name: Streak v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Streak.apk

name: Build Scars APK
on:
  push:
    paths: ['scars-app/**', '.github/workflows/scars-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: scars-app
        run: gradle assembleDebug --no-daemon
      - run: cp scars-app/app/build/outputs/apk/debug/app-debug.apk Scars.apk
      - uses: actions/upload-artifact@v4
        with: { name: Scars-apk, path: Scars.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: scars-v${{ github.run_number }}
          name: Scars v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Scars.apk

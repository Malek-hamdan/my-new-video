<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Expenses</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --text:#14201d; --muted:#5f6f6a; --line:#e2e8e5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec; --danger:#c0392b; --star:#e6a700;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1513; --card:#172220; --text:#e8efed; --muted:#93a59f; --line:#26332f;
    --accent:#2bb3a3; --accent-ink:#06201c; --accent-soft:#16352f; --danger:#ef6b5b; --star:#f5c242;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font:inherit;color:inherit}
header{
  position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
header h1{font-size:20px;margin:0}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 12px;font-size:14px;color:var(--muted);cursor:pointer;
}
.chip.warn{color:var(--danger);border-color:var(--danger)}
main{padding:0 16px;max-width:560px;margin:0 auto}
.view{display:none}
.view.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.label{font-size:13px;color:var(--muted);margin-bottom:4px}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.sub{font-size:18px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.navrow .title{font-weight:700;text-align:center;flex:1}
.iconbtn{
  width:48px;height:48px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:22px;cursor:pointer;
}
.daygroup{font-size:13px;color:var(--muted);margin:16px 4px 6px;font-weight:600}
.item{
  display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;width:100%;
  border:0;text-align:left;
}
.item .cat{
  flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;
  background:var(--accent-soft);color:var(--accent);min-width:78px;text-align:center;
}
.item .mid{flex:1;min-width:0}
.item .note{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{text-align:right;font-weight:700}
.item .amt small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.item .actions{display:flex;gap:6px}
.item .actions span{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.empty{text-align:center;color:var(--muted);padding:32px 8px}
.addbar{
  position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));
  padding:8px 16px;z-index:6;display:none;
}
.addbar.show{display:block}
.primary{
  width:100%;min-height:56px;border:0;border-radius:16px;background:var(--accent);
  color:var(--accent-ink);font-size:18px;font-weight:700;cursor:pointer;
  max-width:528px;display:block;margin:0 auto;box-shadow:0 4px 14px rgba(15,118,110,.3);
}
.secondary{
  width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--card);
  font-weight:600;cursor:pointer;
}
.danger{color:var(--danger);border-color:var(--danger)}
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;height:64px;border:0;background:none;font-size:13px;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
nav.tabs button .ic{font-size:20px}
nav.tabs button.active{color:var(--accent);font-weight:700}
.field{margin-bottom:14px}
.field>label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],textarea{
  width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);padding:10px 12px;font-size:18px;
}
textarea{min-height:70px;resize:vertical;font-size:16px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.amountinput{font-size:28px !important;font-weight:700;min-height:60px !important}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);
  font-weight:600;cursor:pointer;padding:0 10px;
}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg.cats button{flex:1 1 30%}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.err{font-size:14px;color:var(--danger);margin-top:6px;display:none}
.err.show{display:block}
.stars{display:flex;gap:6px;margin:4px 0 12px}
.stars button{
  flex:1;height:52px;border:0;background:none;font-size:36px;line-height:1;cursor:pointer;
  color:var(--line);padding:0;
}
.stars button.on{color:var(--star)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.result{font-size:26px;font-weight:700;margin-top:4px}
.sheetwrap{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;
  align-items:flex-end;justify-content:center;
}
.sheetwrap.show{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
}
.sheet h2{margin:0 0 14px;font-size:20px}
.btnrow{display:flex;gap:10px;margin-top:6px}
.btnrow>*{flex:1}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;
  z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1 id="hdrTitle">Expenses</h1>
  <button class="chip" id="rateChip" type="button"></button>
</header>

<main>
  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="card">
      <div class="label" id="homeMonthLabel"></div>
      <div class="big" id="homeGhs"></div>
      <div class="sub" id="homeUsd"></div>
    </div>
    <div id="list"></div>
  </section>

  <!-- CONVERT -->
  <section class="view" id="view-convert">
    <div class="card">
      <div class="field">
        <label for="cvRate">Exchange rate: 1 USD = ? GHS</label>
        <input type="number" id="cvRate" inputmode="decimal" step="any" min="0" placeholder="Enter rate">
        <div class="hint" id="cvRateHint"></div>
      </div>
      <button class="secondary" id="cvSaveRate" type="button">Save rate</button>
    </div>
    <div class="card">
      <div class="field">
        <label for="cvUsd">Amount in USD</label>
        <input type="number" id="cvUsd" class="amountinput" inputmode="decimal" step="any" min="0" placeholder="0.00">
      </div>
      <div class="label">In Ghana Cedi</div>
      <div class="result" id="cvOut">—</div>
      <div class="err" id="cvErr">Enter the exchange rate above first.</div>
    </div>
  </section>

  <!-- WEEK -->
  <section class="view" id="view-week">
    <div class="navrow">
      <button class="iconbtn" id="wkPrev" type="button" aria-label="Previous week">‹</button>
      <div class="title" id="wkTitle"></div>
      <button class="iconbtn" id="wkNext" type="button" aria-label="Next week">›</button>
    </div>
    <div class="card">
      <div class="label">Week total <span id="wkCount"></span></div>
      <div class="big" id="wkGhs"></div>
      <div class="sub" id="wkUsd"></div>
    </div>
    <div class="card">
      <div class="label">Rate this week</div>
      <div class="stars" id="wkStars"></div>
      <div class="field">
        <textarea id="wkNote" maxlength="200" placeholder="Short note (optional)"></textarea>
      </div>
      <button class="primary" id="wkSave" type="button">Save week rating</button>
    </div>
  </section>

  <!-- MONTH -->
  <section class="view" id="view-month">
    <div class="navrow">
      <button class="iconbtn" id="moPrev" type="button" aria-label="Previous month">‹</button>
      <div class="title" id="moTitle"></div>
      <button class="iconbtn" id="moNext" type="button" aria-label="Next month">›</button>
    </div>
    <div class="card">
      <div class="label">Month total <span id="moCount"></span></div>
      <div class="big" id="moGhs"></div>
      <div class="sub" id="moUsd"></div>
    </div>
    <div class="card">
      <div class="label">By category</div>
      <table>
        <thead><tr><th>Category</th><th>GHS</th><th>USD</th></tr></thead>
        <tbody id="moCats"></tbody>
      </table>
    </div>
    <div class="card">
      <div class="label">Rate this month</div>
      <div class="stars" id="moStars"></div>
      <div class="field">
        <textarea id="moNote" maxlength="400" placeholder="Note (optional)"></textarea>
      </div>
      <button class="primary" id="moSave" type="button">Save month rating</button>
    </div>
  </section>
</main>

<div class="addbar show" id="addbar">
  <button class="primary" id="addBtn" type="button">＋ Add expense</button>
</div>

<nav class="tabs">
  <button type="button" data-view="home" class="active"><span class="ic">🏠</span>Home</button>
  <button type="button" data-view="convert"><span class="ic">💱</span>Convert</button>
  <button type="button" data-view="week"><span class="ic">📅</span>Week</button>
  <button type="button" data-view="month"><span class="ic">🗓️</span>Month</button>
</nav>

<!-- Expense sheet -->
<div class="sheetwrap" id="expSheet">
  <form class="sheet" id="expForm" novalidate>
    <h2 id="expTitle">Add expense</h2>
    <div class="field">
      <label for="fAmount">Amount</label>
      <input type="number" id="fAmount" class="amountinput" inputmode="decimal" step="any" min="0" placeholder="0.00">
      <div class="err" id="eAmount">Enter an amount greater than 0.</div>
    </div>
    <div class="field">
      <label>Currency</label>
      <div class="seg" id="fCurrency">
        <button type="button" data-v="GHS">GHS (Cedi)</button>
        <button type="button" data-v="USD">USD ($)</button>
      </div>
    </div>
    <div class="field">
      <label for="fRate">Exchange rate: 1 USD = ? GHS</label>
      <input type="number" id="fRate" inputmode="decimal" step="any" min="0" placeholder="Enter rate">
      <div class="hint" id="fConv"></div>
      <div class="err" id="eRate">Enter the exchange rate before saving.</div>
    </div>
    <div class="field">
      <label>Category</label>
      <div class="seg cats" id="fCategory"></div>
    </div>
    <div class="field">
      <label for="fDate">Date</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label for="fNote">Note (optional)</label>
      <input type="text" id="fNote" maxlength="120" placeholder="e.g. lunch, taxi…">
    </div>
    <button class="primary" type="submit">Save</button>
    <div class="btnrow" style="margin-top:10px">
      <button class="secondary" type="button" id="fCancel">Cancel</button>
      <button class="secondary danger" type="button" id="fDelete">Delete</button>
    </div>
  </form>
</div>

<!-- Rate sheet -->
<div class="sheetwrap" id="rateSheet">
  <form class="sheet" id="rateForm" novalidate>
    <h2>Exchange rate</h2>
    <div class="field">
      <label for="rInput">1 USD = ? GHS</label>
      <input type="number" id="rInput" class="amountinput" inputmode="decimal" step="any" min="0" placeholder="Enter rate">
      <div class="err" id="eR">Enter a rate greater than 0.</div>
    </div>
    <button class="primary" type="submit">Save rate</button>
    <div class="btnrow" style="margin-top:10px">
      <button class="secondary" type="button" id="rCancel">Cancel</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var KEY = 'monthly-expenses-v1';
  var CATS = ['Food','Transport','Rent','Bills','Other'];

  // ---------- storage ----------
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var d = JSON.parse(raw);
        return {
          expenses: Array.isArray(d.expenses) ? d.expenses : [],
          rate: typeof d.rate === 'number' && d.rate > 0 ? d.rate : null,
          weeks: d.weeks || {},
          months: d.months || {}
        };
      }
    }catch(e){}
    return {expenses:[], rate:null, weeks:{}, months:{}};
  }
  var db = load();
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(db)); return true; }
    catch(e){ toast('Could not save on this device'); return false; }
  }
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }

  // ---------- dates ----------
  function pad(n){ return (n<10?'0':'') + n; }
  function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function today(){ return iso(new Date()); }
  function mondayOf(s){
    var d = parse(s); var dow = (d.getDay() + 6) % 7; // Mon=0 … Sun=6
    d.setDate(d.getDate() - dow); return iso(d);
  }
  function addDays(s, n){ var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function monthKey(s){ return s.slice(0,7); }
  function addMonths(k, n){
    var y = +k.slice(0,4), m = +k.slice(5,7) - 1 + n;
    var d = new Date(y, m, 1); return d.getFullYear() + '-' + pad(d.getMonth()+1);
  }
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function monthName(k){ return MONTHS[+k.slice(5,7)-1] + ' ' + k.slice(0,4); }
  function shortDate(s){ var d = parse(s); return d.getDate() + ' ' + MON3[d.getMonth()]; }
  function dayLabel(s){
    if(s === today()) return 'Today';
    if(s === addDays(today(), -1)) return 'Yesterday';
    var d = parse(s); return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MON3[d.getMonth()] + ' ' + d.getFullYear();
  }

  // ---------- money ----------
  function fmt(n){ return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function ghs(n){ return 'GH₵ ' + fmt(n); }
  function usd(n){ return '$ ' + fmt(n); }
  // Each expense keeps the rate used when it was saved.
  function inGhs(e){ return e.currency === 'GHS' ? e.amount : e.amount * e.rate; }
  function inUsd(e){ return e.currency === 'USD' ? e.amount : e.amount / e.rate; }
  function totals(list){
    var g = 0, u = 0;
    list.forEach(function(e){ g += inGhs(e); u += inUsd(e); });
    return {ghs:g, usd:u, count:list.length};
  }
  function countLabel(n){ return '(' + n + (n === 1 ? ' expense)' : ' expenses)'); }

  // ---------- ui helpers ----------
  function $(id){ return document.getElementById(id); }
  var toastTimer;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function num(v){ var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ---------- rate chip ----------
  function renderRate(){
    var c = $('rateChip');
    if(db.rate){ c.textContent = '1 USD = ' + db.rate + ' GHS'; c.classList.remove('warn'); }
    else { c.textContent = 'Set exchange rate'; c.classList.add('warn'); }
    $('cvRate').value = db.rate || '';
    $('cvRateHint').textContent = db.rate ? 'Saved rate: 1 USD = ' + db.rate + ' GHS' : 'No rate saved yet.';
    renderConvert();
  }
  function setRate(r){ db.rate = r; save(); renderRate(); }

  // ---------- views ----------
  var current = 'home';
  var TITLES = {home:'Expenses', convert:'Convert', week:'Week', month:'Month'};
  function show(v){
    current = v;
    document.querySelectorAll('.view').forEach(function(el){ el.classList.toggle('active', el.id === 'view-' + v); });
    document.querySelectorAll('nav.tabs button').forEach(function(b){ b.classList.toggle('active', b.dataset.view === v); });
    $('addbar').classList.toggle('show', v === 'home');
    $('hdrTitle').textContent = TITLES[v];
    render();
    window.scrollTo(0,0);
  }
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.addEventListener('click', function(){ show(b.dataset.view); });
  });

  function sorted(){
    return db.expenses.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.created||0) - (a.created||0);
    });
  }

  function renderHome(){
    var mk = monthKey(today());
    var t = totals(db.expenses.filter(function(e){ return monthKey(e.date) === mk; }));
    $('homeMonthLabel').textContent = monthName(mk) + ' — total ' + countLabel(t.count);
    $('homeGhs').textContent = ghs(t.ghs);
    $('homeUsd').textContent = usd(t.usd);

    var list = sorted();
    if(!list.length){
      $('list').innerHTML = '<div class="empty">No expenses yet.<br>Tap “Add expense” to record one.</div>';
      return;
    }
    var html = '', lastDay = '';
    list.forEach(function(e){
      if(e.date !== lastDay){ html += '<div class="daygroup">' + esc(dayLabel(e.date)) + '</div>'; lastDay = e.date; }
      var main = e.currency === 'USD' ? usd(e.amount) : ghs(e.amount);
      var other = e.currency === 'USD' ? ghs(inGhs(e)) : usd(inUsd(e));
      html += '<div class="item" data-id="' + esc(e.id) + '">' +
        '<span class="cat">' + esc(e.category) + '</span>' +
        '<div class="mid"><div class="amt" style="text-align:left">' + main + '<small>' + other + '</small></div>' +
        (e.note ? '<div class="note">' + esc(e.note) + '</div>' : '') + '</div>' +
        '<div class="actions">' +
          '<span role="button" aria-label="Edit" data-act="edit">✏️</span>' +
          '<span role="button" aria-label="Delete" data-act="del">🗑️</span>' +
        '</div></div>';
    });
    $('list').innerHTML = html;
  }
  $('list').addEventListener('click', function(ev){
    var item = ev.target.closest('.item'); if(!item) return;
    var act = ev.target.closest('[data-act]');
    if(act && act.dataset.act === 'del'){ removeExpense(item.dataset.id); return; }
    openExpense(item.dataset.id);
  });

  function renderConvert(){
    var r = num($('cvRate').value);
    var a = num($('cvUsd').value);
    var hasRate = r > 0;
    $('cvErr').classList.toggle('show', !hasRate && $('cvUsd').value !== '');
    $('cvOut').textContent = (hasRate && a >= 0) ? ghs(a * r) + '  ·  ' + usd(a) : '—';
  }
  $('cvUsd').addEventListener('input', renderConvert);
  $('cvRate').addEventListener('input', renderConvert);
  $('cvSaveRate').addEventListener('click', function(){
    var r = num($('cvRate').value);
    if(!(r > 0)){ toast('Enter a rate greater than 0'); $('cvRate').focus(); return; }
    setRate(r); toast('Rate saved');
  });

  // ---------- stars ----------
  function makeStars(id){
    var box = $(id), val = 0;
    for(var i=1;i<=5;i++){
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = '★'; b.dataset.v = i; b.setAttribute('aria-label', i + ' star' + (i>1?'s':''));
      box.appendChild(b);
    }
    function paint(){ box.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', +b.dataset.v <= val); }); }
    box.addEventListener('click', function(ev){
      var b = ev.target.closest('button'); if(!b) return;
      val = (+b.dataset.v === val) ? 0 : +b.dataset.v; paint();
    });
    return { get: function(){ return val; }, set: function(v){ val = v || 0; paint(); } };
  }
  var wkStars = makeStars('wkStars');
  var moStars = makeStars('moStars');

  // ---------- week ----------
  var wkStart = mondayOf(today());
  function renderWeek(){
    var end = addDays(wkStart, 6);
    $('wkTitle').textContent = shortDate(wkStart) + ' – ' + shortDate(end) + ' ' + end.slice(0,4);
    var t = totals(db.expenses.filter(function(e){ return e.date >= wkStart && e.date <= end; }));
    $('wkGhs').textContent = ghs(t.ghs);
    $('wkUsd').textContent = usd(t.usd);
    $('wkCount').textContent = countLabel(t.count);
    var r = db.weeks[wkStart] || {};
    wkStars.set(r.stars); $('wkNote').value = r.note || '';
  }
  $('wkPrev').addEventListener('click', function(){ wkStart = addDays(wkStart, -7); renderWeek(); });
  $('wkNext').addEventListener('click', function(){ wkStart = addDays(wkStart, 7); renderWeek(); });
  $('wkSave').addEventListener('click', function(){
    var s = wkStars.get(), n = $('wkNote').value.trim();
    if(!s){ toast('Choose 1 to 5 stars'); return; }
    db.weeks[wkStart] = {stars:s, note:n};
    if(save()) toast('Week rating saved');
  });

  // ---------- month ----------
  var moKey = monthKey(today());
  function renderMonth(){
    $('moTitle').textContent = monthName(moKey);
    var list = db.expenses.filter(function(e){ return monthKey(e.date) === moKey; });
    var t = totals(list);
    $('moGhs').textContent = ghs(t.ghs);
    $('moUsd').textContent = usd(t.usd);
    $('moCount').textContent = countLabel(t.count);
    $('moCats').innerHTML = CATS.map(function(c){
      var ct = totals(list.filter(function(e){ return e.category === c; }));
      return '<tr><td>' + c + '</td><td>' + fmt(ct.ghs) + '</td><td>' + fmt(ct.usd) + '</td></tr>';
    }).join('');
    var r = db.months[moKey] || {};
    moStars.set(r.stars); $('moNote').value = r.note || '';
  }
  $('moPrev').addEventListener('click', function(){ moKey = addMonths(moKey, -1); renderMonth(); });
  $('moNext').addEventListener('click', function(){ moKey = addMonths(moKey, 1); renderMonth(); });
  $('moSave').addEventListener('click', function(){
    var s = moStars.get(), n = $('moNote').value.trim();
    if(!s){ toast('Choose 1 to 5 stars'); return; }
    db.months[moKey] = {stars:s, note:n};
    if(save()) toast('Month rating saved');
  });

  function render(){
    if(current === 'home') renderHome();
    else if(current === 'week') renderWeek();
    else if(current === 'month') renderMonth();
    else renderConvert();
  }

  // ---------- expense sheet ----------
  var editingId = null, fCur = 'GHS', fCat = 'Food';
  $('fCategory').innerHTML = CATS.map(function(c){ return '<button type="button" data-v="' + c + '">' + c + '</button>'; }).join('');
  function paintSeg(id, v){ $(id).querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); }); }
  $('fCurrency').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if(!b) return; fCur = b.dataset.v; paintSeg('fCurrency', fCur); updateConv();
  });
  $('fCategory').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if(!b) return; fCat = b.dataset.v; paintSeg('fCategory', fCat);
  });
  function updateConv(){
    var a = num($('fAmount').value), r = num($('fRate').value);
    if(!(a > 0)){ $('fConv').textContent = ''; return; }
    if(!(r > 0)){ $('fConv').textContent = 'Enter the rate to see the converted value.'; return; }
    $('fConv').textContent = fCur === 'USD'
      ? usd(a) + ' = ' + ghs(a * r)
      : ghs(a) + ' = ' + usd(a / r);
  }
  $('fAmount').addEventListener('input', function(){ $('eAmount').classList.remove('show'); updateConv(); });
  $('fRate').addEventListener('input', function(){ $('eRate').classList.remove('show'); updateConv(); });

  function openSheet(id){ $(id).classList.add('show'); }
  function closeSheet(id){ $(id).classList.remove('show'); }

  function openExpense(id){
    var e = id ? db.expenses.find(function(x){ return x.id === id; }) : null;
    editingId = e ? e.id : null;
    $('expTitle').textContent = e ? 'Edit expense' : 'Add expense';
    $('fAmount').value = e ? e.amount : '';
    fCur = e ? e.currency : 'GHS';
    fCat = e ? e.category : 'Food';
    $('fRate').value = e ? e.rate : (db.rate || '');
    $('fDate').value = e ? e.date : today();
    $('fNote').value = e ? (e.note || '') : '';
    $('fDelete').style.display = e ? '' : 'none';
    paintSeg('fCurrency', fCur); paintSeg('fCategory', fCat);
    $('eAmount').classList.remove('show'); $('eRate').classList.remove('show');
    updateConv();
    openSheet('expSheet');
    if(!e){ setTimeout(function(){ (db.rate ? $('fAmount') : $('fRate')).focus(); }, 50); }
  }

  $('addBtn').addEventListener('click', function(){ openExpense(null); });
  $('fCancel').addEventListener('click', function(){ closeSheet('expSheet'); });
  $('fDelete').addEventListener('click', function(){ if(editingId && removeExpense(editingId)) closeSheet('expSheet'); });

  $('expForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var a = num($('fAmount').value), r = num($('fRate').value), ok = true;
    if(!(a > 0)){ $('eAmount').classList.add('show'); ok = false; }
    if(!(r > 0)){ $('eRate').classList.add('show'); ok = false; }
    if(!ok){ ( !(a > 0) ? $('fAmount') : $('fRate') ).focus(); return; }
    var date = $('fDate').value || today();
    var data = {
      amount: Math.round(a * 100) / 100, currency: fCur, rate: r,
      category: fCat, date: date, note: $('fNote').value.trim()
    };
    if(editingId){
      var e = db.expenses.find(function(x){ return x.id === editingId; });
      if(e) Object.assign(e, data);
    } else {
      data.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      data.created = Date.now();
      db.expenses.push(data);
    }
    if(r !== db.rate) db.rate = r; // remember last entered rate
    if(save()){
      closeSheet('expSheet'); renderRate(); render();
      toast(editingId ? 'Expense updated' : 'Expense added');
    }
  });

  function removeExpense(id){
    var e = db.expenses.find(function(x){ return x.id === id; }); if(!e) return false;
    var label = (e.currency === 'USD' ? usd(e.amount) : ghs(e.amount)) + ' · ' + e.category;
    if(!confirm('Delete this expense?\n' + label)) return false;
    db.expenses = db.expenses.filter(function(x){ return x.id !== id; });
    save(); render(); toast('Expense deleted');
    return true;
  }

  // ---------- rate sheet ----------
  $('rateChip').addEventListener('click', function(){
    $('rInput').value = db.rate || ''; $('eR').classList.remove('show');
    openSheet('rateSheet'); setTimeout(function(){ $('rInput').focus(); }, 50);
  });
  $('rCancel').addEventListener('click', function(){ closeSheet('rateSheet'); });
  $('rateForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var r = num($('rInput').value);
    if(!(r > 0)){ $('eR').classList.add('show'); return; }
    setRate(r); closeSheet('rateSheet'); render(); toast('Rate saved');
  });

  // close sheets by tapping the backdrop
  ['expSheet','rateSheet'].forEach(function(id){
    $(id).addEventListener('click', function(ev){ if(ev.target.id === id) closeSheet(id); });
  });

  // Refresh "today" if the app stays open past midnight
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });

  renderRate();
  render();

  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>

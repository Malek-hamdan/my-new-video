<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rolling Ball</title>
<style>
html,body{margin:0;height:100%;background:#07051a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;color:#fff;font-weight:800;font-size:20px;text-shadow:0 2px 6px #000c;pointer-events:none}
#hud .grp{display:flex;gap:14px;align-items:center;white-space:nowrap}
#powers{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 54px);display:flex;justify-content:center;gap:14px;color:#fff;font-weight:800;font-size:18px;text-shadow:0 2px 6px #000c;pointer-events:none}
#mute,#pause{pointer-events:auto;background:#fff2;border:0;color:#fff;font-size:20px;border-radius:12px;padding:4px 10px}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(11,8,32,.82);color:#fff;text-align:center;gap:16px;padding:24px}
.hidden{display:none!important}
h1{font-size:38px;margin:0;line-height:1.3;background:linear-gradient(90deg,#4cc9f0,#f72585);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(180deg,#4cc9f0,#3a86ff);color:#fff;border:0;border-radius:18px;font-size:26px;font-weight:900;padding:14px 52px;box-shadow:0 6px 0 #2457b3;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #2457b3}
.btn.alt{background:linear-gradient(180deg,#ff5fa2,#f72585);box-shadow:0 6px 0 #a0105a;font-size:22px;padding:12px 30px}
.btn:disabled{filter:grayscale(1);opacity:.5}
.btn.mighty{background:linear-gradient(180deg,#ff3355,#8a1a3a);box-shadow:0 6px 0 #4a0c24;font-size:22px;padding:12px 30px}
.btn.small{font-size:18px;padding:9px 26px;background:#ffffff22;box-shadow:none}
#mightyNote{font-size:14px;margin-top:-8px}
#lvbar{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 42px);height:5px;border-radius:4px;background:#ffffff26;overflow:hidden;pointer-events:none}
#lvbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cc9f0,#f72585)}
.set{width:min(86vw,340px);display:flex;flex-direction:column;gap:18px;background:#ffffff12;border-radius:18px;padding:18px;text-align:left}
.srow{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800}
.srow.col{flex-direction:column;align-items:stretch;gap:10px}
.srow small{font-size:13px;font-weight:600;opacity:.75;line-height:1.5}
.sw{width:62px;height:34px;border-radius:20px;border:0;background:#ffffff33;position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:#4cc9f0}.sw.on::after{left:32px}
.seg{display:flex;background:#ffffff1a;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:#fff;font:800 15px system-ui;padding:9px 0;border-radius:9px}
.seg button.on{background:linear-gradient(180deg,#4cc9f0,#3a86ff)}
.overlay p{margin:0;font-size:17px;opacity:.92;line-height:1.8}
.big{font-size:64px;font-weight:900;line-height:1}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:min(40px,9vw);white-space:pre-line;line-height:1.25;font-weight:900;color:#fff;text-shadow:0 4px 14px #000;pointer-events:none;opacity:0;transform:scale(.6);transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .3s}
#msg.show{opacity:1;transform:scale(1)}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0%,#c8b6ff 40%,#3a0ca3 100%);opacity:0;pointer-events:none;transition:opacity .6s;z-index:3}
#flash.on{opacity:1;transition:opacity .35s}
#loading{background:radial-gradient(circle at 50% 60%,#3a0ca3 0%,#07051a 70%);z-index:5;transition:opacity .4s}
#loading.fade{opacity:0}
.bar{width:min(70vw,280px);height:12px;border-radius:8px;background:#ffffff22;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#4cc9f0,#f72585);transition:width .25s}
#spin{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0fbff,#4cc9f0 45%,#1e3a8a);box-shadow:0 0 30px #4cc9f088;animation:roll 1s linear infinite}
@keyframes roll{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div class="grp"><span id="lvl">Lv 1</span><span id="dist">0 m</span><span id="gems">💎 0</span></div>
  <div class="grp"><span id="best">🏆 0</span><button id="pause">⏸</button><button id="mute">🔊</button></div>
</div>
<div id="lvbar" class="hidden"><i></i></div>
<div id="powers" class="hidden"><span id="shield"></span><span id="magnet"></span><span id="slow"></span><span id="double"></span></div>
<div id="msg"></div>
<div id="flash"></div>

<div id="loading" class="overlay">
  <div id="spin"></div>
  <h1>Rolling Ball</h1>
  <div class="bar"><i id="barFill"></i></div>
  <p id="loadTxt">Loading… 0%</p>
</div>

<div id="menu" class="overlay hidden">
  <div class="big">🔵</div>
  <h1>Rolling Ball</h1>
  <button class="btn" id="play">Play</button>
  <button class="btn small hidden" id="playFresh">Start from Level 1</button>
  <button class="btn mighty" id="playMighty">💀 Mighty Level</button>
  <p id="mightyNote"></p>
  <button class="btn small" id="openSettings">⚙️ Settings</button>
  <p id="menuBest"></p>
</div>

<div id="over" class="overlay hidden">
  <div class="big" id="overIcon">💥</div>
  <h1 id="overTitle">Game Over</h1>
  <div class="big" id="finalScore">0</div>
  <p id="finalInfo"></p>
  <button class="btn alt" id="cont">Second Chance ❤️</button>
  <button class="btn" id="again">Play Again</button>
  <button class="btn small" id="home">Menu</button>
  <p id="bank"></p>
</div>

<div id="paused" class="overlay hidden">
  <div class="big">⏸</div>
  <h1>Paused</h1>
  <button class="btn" id="resume">Resume</button>
  <button class="btn small" id="pauseMenu">Menu</button>
</div>

<div id="settings" class="overlay hidden">
  <h1>Settings</h1>
  <div class="set">
    <div class="srow"><span>🔊 Sound</span><button class="sw" id="setSound"></button></div>
    <div class="srow"><span>📳 Vibration</span><button class="sw" id="setVibe"></button></div>
    <div class="srow col"><span>✨ Graphics quality</span>
      <div class="seg" id="setQuality"><button data-q="low">Low</button><button data-q="medium">Medium</button><button data-q="high">High</button><button data-q="auto">Auto</button></div>
      <small id="qualityNote"></small>
    </div>
  </div>
  <button class="btn" id="setClose">Done</button>
</div>

<script>
(() => {
const cv = document.getElementById('c');
const $ = id => document.getElementById(id);
const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

// ---------- world layout ----------
// The game runs in "track space": x across the 5 lanes, y up from the track, z distance travelled.
// Rendering bends that space into hills and curves; the rules never see them.
const COLS = 5, HALF = 2.5, ROW = 2, R = 0.35, BLOCK_H = 0.9, VIEW = 80;
const viewDist = () => clamp(VIEW + (ball.speed - 24) * 2.5, VIEW, 150);
const FLOOR = 0, HOLE = 1, BLOCK = 2, PAD = 3;
const BOX_STEP = 0.35;   // a ball this close to a box's top rides over it rather than crashing
const MOVER_HW = 0.42;   // half width of a sliding wall
// the Mighty Level starts at full speed in hard mode
const speedAt = z => Math.min(40, (S.mighty ? 28 : 14) + z * 0.026);   // 14 m/s at the start, 40 m/s by about 1000 m
const LEVEL_LEN = 3000, MIGHTY_LEVEL = 10;
// lasers from level 10 (and in the Mighty Level): a low fence to jump (some blink off and on)
// and a tall beam that sweeps across the lanes, which has to be dodged
const LASER_LEVEL = 10, LASER_Y = 0.45;
const lasersOn = () => S.mighty || S.level >= LASER_LEVEL;
const laserLit = l => l.type !== 'fence' || !l.blink || Math.sin(time * l.w + l.ph) > -0.2;
const sweepX = l => Math.sin(time * l.w + l.ph) * 2.2;
const HARD_AT = 3000, HARD_SPEED = 6;   // hard mode starts 3000 m down the track (level 2); extra speed once fully hard (7000 m+)
const TURBO_AT = 5000, TURBO_SPEED = 15;   // at 5000 m the speed jumps by 15 m/s over the next 300 m: around 60 m/s
const ramp = (z, a, b) => clamp((z - a) / (b - a), 0, 1);
const elev = z => ramp(z, 60, 180) * (2.2 * Math.sin(z * 0.021) + 1.1 * Math.sin(z * 0.057 + 1.3));
const bend = z => ramp(z, 120, 280) * (9 * Math.sin(z * 0.0105) + 3 * Math.sin(z * 0.027 + 2));

let W, H, THREE;
let lowQ = load('rb_lowq2') === '1';   // what Auto picked last time on this phone
let quality = load('rb_quality') || 'auto';   // low / medium / high, or auto

// ---------- audio ----------
let AC = null, muted = load('rb_mute') === '1';
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, f2, delay) {
  const a = ac(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d);
}
function noise(d, v, freq) {
  const a = ac(); if (!a || muted) return;
  const n = a.sampleRate * d | 0, b = a.createBuffer(1, n, a.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = b;
  const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq;
  const g = a.createGain(); g.gain.value = v;
  s.connect(fl).connect(g).connect(a.destination); s.start();
}
const sfx = {
  gem() { tone(1320, 0.12, 'square', 0.07); tone(1760, 0.18, 'square', 0.07, null, 0.07); },
  jump() { tone(300, 0.22, 'sine', 0.25, 700); },
  boost() { tone(200, 0.5, 'sawtooth', 0.15, 1200); tone(400, 0.4, 'sine', 0.2, 1600); },
  land(v) { const k = Math.min(1, (v || 3) / 12); tone(90, 0.2, 'sine', 0.3 + 0.4 * k, 38); noise(0.12 + 0.12 * k, 0.2 + 0.4 * k, 260); },
  zap() { tone(1800, 0.35, 'sawtooth', 0.15, 120); noise(0.4, 0.4, 3000); },
  crash() { noise(0.6, 0.6, 900); tone(160, 0.4, 'sawtooth', 0.2, 40); },
  fall() { tone(600, 1.0, 'triangle', 0.2, 80); },
  power() { [520, 780, 1040, 1560].forEach((f, i) => tone(f, 0.12, 'triangle', 0.14, null, i * 0.06)); },
  level() { [660, 880, 1100].forEach((f, i) => tone(f, 0.15, 'triangle', 0.15, null, i * 0.09)); },
};
let vibeOff = load('rb_vibe') === '0';
// Music for the Rhythm World. The song's clock drives the ball there, so tiles placed on the beats
// are landed on the beats. Without audio the same clock just runs on frame time.
const M = { src: null, gain: null, t0: 0, pos0: 0, fpos: 0, on: false };
function musicStart(pos) {
  musicStop();
  M.fpos = pos; M.pos0 = pos; M.on = false;
  const a = ac(), song = window.SONGS && SONGS[0];
  if (!a || !song || !song.buf || window.__dtClock) return;
  if (!M.gain) { M.gain = a.createGain(); M.gain.connect(a.destination); }
  M.gain.gain.cancelScheduledValues(a.currentTime); M.gain.gain.setValueAtTime(muted ? 0 : 0.7, a.currentTime);
  const src = a.createBufferSource(); src.buffer = song.buf; src.connect(M.gain);
  M.t0 = a.currentTime + 0.05; src.start(M.t0, Math.max(0, pos));
  M.src = src; M.on = true;
}
function musicPos(dt) {
  if (M.on && AC && AC.state === 'running') return M.pos0 + Math.max(0, AC.currentTime - M.t0);
  M.fpos += dt; return M.fpos;
}
function musicStop(fade) {
  if (!M.src) return;
  const src = M.src, now = AC.currentTime; M.src = null; M.on = false;
  if (fade) { M.gain.gain.setTargetAtTime(0, now, 0.08); src.stop(now + 0.5); } else src.stop();
}
const buzz = p => { if (vibeOff) return; try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------- state ----------
const S = { phase: 'loading', gems: 0, best: +(load('rb_best') || 0), bestMighty: +(load('rb_best_mighty') || 0), mightyOpen: load('rb_mighty') === '1',
  mighty: false, level: 1, levelZ: 0, startZ: 0, savedLevel: Math.max(1, +(load('rb_level') || 1)), shake: 0, combo: 0,
  bank: +(load('rb_bank') || 0), banked: 0, continues: 0, msgT: 0, endT: 0, endFell: false, dark: 0, hard: 0, turbo: 0, world: 'run', wt: 0, pulse: 0, rpts: 0 };
let ball, rows, camX, parts, gen, cam, pulled, time = 0;

function newRow() { return { cells: new Array(COLS).fill(FLOOR), gems: [], power: null, movers: [], tunnel: false, group: null, dirty: false }; }

function makeRow(i) {
  const row = newRow();
  if (gen.tunnelLeft > 0) { row.tunnel = true; gen.tunnelLeft--; }
  else if (i * ROW > 350 && Math.random() < 0.012 + 0.02 * S.hard) gen.tunnelLeft = ri(25, 40);
  row.hard = S.hard > 0;
  if (i * ROW < S.startZ + (S.startZ ? 60 : 24)) return row;   // a calm stretch where each run starts (longer when resuming at speed)
  if (gen.queue.length) { gen.queue.shift()(row); return row; }
  const diff = S.mighty ? 1 : clamp((i - 12) / 200, 0, 1), z = i * ROW;
  gen.gap--;
  if (gen.gap > 0) {
    // calm row: drift the safe path and maybe lay a gem or a power-up on it
    if (Math.random() < 0.35) gen.safe = clamp(gen.safe + (Math.random() < 0.5 ? -1 : 1), 0, COLS - 1);
    // power-ups come more often the further you get: every ~120 m at first, every ~36 m from 2 km on
    if (z > 150 && i - gen.lastPower > Math.max(18, 60 - z * 0.02) && Math.random() < 0.05 + Math.min(0.07, z / 20000)) {
      row.power = { k: gen.safe, type: pickPower(z) }; gen.lastPower = i;
    } else if (Math.random() < 0.3) row.gems.push(gen.safe);
    return row;
  }
  // space obstacles by time, not distance, so faster runs still leave time to react
  const v = speedAt(z) + HARD_SPEED * S.hard + TURBO_SPEED * (z >= TURBO_AT ? 1 : 0), h = S.hard;
  gen.gap = Math.max(3, Math.round(v * (0.8 - diff * 0.2 - 0.12 * h) / ROW) + ri(0, 1));
  const kind = Math.random();
  const others = () => [0, 1, 2, 3, 4].filter(c => c !== gen.safe).sort(() => Math.random() - 0.5);
  if (lasersOn() && Math.random() < 0.3) {
    if (Math.random() < 0.5) {
      row.laser = { type: 'fence', blink: Math.random() < 0.5, w: rand(2.2, 3), ph: rand(0, 6), gone: false };
      gen.gap = Math.max(gen.gap, Math.ceil(v * 0.7 / ROW) + 2);   // room to land after jumping it
    } else row.laser = { type: 'sweep', w: rand(1.6, 2.4) * (1 + 0.3 * h), ph: rand(0, 6), gone: false };
  } else if (z > 120 && kind < 0.08) {
    // jump pad in front of a wide gap
    row.cells[gen.safe] = PAD;
    for (let k = 0; k < 3; k++) gen.queue.push(r => r.cells.fill(HOLE));   // a well-timed normal jump also clears it
    gen.gap = Math.max(3, Math.ceil(v * 1.05 / ROW) - 3 + Math.round(v * 0.6 / ROW));
  } else if (z > 100 && kind < 0.24) {
    // sliding walls sweep across the lanes
    const n = h > 0 ? ri(2, 3) : diff > 0.5 && Math.random() < 0.5 ? 2 : 1;
    for (let k = 0; k < n; k++) row.movers.push({ c: rand(-1, 1), amp: rand(1.2, 2), w: rand(1.3, 2.2) * (1 + 0.6 * h), ph: rand(0, 6), gone: false });
  } else if (diff > 0.08 && kind < 0.32 + diff * 0.1 + h * 0.1) {
    row.cells.fill(HOLE);                                         // full gap: must jump
    if (h > 0.5 && Math.random() < 0.4) gen.queue.push(r => r.cells.fill(HOLE));   // hard mode: a double-length gap
    gen.gap = Math.max(gen.gap, Math.ceil(v * 0.7 / ROW) + 2);   // room to land after the jump
  } else if (kind < 0.66) {
    const n = clamp(ri(2, 3) + Math.round(diff * 1.5) + (h > 0 ? 1 : 0), 2, 4), o = others();
    for (let k = 0; k < n; k++) row.cells[o[k]] = BLOCK;
  } else {
    const n = clamp(ri(2, 3) + Math.round(diff), 2, 4), o = others();
    for (let k = 0; k < n; k++) row.cells[o[k]] = HOLE;
  }
  if (row.cells[gen.safe] === FLOOR && !row.movers.length && Math.random() < 0.5) row.gems.push(gen.safe);
  return row;
}
function pickPower(z) {
  const opts = [['magnet', 35], ['double', z > 200 ? 20 : 0], ['shield', z > 300 ? 30 : 0], ['slow', z > 500 ? 15 : 0]];
  let r = Math.random() * opts.reduce((a, o) => a + o[1], 0);
  for (const [t, w] of opts) { if ((r -= w) < 0) return t; }
  return 'magnet';
}
function rowAt(i) {
  i = Math.max(0, i);   // the ball's edge can poke behind the start line
  while (rows.length <= i) rows.push(makeRow(rows.length));
  return rows[i];
}
const moverX = m => clamp(m.c + Math.sin(time * m.w + m.ph) * m.amp, -HALF + MOVER_HW, HALF - MOVER_HW);

const CAM_BACK = 5.4, CAM_H = 3.1;
function reset() {
  if (rows) for (const r of rows) dropRow(r);
  for (const g of pulled || []) scene.remove(g.mesh);
  ball = { x: 0, y: 0, z: S.startZ, vy: 0, speed: 9, rot: 0, air: false, fall: false, dead: false, shield: 0, magnet: 0, hole: null, cleared: false, def: 0, defV: 0, bounced: false, slow: 0, slowF: 1, double: 0 };
  rows = []; gen = { safe: 2, gap: 2, lastPower: 0, queue: [], tunnelLeft: 0 };
  cam = { back: CAM_BACK, h: CAM_H, roll: 0, jolt: 0, joltV: 0 }; camX = 0; pulled = [];
  for (const p of parts || []) p.mesh.visible = false;
  parts = [];
  S.gems = 0; S.banked = 0; S.continues = 0; S.combo = 0; S.world = 'run'; S.rpts = 0;
  if (typeof hopClear === 'function') hopClear();
  S.turbo = S.startZ >= TURBO_AT ? 1 : 0;
  S.hard = S.mighty ? 1 : clamp01Hard(S.startZ); S.level = S.mighty ? MIGHTY_LEVEL : 1 + Math.round(S.startZ / LEVEL_LEN); S.levelZ = S.startZ;
}

function hud() {
  $('dist').textContent = Math.floor(ball.z) + ' m';
  $('lvl').textContent = (S.mighty ? '💀 ' : '') + 'Lv ' + S.level;
  if (S.world !== 'rhythm') $('lvbar').firstChild.style.width = clamp((ball.z - S.levelZ) / LEVEL_LEN, 0, 1) * 100 + '%';
  $('shield').textContent = ball.shield > 0 ? '🛡️ ' + Math.ceil(ball.shield) : '';
  $('magnet').textContent = ball.magnet > 0 ? '🧲 ' + Math.ceil(ball.magnet) : '';
  $('slow').textContent = ball.slow > 0 ? '🐢 ' + Math.ceil(ball.slow) : '';
  $('double').textContent = ball.double > 0 ? '✖️2 ' + Math.ceil(ball.double) : '';
  $('gems').textContent = '💎 ' + (S.bank + S.gems - S.banked);
  $('best').textContent = '🏆 ' + (S.mighty ? S.bestMighty : S.best);
  $('mute').textContent = muted ? '🔇' : '🔊';
}
function say(text, color) {
  const m = $('msg'); m.textContent = text; m.style.color = color || '#fff';
  m.classList.remove('show'); void m.offsetWidth;   // restart the pop animation
  m.classList.add('show'); S.msgT = 1;
}
// only the distance covered in this run counts, so starting from a saved level gives no free points
function score() { return Math.floor(ball.z - S.startZ) + S.gems * 10 + S.rpts; }
const clamp01Hard = z => z >= HARD_AT ? 0.35 + 0.65 * clamp((z - HARD_AT) / 4000, 0, 1) : 0;

function start(mighty, fresh) {
  if (typeof mighty === 'boolean') S.mighty = mighty;   // Play Again keeps the current mode
  if (S.mighty && !S.mightyOpen) return;
  // normal runs start at the furthest level reached so far, unless asked to start over
  S.startZ = S.mighty || fresh ? 0 : (S.savedLevel - 1) * LEVEL_LEN;
  ac(); reset();
  S.phase = 'play';
  for (const id of ['menu', 'over']) $(id).classList.add('hidden');
  for (const id of ['hud', 'powers', 'lvbar']) $(id).classList.remove('hidden');
  if (S.mighty) say('MIGHTY LEVEL 💀', '#ff3355');
  else if (S.startZ > 0) say(`Level ${S.level}`, '#80ffdb');

function dust(x, y, z, p) {
  burst(x, y + 0.05, z, [0xd0c2ff, 0xffffff, 0x9d8cff], Math.round(4 + 6 * p), 0.8 + 1.2 * p);
}

function burst(x, y, z, cols, n, sp) {
  const at = Wp(x, y, z);
  for (let i = 0; i < n; i++) {
    const m = partPool.find(p => !p.visible); if (!m) return;
    m.material = MAT.partFor(cols[i % cols.length]);
    m.position.copy(at); m.visible = true; m.scale.setScalar(1);
    parts.push({ mesh: m, vx: rand(-sp, sp), vy: rand(0, sp * 1.4), vz: -(rand(-sp, sp) + ball.speed * 0.5), life: rand(0.5, 1) });
  }
}

// one mesh group per row of track, built when it comes into view and dropped behind the camera
function buildRow(i) {

  const z0 = i * ROW, z1 = z0 + ROW, D = 0.6;
  const pos = [], col = [], rail = [];

  const tA = new THREE.Color(0x2a1d70), tB = new THREE.Color(0x221760);

  const quad = (a, b, c, d, color) => {
    for (const p of [a, b, c, a, c, d]) { pos.push(p.x, p.y, p.z); col.push(color.r, color.g, color.b); }
  };
  for (let k = 0; k < COLS; k++) {
    if (row.cells[k] === HOLE) continue;
    const x0 = k - HALF, x1 = x0 + 1;
    const top = (i + k) % 2 ? (row.tunnel ? tA : cA) : (row.tunnel ? tB : cB);
    quad(P(x0, 0, z0), P(x1, 0, z0), P(x1, 0, z1), P(x0, 0, z1), top);
    if (!prev || prev.cells[k] === HOLE) quad(P(x0, 0, z0), P(x1, 0, z0), P(x1, -D, z0), P(x0, -D, z0), cS);
    if (next.cells[k] === HOLE) quad(P(x0, 0, z1), P(x1, 0, z1), P(x1, -D, z1), P(x0, -D, z1), cS);
    if (k === 0 || row.cells[k - 1] === HOLE) quad(P(x0, 0, z0), P(x0, 0, z1), P(x0, -D, z1), P(x0, -D, z0), cS);
    if (k === COLS - 1 || row.cells[k + 1] === HOLE) quad(P(x1, 0, z0), P(x1, 0, z1), P(x1, -D, z1), P(x1, -D, z0), cS);
    if (k === 0 || k === COLS - 1) {
      const e = k === 0 ? x0 : x1 - 0.08;
      for (const p of [P(e, 0.012, z0), P(e + 0.08, 0.012, z0), P(e + 0.08, 0.012, z1), P(e, 0.012, z0), P(e + 0.08, 0.012, z1), P(e, 0.012, z1)]) rail.push(p.x, p.y, p.z);
    }

  }
  if (rail.length) {
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(rail, 3));
    grp.add(new THREE.Mesh(g, row.hard ? MAT.railHard : MAT.rail));
  }

  row.spin = []; row.gemMeshes = {}; row.moverMeshes = []; row.powerMesh = null;
  for (let k = 0; k < COLS; k++) {
    const xc = k - HALF + 0.5;
    if (row.cells[k] === BLOCK) {
      const m = new THREE.Mesh(GEO.box, MAT.box); m.castShadow = m.receiveShadow = true;
      m.add(new THREE.LineSegments(GEO.boxEdges, MAT.boxEdge));
      Wp(xc, BLOCK_H / 2 - 0.04, zc, m.position); grp.add(m);
    } else if (row.cells[k] === PAD) {
      const m = new THREE.Mesh(GEO.pad, MAT.pad);

    }
  }
  for (const k of row.gems) {
    const m = new THREE.Mesh(GEO.gem, MAT.gem); m.castShadow = true;
    Wp(k - HALF + 0.5, 0.6, zc, m.position); grp.add(m); row.spin.push(m); row.gemMeshes[k] = m;
  }
  if (row.power) {
    const g = new THREE.Group();
    if (row.power.type === 'shield') g.add(new THREE.Mesh(GEO.shield, MAT.shield));
    else if (row.power.type === 'slow') {
      const top = new THREE.Mesh(GEO.hour, MAT.slow); top.rotation.x = Math.PI;   // hourglass: two cones tip to tip
      g.add(top, new THREE.Mesh(GEO.hour, MAT.slow));
    } else if (row.power.type === 'double') {
      const gm = new THREE.Mesh(GEO.gem, MAT.gold); gm.scale.setScalar(1.6); g.add(gm);
    } else {
      g.add(new THREE.Mesh(GEO.magnet, MAT.magnet));
      for (const s of [-1, 1]) { const t = new THREE.Mesh(GEO.tip, MAT.tip); t.position.set(s * 0.2, -0.05, 0); g.add(t); }
      g.rotation.z = Math.PI;
    }
    Wp(row.power.k - HALF + 0.5, 0.65, zc, g.position); grp.add(g); row.spin.push(g); row.powerMesh = g;
  }
  for (const mv of row.movers) {
    if (mv.gone) continue;
    const m = new THREE.Mesh(GEO.box, MAT.mover); m.castShadow = true;
    m.add(new THREE.LineSegments(GEO.boxEdges, MAT.moverEdge));
    grp.add(m); row.moverMeshes.push([mv, m]);
  }
  if (row.laser && !row.laser.gone) {
    const l = row.laser, add = (geo, mat, x, y) => { const m = new THREE.Mesh(geo, mat); Wp(x, y, zc, m.position); grp.add(m); return m; };
    if (l.type === 'fence') {
      for (const sx of [-1, 1]) { add(GEO.post, MAT.post, sx * 2.75, 0.5); add(GEO.emitter, MAT.emitter, sx * 2.75, LASER_Y); }

    } else {
      for (const sx of [-1, 1]) { const p = add(GEO.post, MAT.post, sx * 2.85, 1.55); p.scale.y = 3.1; }

    const a = new THREE.Mesh(GEO.arch, row.hard ? (i % 2 ? MAT.archHardA : MAT.archHardB) : (i % 2 ? MAT.archA : MAT.archB));

function dropRow(r) {

  r.group = null;
}
function takeGemMesh(r, k) {
  const m = r.gemMeshes && r.gemMeshes[k]; if (!m) return null;
  r.group.remove(m); scene.add(m); delete r.gemMeshes[k];
  return m;
}
function hideGemMesh(r, k) { const m = r.gemMeshes && r.gemMeshes[k]; if (m) m.visible = false; }

function render() {
  const b = ball;
  const rhythm = S.world === 'rhythm';
  const first = Math.max(0, Math.floor((b.z - 10) / ROW)), last = rhythm ? first - 1 : Math.floor((b.z + viewDist()) / ROW);
  for (const r of rows) if (r.group && (rhythm || r.index < first || r.index > last || r.dirty)) dropRow(r);
  for (let i = first; i <= last; i++) { const r = rowAt(i); if (!r.group) buildRow(i); }
  if (rhythm) renderHop();
  // animate pickups and sliding walls in view
  for (let i = first; i <= last; i++) {
    const r = rows[i];
    for (const m of r.spin) { m.rotation.y = time * 2.5 + i; }
    for (const [mv, m] of r.moverMeshes) Wp(moverX(mv), BLOCK_H / 2 - 0.04, i * ROW + 1, m.position);
    if (r.laserMesh) {
      const l = r.laser, [beam, glow, emitter] = r.laserMesh;
      if (l.type === 'fence') { const lit = laserLit(l); beam.material = lit ? MAT.beam : MAT.beamOff; glow.visible = lit; }
      else { const x = sweepX(l); Wp(x, 1.55, i * ROW + 1, beam.position); Wp(x, 1.55, i * ROW + 1, glow.position); Wp(x, 3.0, i * ROW + 1, emitter.position); }
    }
  }
  MAT.beamGlow.opacity = 0.3 + 0.1 * Math.sin(time * 40);   // a little flicker
  for (const g of pulled) if (g.mesh) Wp(g.x, g.y, g.z, g.mesh.position);

  // ball
  // very slight stretch along the jump while in the air, plus the landing wobble
  const stretch = b.air && !b.fall ? Math.min(0.15, Math.abs(b.vy) * 0.017) : 0;
  const sy = clamp(1 - 0.16 * b.def + stretch, 0.85, 1.15), sxz = clamp(1 + 0.09 * b.def - stretch * 0.5, 0.92, 1.1);
  Wp(b.x, b.y + R * sy, b.z, ballGroup.position);
  ballGroup.scale.set(sxz, sy, sxz);
  ballMesh.rotation.set(-b.rot, 0, 0);
  ballMesh.visible = !b.dead;
  ballLight.position.copy(ballGroup.position).y += 0.7;
  ballLight.intensity = b.dead ? 0 : (1.4 + 1.6 * S.pulse) * clamp(1 + b.y / 4, 0, 1);
  const blink = (t, edge) => t > 0 && (t > edge || Math.sin(time * 20) > 0);
  shieldMesh.visible = shieldWire.visible = !b.dead && blink(b.shield, 3);
  shieldMesh.position.copy(ballGroup.position); shieldWire.position.copy(ballGroup.position);
  shieldWire.rotation.y = time; shieldWire.rotation.x = time * 0.7;

  camPos.y += cam.jolt;
  camera.position.copy(camPos);
  const look = b.fall ? ballGroup.position.clone() : Wp(camX * 0.5 + b.x * 0.25, 0.2 + cam.jolt * 0.6, b.z + 9);
  camera.up.set(Math.sin(cam.roll), Math.cos(cam.roll), 0);
  camera.lookAt(look);
  starGroup.position.copy(camera.position);

  // light follows the ball so its shadow stays sharp; tunnels dim the world
  sun.target.position.copy(ballGroup.position);
  sun.position.copy(ballGroup.position).add(new THREE.Vector3(3, 12, 5));
  hemi.intensity = 0.8 - 0.45 * S.dark;
  scene.fog.color.lerpColors(FOG_N, FOG_H, rhythm ? 0 : Math.min(1, S.hard * 2));
  for (const m of Object.values(glowMats)) m.color.copy(m.base).multiplyScalar(0.55 + 0.75 * S.pulse);   // tile edges flash on the beat
  scene.fog.far = viewDist(); scene.fog.near = scene.fog.far * 0.5;
  // widen the view as speed builds, so it feels as fast as it is
  const fov = 62 + clamp((b.speed - 24) * 0.45, 0, 16);
  if (Math.abs(camera.fov - fov) > 0.1) { camera.fov += (fov - camera.fov) * 0.1; camera.updateProjectionMatrix(); }
  sun.intensity = 0.85 - 0.5 * S.dark;
  renderer.render(scene, camera);
}

// ---------- Rhythm World ----------
// From level 15 (and every 5 levels after), the track ends in a launch ramp: the ball flies off the
// end and falls into the Rhythm World, tiles in space on the song's rhythm.
// When the song ends it is back to the track at the next level.
const RHYTHM_FIRST = 15, RHYTHM_EVERY = 5;
const isRhythmLevel = n => n >= RHYTHM_FIRST && (n - RHYTHM_FIRST) % RHYTHM_EVERY === 0;
const RHYTHM_THEME = { a: 0x3d2aa8, b: 0x2b1c82, rail: 0x4cc9f0 };
const HOP = { tiles: [], live: [], k: 0, lv: null, perfect: 0 };
const flash = (on) => $('flash').classList.toggle('on', on);

function startDrop() {
  const b = ball, i = Math.floor(b.z / ROW);
  S.world = 'drop'; S.wt = 0; S.launched = 0;
  // a clear run-up, a ramp across all lanes, then the track simply ends
  const edge = i + Math.round(50 / ROW);
  for (let j = i - 2; j < edge + 80; j++) {
    const r = rowAt(j);
    Object.assign(r, { cells: r.cells.fill(j < edge ? FLOOR : j === edge ? PAD : HOLE), movers: [], laser: null, power: null, gems: [], tunnel: false, dirty: true });
  }
  S.edgeZ = edge * ROW + 0.6;
  say(`Level ${S.level}!\nRhythm World 🎵`, '#c8b6ff'); sfx.level();
}
function worldStep(dt) {
  const b = ball;
  if (S.world === 'drop') {
    // roll to the end of the track, launch off the ramp, then fall away into the Rhythm World
    b.speed += (Math.min(b.speed, 26) - b.speed) * Math.min(1, dt * 2);
    b.z += b.speed * dt; b.rot += b.speed * dt / R;
    if (keys.ArrowLeft) b.x -= 6 * dt;
    if (keys.ArrowRight) b.x += 6 * dt;
    b.x = clamp(b.x, -HALF + R, HALF - R);
    if (!S.launched && b.z >= S.edgeZ) {
      S.launched = time; b.air = true; b.vy = 10; b.y = Math.max(b.y, 0.2);
      sfx.boost(); buzz([40, 40, 120]); cam.joltV -= 0.6;
    }
    if (S.launched) {
      b.vy -= 16 * dt; b.y += b.vy * dt;
      if (b.y < -1.5 && !b.fall) { b.fall = true; b.air = false; sfx.fall(); }
      if (time - S.launched > 2.2) flash(true);
      if (time - S.launched > 2.7) enterRhythm();
    } else b.y = 0;
    return;
  }
  if (S.world === 'rhythm') hopUpdate(dt);
  hud();
}
function enterRhythm() {
  const b = ball;
  S.world = 'rhythm';
  // power-ups do nothing among the tiles, so they end here rather than sit frozen on screen
  Object.assign(b, { x: 0, y: 0, vy: 0, fall: false, air: true, hole: null, shield: 0, magnet: 0, slow: 0, double: 0 });
  cam = { back: CAM_BACK, h: CAM_H, roll: 0, jolt: 0, joltV: 0 };
  const song = window.SONGS && SONGS[0];
  // without the song file, fall back to a steady 82 BPM for 55 s
  const beats = song ? song.beats : Array.from({ length: 75 }, (_, k) => 0.4 + k * 0.73);
  HOP.lv = { z0: b.z, speed: 7,   // a gentle forward pace: the music sets the hops, not the speed
    end: song ? song.end : 55, beats, bi: 0,
    strength: song ? song.strength : beats.map((_, k) => k % 4 ? 0.2 : 1) };
  // the drum hits, and from where the song picks up (about 23.5 s) a hop on every half beat:
  // the rhythm chosen by ear for this song (song1.js "hops"); without it, the beat
  // where the tune speeds right up (its long fast passages), the ball speeds up with it: a hop on about
  // every other quick note there (no closer than 0.18 s), on a winding trail of small tiles
  const runs = (song && song.runs || []).filter(r => r.length >= 15);
  const inRun = t => runs.some(r => t > r[0] - 0.12 && t < r[r.length - 1] + 0.12);
  const times = (song && song.hops || beats).filter(t => !inRun(t)).map(t => ({ t, s: 0 }));
  for (const r of runs) for (const t of r) times.push({ t, s: 0, fast: true });
  times.sort((p, q) => p.t - q.t);
  beats.forEach((t, k) => { const h = times.find(x => Math.abs(x.t - t) < 0.12); if (h) h.s = HOP.lv.strength[k]; });   // strong beats carry gems
  HOP.tiles = [{ t: 0, z: b.z, x: 0, w: 2.4, start: true, hit: true, dip: 0, dipV: 0, flash: 0, mesh: null }];
  HOP.k = 0; HOP.perfect = 0;
  // one tile per hop, a quarter second apart at least (fast passages: one per quick note, drifting
  // with some momentum so the trail snakes); quick hops only shift a little sideways
  let prev = HOP.tiles[0], vx = 0;
  for (const { t, s, fast } of times) {
    const T = t - prev.t;
    if (t > HOP.lv.end - 0.3 || T < (fast ? 0.18 : 0.25)) continue;
    let x;
    if (fast) {
      vx = clamp(vx + rand(-0.12, 0.12), -0.2, 0.2);
      if (Math.abs(prev.x + vx) > 2) vx = -vx;
      x = prev.x + vx;
    } else x = clamp(prev.x + rand(-1.3, 1.3) * clamp(T / 0.7, 0.3, 1.2), -2.2, 2.2);
    prev = { t, z: HOP.lv.z0 + t * HOP.lv.speed, x, w: fast ? 0.85 : 1.25, fast, gem: s > 0.6 && Math.random() < 0.5, hit: false, dip: 0, dipV: 0, flash: 0, mesh: null };
    HOP.tiles.push(prev);
  }
  musicStart(0);
  setTimeout(() => flash(false), 50);
  say('RHYTHM WORLD 🎵', '#c8b6ff');
}
function exitRhythm() {
  const b = ball;
  musicStop(true); hopClear();
  S.world = 'run';
  // back on the track at the next level, with a calm stretch to get going again
  const i = Math.floor(b.z / ROW);
  for (let j = i - 2; j < i + 30; j++) { const r = rowAt(j); Object.assign(r, { cells: r.cells.fill(FLOOR), movers: [], laser: null, power: null, tunnel: false, dirty: true }); }
  Object.assign(b, { x: 0, y: 0, vy: 0, air: false, fall: false });
  S.level++; S.levelZ = b.z;
  if (S.level > S.savedLevel) { S.savedLevel = S.level; save('rb_level', S.level); }
  S.bank += S.gems - S.banked; S.banked = S.gems; save('rb_bank', S.bank);
  flash(true); setTimeout(() => flash(false), 120);
  say(`Level ${S.level}!\nBack to speed 🔥`, '#ff9e00'); sfx.boost();
}
function landTile(t, dx) {
  t.hit = true; t.dipV = -2.5; t.flash = 0.15;
  const perfect = dx < 0.2;
  S.rpts += perfect ? 20 : 10;
  HOP.perfect = perfect ? HOP.perfect + 1 : 0;
  if (HOP.perfect === 1 || (HOP.perfect && HOP.perfect % 5 === 0)) {
    const c = PRAISE[Math.min(Math.floor(HOP.perfect / 5), PRAISE.length - 1)][1];
    say(HOP.perfect > 1 ? `Perfect! x${HOP.perfect}` : 'Perfect!', c);
  }
  if (t.gem) {
    S.gems++; sfx.gem(); if (t.gemMesh) t.gemMesh.visible = false;
    burst(t.x, 0.7, t.z, [0x80ffdb, 0xffffff, 0x4cc9f0], 10, 2);
  }
  ball.defV += 16; cam.joltV -= 0.25;
  buzz(10);
  burst(t.x, 0.05, t.z, [RHYTHM_THEME.rail, 0xffffff], 6, 1.2);
}
function hopUpdate(dt) {
  const b = ball, lv = HOP.lv;
  if (keys.ArrowLeft) b.x -= 6 * dt;
  if (keys.ArrowRight) b.x += 6 * dt;
  b.x = clamp(b.x, -HALF + R, HALF - R);
  for (const t of HOP.live) {
    t.dipV += (-120 * t.dip - 10 * t.dipV) * dt; t.dip += t.dipV * dt;
    if (t.flash > 0) t.flash -= dt;
  }
  if (S.phase !== 'play') {
    if (b.fall) { b.vy -= 22 * dt; b.y += b.vy * dt; b.z += lv.speed * 0.5 * dt; }
    return;
  }
  const pos = musicPos(dt);
  while (lv.bi < lv.beats.length && lv.beats[lv.bi] <= pos) { S.pulse = 0.4 + 0.6 * lv.strength[lv.bi]; lv.bi++; }
  let t0 = HOP.tiles[HOP.k], t1 = HOP.tiles[HOP.k + 1];
  if (!t1 || pos >= lv.end) return exitRhythm();
  if (pos >= t1.t) {
    const dx = Math.abs(b.x - t1.x);
    if (dx > t1.w / 2 + R * 0.6) {
      b.fall = true; b.air = false; b.z = t1.z; b.y = 0; b.vy = -2;
      sfx.fall(); buzz(200); say('Missed! 🕳️', '#f72585'); end(true);
      return;
    }
    landTile(t1, dx); HOP.k++; t0 = t1; t1 = HOP.tiles[HOP.k + 1];
    if (!t1) return;
  }
  // a parabola from this tile to the next, timed so it touches down exactly on the next beat
  const T = t1.t - t0.t, u = clamp((pos - t0.t) / T, 0, 1), Hh = T < 0.2 ? 0.1 + T * 1.5 : clamp(0.3 + T * 2.4, 0.5, 2.6);   // quick notes: small, fast bounces
  const nz = t0.z + (t1.z - t0.z) * u;
  if (nz > b.z) b.rot += (nz - b.z) / R;
  b.z = nz; b.y = Hh * 4 * u * (1 - u); b.vy = Hh * 4 * (1 - 2 * u) / T;
  $('lvbar').firstChild.style.width = clamp(pos / lv.end, 0, 1) * 100 + '%';   // the bar follows the song here
}
function hopRevive(cost) {
  const t = HOP.tiles[HOP.k + 1], lv = HOP.lv;
  HOP.k++; t.hit = true; HOP.perfect = 0;
  Object.assign(ball, { x: t.x, y: 0, vy: 0, z: t.z, fall: false, dead: false, air: true });
  lv.bi = lv.beats.findIndex(x => x > t.t); if (lv.bi < 0) lv.bi = lv.beats.length;
  musicStart(t.t);   // the song picks up at the tile that was missed
  cam = { back: CAM_BACK, h: CAM_H, roll: 0, jolt: 0, joltV: 0 };
  $('over').classList.add('hidden');
  S.phase = 'play';
  sfx.power(); buzz([20, 30, 20]); say(`Second chance! ❤️\n-${cost} 💎`, '#ff5fa2');
  hud();
}
function hopClear() {
  for (const t of HOP.live) { scene.remove(t.mesh); t.mesh = null; }
  HOP.live = []; HOP.tiles = [];
}
// tile meshes exist only near the ball
const tileMats = {}, glowMats = {};
function tileMat(th) { return tileMats[th.a] || (tileMats[th.a] = new THREE.MeshStandardMaterial({ color: th.a, emissive: th.b, emissiveIntensity: 0.6, roughness: 0.4, metalness: 0.2 })); }
function glowLine(color) {
  if (!glowMats[color]) { glowMats[color] = new THREE.LineBasicMaterial({ color }); glowMats[color].base = new THREE.Color(color); }
  return glowMats[color];
}
function renderHop() {
  const b = ball;
  for (let k = Math.max(0, HOP.k - 2); k < HOP.tiles.length; k++) {
    const t = HOP.tiles[k];
    if (t.z > b.z + VIEW) break;
    if (!t.mesh && t.z > b.z - 10) {
      const g = new THREE.Group(), depth = t.start ? 3 : t.fast ? 0.45 : 1.25;
      t.box = new THREE.Mesh(GEO.tile, tileMat(RHYTHM_THEME)); t.box.scale.set(t.w, 1, depth); t.box.receiveShadow = true;
      const e = new THREE.LineSegments(GEO.tileEdges, glowLine(t.fast ? 0xff5fa2 : RHYTHM_THEME.rail)); e.scale.set(t.w, 1, depth);
      g.add(t.box, e);
      if (t.gem && !t.hit) { t.gemMesh = new THREE.Mesh(GEO.gem, MAT.gem); t.gemMesh.position.y = 0.85; g.add(t.gemMesh); }
      t.mesh = g; scene.add(g); HOP.live.push(t);
    }
  }
  HOP.live = HOP.live.filter(t => {
    if (t.z < b.z - 12) { scene.remove(t.mesh); t.mesh = null; return false; }
    Wp(t.x, -0.12 + t.dip, t.z, t.mesh.position);
    t.box.material = t.flash > 0 ? MAT.tileHit : tileMat(RHYTHM_THEME);
    if (t.gemMesh) t.gemMesh.rotation.y = time * 2.5;
    return true;
  });
}

// ---------- loading ----------
function setProgress(p, txt) {
  $('barFill').style.width = p + '%';
  $('loadTxt').textContent = (txt || 'Loading…') + ' ' + Math.round(p) + '%';
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
// draw one of every object type once, so no shader compiles in the middle of a run
function warmUp() {
  const grp = new THREE.Group(), at = Wp(0, 0.6, ball.z + 5);
  const add = m => { m.position.copy(at); grp.add(m); };
  add(new THREE.Mesh(GEO.box, MAT.box)); add(new THREE.Mesh(GEO.box, MAT.mover));
  add(new THREE.LineSegments(GEO.boxEdges, MAT.boxEdge)); add(new THREE.LineSegments(GEO.boxEdges, MAT.moverEdge));
  add(new THREE.Mesh(GEO.pad, MAT.pad)); add(new THREE.Mesh(GEO.gem, MAT.gem)); add(new THREE.Mesh(GEO.shield, MAT.shield));
  add(new THREE.Mesh(GEO.hour, MAT.slow)); add(new THREE.Mesh(GEO.gem, MAT.gold));
  add(new THREE.Mesh(GEO.arch, MAT.archHardA)); add(new THREE.Mesh(GEO.arch, MAT.archHardB));
  add(new THREE.Mesh(GEO.magnet, MAT.magnet)); add(new THREE.Mesh(GEO.tip, MAT.tip));
  for (const [g, m] of [[GEO.beamH, MAT.beam], [GEO.beamHGlow, MAT.beamGlow], [GEO.beamH, MAT.beamOff], [GEO.post, MAT.post], [GEO.emitter, MAT.emitter], [GEO.gantry, MAT.post]]) add(new THREE.Mesh(g, m));
  add(new THREE.Mesh(GEO.tile, tileMat(RHYTHM_THEME))); add(new THREE.LineSegments(GEO.tileEdges, glowLine(RHYTHM_THEME.rail))); add(new THREE.LineSegments(GEO.tileEdges, glowLine(0xff5fa2))); add(new THREE.Mesh(GEO.tile, MAT.tileHit));
  add(new THREE.Mesh(GEO.arch, MAT.archA)); add(new THREE.Mesh(GEO.arch, MAT.archB));
  for (const c of [0x4cc9f0, 0xffffff, 0xf72585, 0xffd60a, 0x80ffdb, 0xb5179e]) add(new THREE.Mesh(GEO.part, MAT.partFor(c)));
  grp.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(grp);
  shieldMesh.visible = shieldWire.visible = magnetRings.visible = true;
  renderer.compile(scene, camera);
  renderer.render(scene, camera);
  scene.remove(grp);
}

let last = 0, perf = { n: 0, sum: 0, done: lowQ };
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now;
  // Auto quality: if the first second of the menu runs slow, drop shadows and resolution
  if (!perf.done && quality === 'auto' && S.phase === 'menu') {
    perf.n++; if (perf.n > 10) perf.sum += now - perf.prev; perf.prev = now;
    if (perf.n === 70) {
      perf.done = true;
      if (perf.sum / 60 > 24) {
        lowQ = true; save('rb_lowq2', '1');
        applyQuality();
      }
    }
  }
  update(dt); render();
  requestAnimationFrame(frame);
}

async function boot() {
  const t0 = performance.now();
  layout();
  setProgress(5);
  try {
    await loadScript('three.min.js');
    THREE = window.THREE;
  } catch (e) { $('loadTxt').textContent = 'Could not load the game files.'; return; }
  // the Rhythm World's song, decoded once up front
  try {
    await loadScript('song1.js'); setProgress(25, 'Loading music…');
    const song = window.SONGS && SONGS[0], a = ac();
    const bin = atob(song.audio), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    song.buf = await a.decodeAudioData(u8.buffer); song.audio = null;
  } catch (e) {}
  setProgress(35, 'Starting 3D…'); await nextFrame();
  try { initRenderer(); } catch (e) { $('loadTxt').textContent = 'Sorry, 3D is not supported on this phone.'; return; }
  setProgress(50, 'Building world…'); await nextFrame();
  initWorld();
  setProgress(65, 'Building track…'); await nextFrame();
  reset(); update(0.016); render();
  setProgress(85, 'Warming up…'); await nextFrame();
  warmUp(); render();
  setProgress(100, 'Ready!');
  while (performance.now() - t0 < 1200) await nextFrame();
  S.phase = 'menu';
  menuUI();
  $('menu').classList.remove('hidden');
  $('loading').classList.add('fade');
  setTimeout(() => $('loading').classList.add('hidden'), 450);
  hud();
  last = performance.now();
  requestAnimationFrame(frame);
}
addEventListener('resize', layout);
boot();
})();
</script>

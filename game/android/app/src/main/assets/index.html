<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rolling Ball</title>
<style>
html,body{margin:0;height:100%;background:#07051a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;color:#fff;font-weight:800;font-size:20px;text-shadow:0 2px 6px #000c;pointer-events:none}
#hud .grp{display:flex;gap:14px;align-items:center;white-space:nowrap}
#powers{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 46px);display:flex;justify-content:center;gap:14px;color:#fff;font-weight:800;font-size:18px;text-shadow:0 2px 6px #000c;pointer-events:none}
#hud .tog{pointer-events:auto;background:#fff2;border:0;color:#fff;font-size:20px;border-radius:12px;padding:4px 10px}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(11,8,32,.82);color:#fff;text-align:center;gap:16px;padding:24px}
.hidden{display:none!important}
h1{font-size:38px;margin:0;line-height:1.3;background:linear-gradient(90deg,#4cc9f0,#f72585);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(180deg,#4cc9f0,#3a86ff);color:#fff;border:0;border-radius:18px;font-size:26px;font-weight:900;padding:14px 52px;box-shadow:0 6px 0 #2457b3;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #2457b3}
.btn.alt{background:linear-gradient(180deg,#ff5fa2,#f72585);box-shadow:0 6px 0 #a0105a;font-size:22px;padding:12px 30px}
.btn:disabled{filter:grayscale(1);opacity:.5}
.overlay p{margin:0;font-size:17px;opacity:.92;line-height:1.8}
.big{font-size:64px;font-weight:900;line-height:1}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:min(40px,9vw);white-space:pre-line;line-height:1.25;font-weight:900;color:#fff;text-shadow:0 4px 14px #000;pointer-events:none;opacity:0;transform:scale(.6);transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .3s}
#msg.show{opacity:1;transform:scale(1)}
#loading{background:radial-gradient(circle at 50% 60%,#3a0ca3 0%,#07051a 70%);z-index:5;transition:opacity .4s}
#loading.fade{opacity:0}
.bar{width:min(70vw,280px);height:12px;border-radius:8px;background:#ffffff22;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#4cc9f0,#f72585);transition:width .25s}
#spin{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0fbff,#4cc9f0 45%,#1e3a8a);box-shadow:0 0 30px #4cc9f088;animation:roll 1s linear infinite}
@keyframes roll{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div class="grp"><span id="lvl">Lv 1</span><span id="dist">0 m</span><span id="gems">💎 0</span></div>
  <div class="grp"><span id="best">🏆 0</span><button id="music" class="tog">🎵</button><button id="mute" class="tog">🔊</button></div>
</div>
<div id="powers" class="hidden"><span id="shield"></span><span id="magnet"></span><span id="slow"></span><span id="double"></span></div>
<div id="msg"></div>

<div id="loading" class="overlay">
  <div id="spin"></div>
  <h1>Rolling Ball</h1>
  <div class="bar"><i id="barFill"></i></div>
  <p id="loadTxt">Loading… 0%</p>
</div>

<div id="menu" class="overlay hidden">
  <div class="big">🔵</div>
  <h1>Rolling Ball</h1>
  <button class="btn" id="play">Play</button>
  <p id="menuBest"></p>
</div>

<div id="over" class="overlay hidden">
  <div class="big" id="overIcon">💥</div>
  <h1 id="overTitle">Game Over</h1>
  <div class="big" id="finalScore">0</div>
  <p id="finalInfo"></p>
  <button class="btn alt" id="cont">Second Chance ❤️</button>
  <button class="btn" id="again">Play Again</button>
  <p id="bank"></p>
</div>

<script>
(() => {
const cv = document.getElementById('c');
const $ = id => document.getElementById(id);
const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

// ---------- world layout ----------
// The game runs in "track space": x across the 5 lanes, y up from the track, z distance travelled.
// Rendering bends that space into hills and curves; the rules never see them.
const COLS = 5, HALF = 2.5, ROW = 2, R = 0.35, BLOCK_H = 0.9, VIEW = 80;
const FLOOR = 0, HOLE = 1, BLOCK = 2, PAD = 3;
const BOX_STEP = 0.35;   // a ball this close to a box's top rides over it rather than crashing
const MOVER_HW = 0.42;   // half width of a sliding wall
const HARD_SCORE = 5000, HARD_SPEED = 7;   // hard mode starts at 5000 points; extra speed once fully hard (9000+)
const levelSpeed = n => Math.min(24, 11 + 1.8 * (n - 1)) + HARD_SPEED * S.hard;
const ramp = (z, a, b) => clamp((z - a) / (b - a), 0, 1);
const elev = z => ramp(z, 60, 180) * (2.2 * Math.sin(z * 0.021) + 1.1 * Math.sin(z * 0.057 + 1.3));
const bend = z => ramp(z, 120, 280) * (9 * Math.sin(z * 0.0105) + 3 * Math.sin(z * 0.027 + 2));

let W, H, THREE;
let lowQ = load('rb_lowq') === '1';

// ---------- audio ----------
let AC = null, muted = load('rb_mute') === '1';
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, f2, delay) {
  const a = ac(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d);
}
function noise(d, v, freq) {
  const a = ac(); if (!a || muted) return;
  const n = a.sampleRate * d | 0, b = a.createBuffer(1, n, a.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = b;
  const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq;
  const g = a.createGain(); g.gain.value = v;
  s.connect(fl).connect(g).connect(a.destination); s.start();
}
const sfx = {
  gem() { tone(1320, 0.12, 'square', 0.07); tone(1760, 0.18, 'square', 0.07, null, 0.07); },
  jump() { tone(300, 0.22, 'sine', 0.25, 700); },
  boost() { tone(200, 0.5, 'sawtooth', 0.15, 1200); tone(400, 0.4, 'sine', 0.2, 1600); },
  land(v) { const k = Math.min(1, (v || 3) / 12); tone(90, 0.2, 'sine', 0.3 + 0.4 * k, 38); noise(0.12 + 0.12 * k, 0.2 + 0.4 * k, 260); },
  crash() { noise(0.6, 0.6, 900); tone(160, 0.4, 'sawtooth', 0.2, 40); },
  fall() { tone(600, 1.0, 'triangle', 0.2, 80); },
  power() { [520, 780, 1040, 1560].forEach((f, i) => tone(f, 0.12, 'triangle', 0.14, null, i * 0.06)); },
  level() { [660, 880, 1100].forEach((f, i) => tone(f, 0.15, 'triangle', 0.15, null, i * 0.09)); },
};
// Music: each level plays one song, and the song's clock drives the ball, so obstacles placed on
// the beats are reached on the beats. Without audio the same clock just runs on frame time.
let musicOff = load('rb_music') === '0';
const M = { src: null, gain: null, filter: null, t0: 0, pos0: 0, fpos: 0, rate: 1, on: false, song: -1, dark: false };
function musicSetup() {
  const a = ac(); if (!a || M.gain) return;
  M.filter = a.createBiquadFilter(); M.filter.type = 'lowpass'; M.filter.frequency.value = 18000;
  M.gain = a.createGain(); M.gain.gain.value = musicOff ? 0 : 0.6;
  M.filter.connect(M.gain).connect(a.destination);
}
function musicStart(idx, pos) {
  musicStop();
  M.song = idx; M.fpos = pos; M.pos0 = pos; M.on = false;
  const a = ac(), song = window.SONGS && SONGS[idx];
  if (!a || !song || !song.buf || window.__dtClock) return;
  musicSetup();
  M.gain.gain.cancelScheduledValues(a.currentTime); M.gain.gain.setValueAtTime(musicOff ? 0 : 0.6, a.currentTime);
  const s = a.createBufferSource(); s.buffer = song.buf; s.playbackRate.value = M.rate; s.connect(M.filter);
  M.t0 = a.currentTime + 0.05; s.start(M.t0, Math.max(0, pos));
  M.src = s; M.on = true;
}
function musicPos(dt) {
  if (M.on && AC && AC.state === 'running') return M.pos0 + Math.max(0, AC.currentTime - M.t0) * M.rate;
  M.fpos += dt * M.rate; return M.fpos;
}
function musicRate(r) {
  const p = musicPos(0);
  M.rate = r; M.pos0 = M.fpos = p;
  if (M.on) { M.t0 = Math.max(AC.currentTime, M.t0); M.src.playbackRate.setValueAtTime(r, AC.currentTime); }
}
function musicStop(fade) {
  if (!M.src) return;
  const s = M.src, now = AC.currentTime; M.src = null; M.on = false;
  if (fade) { M.gain.gain.setTargetAtTime(0, now, 0.08); s.stop(now + 0.5); } else s.stop();
}
function musicTunnel(on) {
  if (!M.filter || on === M.dark) return;
  M.dark = on; M.filter.frequency.setTargetAtTime(on ? 900 : 18000, AC.currentTime, 0.25);
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------- state ----------
const S = { phase: 'loading', gems: 0, best: +(load('rb_best') || 0), shake: 0, combo: 0,
  bank: +(load('rb_bank') || 0), banked: 0, continues: 0, msgT: 0, endT: 0, endFell: false, dark: 0, hard: 0, pulse: 0 };
let ball, rows, camX, parts, gen, cam, pulled, L = null, time = 0;

function newRow() { return { cells: new Array(COLS).fill(FLOOR), gems: [], power: null, movers: [], tunnel: false, group: null, dirty: false }; }

// Track colours change with every level; hard mode is always red.
const THEMES = [
  { a: 0x3d2aa8, b: 0x2b1c82, s: 0x1e1250, rail: 0x4cc9f0, arch: [0x4cc9f0, 0xf72585] },   // purple
  { a: 0x1f5fa8, b: 0x174a86, s: 0x0c2648, rail: 0x80ffdb, arch: [0x80ffdb, 0x4cc9f0] },   // blue
  { a: 0x1f7a52, b: 0x165c3e, s: 0x0b3524, rail: 0xd9ff5a, arch: [0xd9ff5a, 0x80ffdb] },   // green
  { a: 0x9a521c, b: 0x7a3f14, s: 0x48240c, rail: 0xffd60a, arch: [0xffd60a, 0xff5fa2] },   // orange
];
const HARD_THEME = { a: 0x8a1a3a, b: 0x661030, s: 0x3a0818, rail: 0xff3355, arch: [0xff3355, 0xff9e00] };

function makeLevel(n, z0) {
  const songs = (window.SONGS || []).filter(Boolean);
  const song = songs.length ? songs[(n - 1) % songs.length] : null;
  // without song data, fall back to a steady 82 BPM for 55 s
  const beats = song ? song.beats : Array.from({ length: 75 }, (_, k) => 0.4 + k * 0.73);
  return { n, z0, song: song ? song.n - 1 : -1, speed: levelSpeed(n), end: song ? song.end : 55,
    beats, strength: song ? song.strength : beats.map((_, k) => k % 4 ? 0.2 : 1), bi: 0, next: null,
    theme: S.hard > 0 ? HARD_THEME : THEMES[(n - 1) % THEMES.length] };
}

// Lay out a whole level at once: obstacles land on beats (every other beat at first, every beat
// later or in hard mode), with gems and power-ups on the calm stretches in between.
function planLevel(lv) {
  const zAt = t => lv.z0 + t * lv.speed;
  const r0 = Math.ceil(lv.z0 / ROW), r1 = Math.floor(zAt(lv.end) / ROW) - 1, h = S.hard;
  rowAt(r1 + 6);
  for (let i = r0; i <= r1; i++) { if (rows[i].group) dropRow(rows[i]); rows[i] = newRow(); rows[i].theme = lv.theme; }
  if (lv.n >= 2 || h > 0) {
    for (let k = 0; k < 1 + (h > 0 ? 1 : 0); k++) {
      const a = ri(r0 + 15, Math.max(r0 + 16, r1 - 45)), len = ri(20, 35);
      for (let i = a; i < Math.min(r1, a + len); i++) rows[i].tunnel = true;
    }
  }
  const every = h > 0 || lv.n >= 3 ? 1 : 2, minGap = every === 2 ? 1.2 : 0.65;
  const obs = [];
  let nextT = lv.n === 1 ? 2.5 : 0.8, safe = gen.safe;
  lv.beats.forEach((t, k) => {
    if (t < nextT || t > lv.end - 1.5) return;
    if (k % every && lv.strength[k] < 0.45) return;
    const i = Math.round(zAt(t) / ROW);
    if (i <= r0 || i >= r1 - 6) return;
    if (Math.random() < 0.4) safe = clamp(safe + (Math.random() < 0.5 ? -1 : 1), 0, COLS - 1);
    nextT = t + Math.max(minGap, placeObstacle(i, safe, lv, h));
    obs.push({ t, i, safe });
  });
  gen.safe = safe;
  // calm stretches between obstacles: a power-up now and then, otherwise a short line of gems
  const powerGap = Math.max(5, 14 - 2 * (lv.n - 1) - 4 * h);
  let lastPower = -powerGap / 2;
  for (let k = 0; k + 1 < obs.length; k++) {
    const t = (obs[k].t + obs[k + 1].t) / 2, im = Math.round(zAt(t) / ROW), lane = obs[k + 1].safe;
    const calm = j => rows[j] && rows[j].cells.every(c => c === FLOOR) && !rows[j].movers.length;
    if (!calm(im)) continue;
    if (t - lastPower >= powerGap) { rows[im].power = { k: lane, type: pickPower(zAt(t)) }; lastPower = t; }
    else if (Math.random() < 0.65) for (const j of [im - 1, im, im + 1]) if (calm(j)) rows[j].gems.push(lane);
  }
}

// one obstacle on row i that leaves lane `safe` open; returns the seconds needed before the next one
function placeObstacle(i, safe, lv, h) {
  const row = rows[i], kind = Math.random();
  const others = () => [0, 1, 2, 3, 4].filter(c => c !== safe).sort(() => Math.random() - 0.5);
  if (lv.n >= 2 && kind < 0.08) {
    row.cells[safe] = PAD;                                   // jump pad over a wide gap
    for (let k = 1; k <= 4; k++) rows[i + k].cells.fill(HOLE);
    return 1.6 + 8 / lv.speed;
  }
  if (lv.n >= 2 && kind < 0.22) {
    const n = h > 0 ? ri(2, 3) : Math.random() < 0.3 + 0.1 * lv.n ? 2 : 1;   // sliding walls
    for (let k = 0; k < n; k++) row.movers.push({ c: rand(-1, 1), amp: rand(1.2, 2), w: rand(1.3, 2.2) * (1 + 0.6 * h), ph: rand(0, 6), gone: false });
    return 0.9;
  }
  if (kind < 0.36 + 0.1 * h) {
    row.cells.fill(HOLE);                                    // full gap: must jump
    if (h > 0.5 && Math.random() < 0.4) rows[i + 1].cells.fill(HOLE);
    return 1.25;
  }
  if (kind < 0.72) {
    const n = clamp(ri(1, 2) + Math.min(2, lv.n - 1) + (h > 0 ? 1 : 0), 1, 4), o = others();
    for (let k = 0; k < n; k++) row.cells[o[k]] = BLOCK;
  } else {
    const n = clamp(ri(2, 3) + (lv.n >= 3 ? 1 : 0), 2, 4), o = others();
    for (let k = 0; k < n; k++) row.cells[o[k]] = HOLE;
  }
  return 0.65;
}
function pickPower(z) {
  const opts = [['magnet', 35], ['double', z > 200 ? 20 : 0], ['shield', z > 300 ? 30 : 0], ['slow', z > 500 ? 15 : 0]];
  let r = Math.random() * opts.reduce((a, o) => a + o[1], 0);
  for (const [t, w] of opts) { if ((r -= w) < 0) return t; }
  return 'magnet';
}
function rowAt(i) {
  i = Math.max(0, i);   // the ball's edge can poke behind the start line
  while (rows.length <= i) rows.push(newRow());
  return rows[i];
}
const moverX = m => clamp(m.c + Math.sin(time * m.w + m.ph) * m.amp, -HALF + MOVER_HW, HALF - MOVER_HW);

const CAM_BACK = 5.4, CAM_H = 3.1;
function reset() {
  if (rows) for (const r of rows) dropRow(r);
  for (const g of pulled || []) scene.remove(g.mesh);
  ball = { x: 0, y: 0, z: 0, vy: 0, speed: 11, rot: 0, air: false, fall: false, dead: false, shield: 0, magnet: 0, hole: null, cleared: false, def: 0, defV: 0, bounced: false, slow: 0, double: 0 };
  rows = []; gen = { safe: 2 }; L = null;
  cam = { back: CAM_BACK, h: CAM_H, roll: 0, jolt: 0, joltV: 0 }; camX = 0; pulled = [];
  for (const p of parts || []) p.mesh.visible = false;
  parts = [];
  S.gems = 0; S.banked = 0; S.continues = 0; S.combo = 0; S.hard = 0;
}

function hud() {
  $('dist').textContent = Math.floor(ball.z) + ' m';
  $('shield').textContent = ball.shield > 0 ? '🛡️ ' + Math.ceil(ball.shield) : '';
  $('magnet').textContent = ball.magnet > 0 ? '🧲 ' + Math.ceil(ball.magnet) : '';
  $('slow').textContent = ball.slow > 0 ? '🐢 ' + Math.ceil(ball.slow) : '';
  $('double').textContent = ball.double > 0 ? '✖️2 ' + Math.ceil(ball.double) : '';
  $('gems').textContent = '💎 ' + S.gems;
  $('best').textContent = '🏆 ' + S.best;
  $('mute').textContent = muted ? '🔇' : '🔊';
  $('music').style.opacity = musicOff ? 0.35 : 1;
  if (L) $('lvl').textContent = 'Lv ' + L.n;
}
function say(text, color) {
  const m = $('msg'); m.textContent = text; m.style.color = color || '#fff';
  m.classList.remove('show'); void m.offsetWidth;   // restart the pop animation
  m.classList.add('show'); S.msgT = 1;
}
function score() { return Math.floor(ball.z) + S.gems * 10; }

function start() {
  ac(); reset();
  L = makeLevel(1, 0); planLevel(L);
  musicRate(1); musicStart(L.song, 0);
  S.phase = 'play';
  $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('hud').classList.remove('hidden'); $('powers').classList.remove('hidden');
  hud();
}
const contCost = () => 20 * 2 ** S.continues;   // 20, 40, 80... per run
function revive() {
  const cost = contCost();
  if (S.phase !== 'over' || S.bank < cost) return;
  S.bank -= cost; save('rb_bank', S.bank); S.continues++;
  const b = ball, i = Math.floor(b.z / ROW);
  if (b.fall) b.z = b.hole.z0 + 0.1;
  // clear a short stretch so the comeback is not an instant loss
  for (let j = Math.max(0, i - 2); j < i + 8; j++) { const r = rowAt(j); r.cells.fill(FLOOR); r.movers = []; r.dirty = true; }
  Object.assign(b, { y: 0, vy: 0, air: false, fall: false, dead: false, hole: null, shield: 3 });
  cam = { back: CAM_BACK, h: CAM_H, roll: 0, jolt: 0, joltV: 0 };
  musicRate(1); musicStart(L.song, (b.z - L.z0) / L.speed);   // the song picks up where the ball is
  $('over').classList.add('hidden');
  S.phase = 'play'; S.combo = 0;
  sfx.power(); buzz([20, 30, 20]); say('Second chance! ❤️', '#ff5fa2');
  hud();
}
function end(fell) {
  if (S.phase !== 'play') return;
  S.phase = 'ending'; S.endT = fell ? 1.6 : 0.9; S.endFell = fell;
  musicStop(true);
}
function showOver(fell) {
  S.phase = 'over';
  $('msg').classList.remove('show'); S.msgT = 0;
  const sc = score(), rec = sc > S.best;
  if (rec) { S.best = sc; save('rb_best', sc); }
  $('overIcon').textContent = fell ? '🕳️' : '💥';
  $('overTitle').textContent = fell ? 'You Fell!' : 'Crashed!';
  $('finalScore').textContent = sc;
  $('finalInfo').innerHTML = `${Math.floor(ball.z)} m + ${S.gems} 💎 × 10<br>` + (rec ? '🎉 New record!' : 'Best: ' + S.best);
  // gems from every run go to a saved bank, which pays for second chances
  S.bank += S.gems - S.banked; S.banked = S.gems; save('rb_bank', S.bank);
  const cost = contCost();
  $('cont').textContent = `Second Chance ❤️  ${cost} 💎`;
  $('cont').disabled = S.bank < cost;
  $('bank').textContent = S.bank >= cost ? `You have ${S.bank} 💎` : `You have ${S.bank} 💎 (need ${cost})`;
  $('over').classList.remove('hidden');
  hud();
}

// ---------- input ----------
let touch = null;
const keys = {};
function jump() {
  if (S.phase !== 'play' || (ball.air && !ball.bounced) || ball.fall) return;
  ball.air = true; ball.vy = 7.6; ball.cleared = false; ball.bounced = false; sfx.jump(); buzz(12);
}
cv.addEventListener('pointerdown', e => {
  ac();
  touch = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!touch || e.pointerId !== touch.id) return;
  const dx = e.clientX - touch.x;
  touch.moved += Math.hypot(dx, e.clientY - touch.y);
  touch.x = e.clientX; touch.y = e.clientY;
  if (S.phase === 'play' && !ball.fall) ball.x = clamp(ball.x + dx * (COLS / (W * 0.75)), -HALF + R, HALF - R);

// a tap (no real drag) is a jump
const up = e => {
  if (!touch || e.pointerId !== touch.id) return;
  if (e.type === 'pointerup' && touch.moved < 14 && performance.now() - touch.t < 350) jump();
  touch = null;
};
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === 'ArrowUp' || e.key === ' ') jump(); });

$('again').onclick = start;

// ---------- rules ----------
// praise grows with each obstacle cleared in a row; a jump over nothing resets it
const PRAISE = [['Nice!', '#80ffdb'], ['Great!', '#4cc9f0'], ['Awesome!', '#ffd60a'], ['Amazing!', '#f72585'], ['Unstoppable! 🔥', '#ff9e00']];
const LEVEL_WORDS = ['Awesome! 🚀', 'On fire! 🔥', 'Incredible! ⚡', 'Legendary! 👑', 'Unreal! 🌟'];
function landed() {
  if (!ball.cleared) { S.combo = 0; return; }
  ball.cleared = false;
  const [word, color] = PRAISE[Math.min(S.combo, PRAISE.length - 1)];
  S.combo++;
  say(S.combo > 1 ? `${word} x${S.combo}` : word, color);
  tone(880 + S.combo * 110, 0.12, 'triangle', 0.12);
}

// boxes span z 0.3..1.7 of their row; sliding walls likewise, at their current x
function boxesNear(fn) {
  const b = ball;
  for (const j of [Math.floor((b.z - R) / ROW), Math.floor((b.z + R) / ROW)]) {
    const r = rowAt(j);
    for (let k = 0; k < COLS; k++) if (r.cells[k] === BLOCK && fn(k - HALF + 0.08, k - HALF + 0.92, j, r, k, null)) return true;
    for (const m of r.movers) if (!m.gone) { const mx = moverX(m); if (fn(mx - MOVER_HW, mx + MOVER_HW, j, r, -1, m)) return true; }
  }
  return false;
}
function onBox() {
  const b = ball;
  return boxesNear((x0, x1, j) => b.x > x0 - R * 0.3 && b.x < x1 + R * 0.3 && b.z + R > j * ROW + 0.3 && b.z - R < j * ROW + ROW - 0.3);
}

// heavy landing: the rubbery ball squashes and wobbles a little, the camera dips gently and a few sparks kick up, scaled by impact
function thud(v) {
  const b = ball, p = Math.min(1, v / 12);
  b.defV += 22 + 16 * p;   // up to 15% flatter on a hard landing
  cam.joltV -= 0.3 + 0.8 * p;
  S.shake = Math.max(S.shake, 0.02 + 0.05 * p);
  sfx.land(v); buzz(Math.round(20 + 45 * p));
  dust(b.x, b.y, b.z, p);
}

function overHole() {
  const b = ball;
  if (b.shield > 0) {
    b.shield = 0; b.air = true; b.vy = 8.5;
    sfx.jump(); buzz(60); say('Shield saved you! 🛡️', '#80ffdb');
    return;
  }
  const i = Math.floor(b.z / ROW), c = clamp(Math.floor(b.x + HALF), 0, COLS - 1);
  let j = i;
  while (rowAt(j + 1).cells[c] === HOLE) j++;
  b.hole = { c, z0: i * ROW, z1: (j + 1) * ROW };
  b.fall = true; b.vy = 0;
  sfx.fall(); buzz(200); say('You fell! 🕳️', '#f72585'); end(true);
}

function update(dt) {
  time += dt;
  if (S.msgT > 0) { S.msgT -= dt; if (S.msgT <= 0) $('msg').classList.remove('show'); }
  if (S.phase === 'ending') { S.endT -= dt; if (S.endT <= 0) showOver(S.endFell); }
  if (S.phase === 'menu' || S.phase === 'loading') { ball.z += 6 * dt; ball.rot += 6 * dt / R; ball.x = Math.sin(time * 0.8) * 1.2; }
  if (S.phase === 'play' || S.phase === 'ending') {
    const b = ball;
    if (!b.dead && !b.fall) {
      if ((b.slow > 0 ? 0.6 : 1) !== M.rate) musicRate(b.slow > 0 ? 0.6 : 1);   // slow motion slows the song too
      const pos = musicPos(dt), nz = L.z0 + pos * L.speed;
      b.speed = L.speed * M.rate;
      if (nz > b.z) { b.rot += (nz - b.z) / R; b.z = nz; }
      while (L.bi < L.beats.length && L.beats[L.bi] <= pos) { S.pulse = 0.4 + 0.6 * L.strength[L.bi]; L.bi++; }
      // plan the next level before its track comes into view, and switch when the song ends
      if (!L.next && L.z0 + L.end * L.speed - b.z < VIEW + 20) { L.next = makeLevel(L.n + 1, L.z0 + L.end * L.speed); planLevel(L.next); }
      if (pos >= L.end && S.phase === 'play') {
        if (!L.next) { L.next = makeLevel(L.n + 1, L.z0 + L.end * L.speed); planLevel(L.next); }
        L = L.next; musicStart(L.song, (b.z - L.z0) / L.speed);
        say(`Level ${L.n}!\n${LEVEL_WORDS[(L.n - 2) % LEVEL_WORDS.length]}`, '#80ffdb'); sfx.level();
      }
      if (keys.ArrowLeft) b.x -= 6 * dt;
      if (keys.ArrowRight) b.x += 6 * dt;
      b.x = clamp(b.x, -HALF + R, HALF - R);
    }
    if (b.fall) {
      // roll on towards the far wall of the hole while sinking
      const h = b.hole;
      b.vy -= 6 * dt; b.y += b.vy * dt;
      b.z += (h.z1 - R * 1.2 - b.z) * Math.min(1, dt * 5);
      b.x += (h.c - HALF + 0.5 - b.x) * Math.min(1, dt * 4);
      b.rot += 6 * dt;
    } else if (b.air) {
      b.vy -= (b.vy > 0 ? 22 : 32) * dt; b.y += b.vy * dt;   // drops faster than it rises: feels heavy
      const under = rowAt(Math.floor(b.z / ROW)).cells[clamp(Math.floor(b.x + HALF), 0, COLS - 1)];
      if (under !== FLOOR) b.cleared = true;
      // coming down near the top of a box lands on it instead of crashing
      if (b.vy <= 0 && b.y <= BLOCK_H && b.y > BLOCK_H - BOX_STEP && onBox()) {
        const v = -b.vy; b.y = BLOCK_H; b.vy = 0; b.air = false; b.bounced = false; thud(v);
      } else if (b.y <= 0) {
        const row = rowAt(Math.floor(b.z / ROW)), c = clamp(Math.floor(b.x + HALF), 0, COLS - 1);
        if (row.cells[c] === HOLE) { b.y = 0; b.air = false; overHole(); }
        else {
          const v = -b.vy; b.y = 0; b.vy = 0; b.air = false;
          // like a real ball it keeps bouncing, each hop smaller, until it settles
          if (b.bounced) {
            sfx.land(v * 0.4); b.defV += v * 2.5;
            if (v > 1.5) { b.air = true; b.vy = v * 0.4; } else b.bounced = false;
          } else {
            thud(v); landed();
            if (v > 4) { b.air = true; b.vy = v * 0.38; b.bounced = true; b.cleared = false; }
          }
        }
      }
    } else if (b.y > 0 && !onBox()) {
      b.air = true; b.vy = 0;   // rolled off the end of a box
    }
    if (S.phase === 'play' && !b.dead) {
      const i = Math.floor(b.z / ROW), row = rowAt(i), c = clamp(Math.floor(b.x + HALF), 0, COLS - 1);
      if (!b.air && !b.fall && row.cells[c] === HOLE) overHole();
      if (!b.air && !b.fall && b.y === 0 && row.cells[c] === PAD && b.z - i * ROW > 0.3) {
        b.air = true; b.vy = 11; b.cleared = true;
        sfx.boost(); buzz(30); say('Boost! 🚀', '#ffd60a');
      }
      // boxes and sliding walls: hit from the front or side unless riding over the top
      if (b.y < BLOCK_H - BOX_STEP) boxesNear((x0, x1, j, r, k, m) => {
        if (b.z + R * 0.7 < j * ROW + 0.3 || b.z - R * 0.7 > j * ROW + ROW - 0.3) return false;
        if (Math.abs(b.x - clamp(b.x, x0, x1)) >= R * 0.7) return false;
        if (b.shield > 0) {
          if (m) m.gone = true; else r.cells[k] = FLOOR;
          r.dirty = true; b.shield = 0; S.shake = 0.2;
          burst((x0 + x1) / 2, 0.5, j * ROW + 1, [0xf72585, 0xb5179e, 0xffffff], 30, 4);
          sfx.crash(); buzz(60); say('Shield saved you! 🛡️', '#80ffdb');
          return false;
        }
        b.dead = true; S.shake = 0.5;
        burst(b.x, b.y + R, b.z, [0x4cc9f0, 0xffffff, 0xf72585, 0xffd60a], 40, 4);
        sfx.crash(); buzz([60, 40, 120]); say('Crash! 💥', '#ffd60a'); end(false);
        return true;
      });
      // gems and power-ups
      const reach = b.magnet > 0 ? [i, i + 1, i + 2, i + 3] : [i, i + 1];
      for (const j of reach) {
        const r2 = rowAt(j);
        r2.gems = r2.gems.filter(k => {
          const gx = k - HALF + 0.5, gz = j * ROW + 1;
          if (b.magnet > 0) { pulled.push({ x: gx, y: 0.6, z: gz, mesh: takeGemMesh(r2, k) }); return false; }
          if (Math.abs(gx - b.x) < 0.65 && Math.abs(gz - b.z) < 0.7 && b.y < 1.2) {
            S.gems += b.double > 0 ? 2 : 1; sfx.gem(); buzz(8);
            hideGemMesh(r2, k);
            burst(gx, 0.6, gz, [0x80ffdb, 0xffffff, 0x4cc9f0], 12, 2.5);
            return false;
          }
          return true;
        });
        const pw = r2.power;
        if (pw && Math.abs(pw.k - HALF + 0.5 - b.x) < 0.7 && Math.abs(j * ROW + 1 - b.z) < 0.8 && b.y < 1.4) {
          r2.power = null; if (r2.powerMesh) r2.powerMesh.visible = false;
          if (pw.type === 'magnet') { b.magnet = 10; say('Magnet! 🧲', '#ff5fa2'); }
          else if (pw.type === 'slow') { b.slow = 6; say('Slow motion! 🐢', '#9fd8ff'); }
          else if (pw.type === 'double') { b.double = 10; say('Double gems! ✖️2', '#ffd60a'); }
          else { b.shield = 15; say('Shield! 🛡️', '#80ffdb'); }
          sfx.power(); buzz([20, 30, 20]);
          burst(b.x, 0.6, b.z + 0.5, [0x80ffdb, 0xffffff, 0x4cc9f0], 20, 3);
        }
      }
      if (b.shield > 0) b.shield = Math.max(0, b.shield - dt);
      if (b.magnet > 0) b.magnet = Math.max(0, b.magnet - dt);
      if (b.slow > 0) b.slow = Math.max(0, b.slow - dt);
      if (b.double > 0) b.double = Math.max(0, b.double - dt);
      // past 5000 points the game turns hard, and keeps getting harder up to 9000
      const sc = score();
      if (sc >= HARD_SCORE) {
        if (!S.hard) { say('HARD MODE 💀', '#ff3355'); sfx.level(); buzz([80, 60, 80]); }
        S.hard = Math.max(S.hard, 0.35 + 0.65 * clamp((sc - HARD_SCORE) / 4000, 0, 1));
      }
      // gems caught by the magnet fly into the ball
      pulled = pulled.filter(g => {
        const k = Math.min(1, dt * 9);
        g.x += (b.x - g.x) * k; g.y += (b.y + R - g.y) * k; g.z += (b.z - g.z) * k;
        if (Math.hypot(g.x - b.x, g.z - b.z) > 0.35) return true;
        S.gems += b.double > 0 ? 2 : 1; sfx.gem(); buzz(8);
        if (g.mesh) scene.remove(g.mesh);
        return false;
      });
      hud();
    }
  }
  const prevCamX = camX;
  camX += (ball.x * 0.55 - camX) * Math.min(1, dt * 6);
  // lean into steering and into the bends of the track
  const lean = -(camX - prevCamX) / Math.max(dt, 1e-3) * 0.03 - (bend(ball.z + 6) - bend(ball.z)) * 0.08;
  cam.roll += (clamp(lean, -0.15, 0.15) - cam.roll) * Math.min(1, dt * 4);
  if (ball.fall) {
    // lean over the hole so the ball can be watched dropping into it
    const k = Math.min(1, dt * 2.5);
    cam.back += (2.6 - cam.back) * k; cam.h += (4.2 - cam.h) * k;
  }
  S.dark += ((rowAt(Math.floor(ball.z / ROW)).tunnel ? 1 : 0) - S.dark) * Math.min(1, dt * 2);
  musicTunnel(S.dark > 0.5);   // the song sounds muffled inside tunnels
  S.pulse = Math.max(0, S.pulse - dt * 4);
  S.shake = Math.max(0, S.shake - dt);
  // rubber: the squash springs back past round and wobbles out (positive = flattened, negative = stretched)
  ball.defV += (-300 * ball.def - 14 * ball.defV) * dt; ball.def += ball.defV * dt;
  cam.joltV += (-70 * cam.jolt - 10 * cam.joltV) * dt; cam.jolt += cam.joltV * dt;   // spring back after a landing
  for (const p of parts) {
    p.vy -= 12 * dt; p.mesh.position.x += p.vx * dt; p.mesh.position.y += p.vy * dt; p.mesh.position.z += p.vz * dt;
    p.life -= dt; p.mesh.rotation.x += dt * 8; p.mesh.scale.setScalar(clamp(p.life * 1.5, 0.05, 1));
    if (p.life <= 0) p.mesh.visible = false;
  }

}

// ---------- 3D ----------
let FOG_N, FOG_H;
let renderer, scene, camera, hemi, sun, ballMesh, ballGroup, ballLight, shieldMesh, shieldWire, magnetRings, starGroup, sunSprite;
const GEO = {}, MAT = {};
let partPool = [];
function Wp(x, y, z, v) { return (v || new THREE.Vector3()).set(bend(z) + x, elev(z) + y, -z); }

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  return t;
}

function initRenderer() {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: !lowQ, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, lowQ ? 1 : 2));
  renderer.shadowMap.enabled = !lowQ;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(62, 1, 0.1, 400);
  layout();
}
function layout() {
  W = innerWidth; H = innerHeight;
  if (!renderer) return;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
}

function initWorld() {
  FOG_N = new THREE.Color(0x3a1078); FOG_H = new THREE.Color(0x4a0c24);
  scene.fog = new THREE.Fog(FOG_N.clone(), 28, VIEW);
  scene.background = canvasTex(4, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#07051a'); gr.addColorStop(0.3, '#1d0b52'); gr.addColorStop(0.46, '#5a1291');
    gr.addColorStop(0.5, '#3a1078'); gr.addColorStop(1, '#14082e');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  hemi = new THREE.HemisphereLight(0xb8a8ff, 0x1a0630, 0.8);
  scene.add(hemi);
  sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
  scene.add(sun, sun.target);

  // far-away stars and a glowing sun ride along with the camera
  starGroup = new THREE.Group();
  const sp = [];
  for (let i = 0; i < 500; i++) {
    const a = Math.random() * Math.PI * 2, e = rand(0.05, 1.3), r = 250;
    sp.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r);
  }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  starGroup.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, fog: false })));
  sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: canvasTex(128, 128, (g, w) => {
      const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, 'rgba(255,120,200,1)'); gr.addColorStop(0.25, 'rgba(247,37,133,.8)'); gr.addColorStop(1, 'rgba(247,37,133,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, w);
    }), fog: false, depthWrite: false, transparent: true }));

  starGroup.add(sunSprite);
  scene.add(starGroup);

  // shared shapes and materials
  MAT.track = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0.15, side: THREE.DoubleSide });
  GEO.box = new THREE.BoxGeometry(0.84, BLOCK_H, 1.4);
  GEO.boxEdges = new THREE.EdgesGeometry(GEO.box);
  MAT.box = new THREE.MeshStandardMaterial({ color: 0xd61a8a, emissive: 0x5a0838, roughness: 0.35, metalness: 0.3 });
  MAT.boxEdge = new THREE.LineBasicMaterial({ color: 0xff9ad5 });
  MAT.mover = new THREE.MeshStandardMaterial({ color: 0xff8a00, emissive: 0x6a2a00, roughness: 0.35, metalness: 0.3 });
  MAT.moverEdge = new THREE.LineBasicMaterial({ color: 0xffd29a });
  GEO.pad = new THREE.BoxGeometry(0.9, 0.08, 1.5);
  MAT.pad = new THREE.MeshStandardMaterial({ color: 0xffd60a, emissive: 0x8a6a00, roughness: 0.3,
    map: canvasTex(64, 128, (g, w, h) => {

      g.strokeStyle = '#ff7b00'; g.lineWidth = 10;
      for (let y = 20; y < h; y += 40) { g.beginPath(); g.moveTo(8, y + 18); g.lineTo(w / 2, y); g.lineTo(w - 8, y + 18); g.stroke(); }
    }) });
  GEO.gem = new THREE.OctahedronGeometry(0.2); GEO.gem.scale(1, 1.35, 1);

  GEO.hour = new THREE.ConeGeometry(0.17, 0.24, 12); GEO.hour.translate(0, -0.12, 0);   // tip at the centre
  MAT.slow = new THREE.MeshStandardMaterial({ color: 0x9fd8ff, emissive: 0x2a6a9a, roughness: 0.2 });
  MAT.gold = new THREE.MeshStandardMaterial({ color: 0xffd60a, emissive: 0x8a6a00, roughness: 0.15, metalness: 0.5, flatShading: true });
  GEO.shield = new THREE.IcosahedronGeometry(0.27, 0);
  MAT.shield = new THREE.MeshStandardMaterial({ color: 0x80ffdb, emissive: 0x2aa88a, roughness: 0.2, flatShading: true });
  GEO.magnet = new THREE.TorusGeometry(0.2, 0.075, 8, 20, Math.PI);
  MAT.magnet = new THREE.MeshStandardMaterial({ color: 0xf72585, emissive: 0x7a0a40, roughness: 0.3 });
  GEO.tip = new THREE.BoxGeometry(0.15, 0.12, 0.15);

  GEO.arch = new THREE.TorusGeometry(4.8, 0.06, 6, 32, Math.PI);   // tall enough to clear the camera
  GEO.part = new THREE.BoxGeometry(0.09, 0.09, 0.09);

  // the ball: beach-ball segments make the roll easy to see
  const ballTex = canvasTex(256, 128, (g, w, h) => {
    const cols = ['#4cc9f0', '#e0fbff', '#3a86ff', '#e0fbff', '#4cc9f0', '#e0fbff', '#3a86ff', '#e0fbff'];
    cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(i * w / cols.length, 0, w / cols.length + 1, h); });
  });
  GEO.ball = new THREE.SphereGeometry(R, 32, 20); GEO.ball.rotateZ(Math.PI / 2);   // poles on the sides
  ballMesh = new THREE.Mesh(GEO.ball, new THREE.MeshStandardMaterial({ map: ballTex, roughness: 0.22, metalness: 0.1, emissive: 0x0a2440 }));
  ballMesh.castShadow = true;
  ballLight = new THREE.PointLight(0x4cc9f0, 1.4, 5);
  shieldMesh = new THREE.Mesh(new THREE.SphereGeometry(R * 1.5, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0x80ffdb, transparent: true, opacity: 0.2, depthWrite: false }));
  shieldWire = new THREE.Mesh(new THREE.IcosahedronGeometry(R * 1.55, 1),
    new THREE.MeshBasicMaterial({ color: 0x80ffdb, wireframe: true, transparent: true, opacity: 0.6 }));
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xff5fa2 });
  magnetRings = new THREE.Group();
  for (let k = 0; k < 2; k++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(R * 1.8, 0.03, 6, 40), ringMat);

  }
  ballGroup = new THREE.Group(); ballGroup.add(ballMesh);
  scene.add(ballGroup, ballLight, shieldMesh, shieldWire, magnetRings);

  const partMats = {};
  for (let i = 0; i < 160; i++) partPool.push(new THREE.Mesh(GEO.part, MAT.boxEdge));
  partPool.forEach(m => { m.visible = false; scene.add(m); });
  MAT.partFor = c => partMats[c] || (partMats[c] = new THREE.MeshBasicMaterial({ color: c }));
}

function dust(x, y, z, p) {
  burst(x, y + 0.05, z, [0xd0c2ff, 0xffffff, 0x9d8cff], Math.round(4 + 6 * p), 0.8 + 1.2 * p);
}

function burst(x, y, z, cols, n, sp) {
  const at = Wp(x, y, z);
  for (let i = 0; i < n; i++) {
    const m = partPool.find(p => !p.visible); if (!m) return;
    m.material = MAT.partFor(cols[i % cols.length]);
    m.position.copy(at); m.visible = true; m.scale.setScalar(1);
    parts.push({ mesh: m, vx: rand(-sp, sp), vy: rand(0, sp * 1.4), vz: -(rand(-sp, sp) + ball.speed * 0.5), life: rand(0.5, 1) });
  }
}

// one mesh group per row of track, built when it comes into view and dropped behind the camera
function buildRow(i) {
  const row = rowAt(i), grp = new THREE.Group(), next = rowAt(i + 1), prev = i > 0 ? rows[i - 1] : null;
  const z0 = i * ROW, z1 = z0 + ROW, D = 0.6;
  const pos = [], col = [], rail = [];
  const th = row.theme || THEMES[0];
  const cA = new THREE.Color(th.a), cB = new THREE.Color(th.b), cS = new THREE.Color(th.s);
  const tA = new THREE.Color(0x2a1d70), tB = new THREE.Color(0x221760);
  const P = (x, y, z) => Wp(x, y, z);
  const quad = (a, b, c, d, color) => {
    for (const p of [a, b, c, a, c, d]) { pos.push(p.x, p.y, p.z); col.push(color.r, color.g, color.b); }
  };
  for (let k = 0; k < COLS; k++) {
    if (row.cells[k] === HOLE) continue;
    const x0 = k - HALF, x1 = x0 + 1;
    const top = (i + k) % 2 ? (row.tunnel ? tA : cA) : (row.tunnel ? tB : cB);
    quad(P(x0, 0, z0), P(x1, 0, z0), P(x1, 0, z1), P(x0, 0, z1), top);
    if (!prev || prev.cells[k] === HOLE) quad(P(x0, 0, z0), P(x1, 0, z0), P(x1, -D, z0), P(x0, -D, z0), cS);
    if (next.cells[k] === HOLE) quad(P(x0, 0, z1), P(x1, 0, z1), P(x1, -D, z1), P(x0, -D, z1), cS);
    if (k === 0 || row.cells[k - 1] === HOLE) quad(P(x0, 0, z0), P(x0, 0, z1), P(x0, -D, z1), P(x0, -D, z0), cS);
    if (k === COLS - 1 || row.cells[k + 1] === HOLE) quad(P(x1, 0, z0), P(x1, 0, z1), P(x1, -D, z1), P(x1, -D, z0), cS);
    if (k === 0 || k === COLS - 1) {
      const e = k === 0 ? x0 : x1 - 0.08;
      for (const p of [P(e, 0.012, z0), P(e + 0.08, 0.012, z0), P(e + 0.08, 0.012, z1), P(e, 0.012, z0), P(e + 0.08, 0.012, z1), P(e, 0.012, z1)]) rail.push(p.x, p.y, p.z);
    }
  }
  if (pos.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, MAT.track); m.receiveShadow = true; grp.add(m);
  }
  if (rail.length) {
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(rail, 3));
    grp.add(new THREE.Mesh(g, themeMat(th.rail, true)));
  }
  const zc = z0 + 1;
  row.spin = []; row.gemMeshes = {}; row.moverMeshes = []; row.powerMesh = null;
  for (let k = 0; k < COLS; k++) {
    const xc = k - HALF + 0.5;
    if (row.cells[k] === BLOCK) {
      const m = new THREE.Mesh(GEO.box, MAT.box); m.castShadow = m.receiveShadow = true;
      m.add(new THREE.LineSegments(GEO.boxEdges, MAT.boxEdge));
      Wp(xc, BLOCK_H / 2 - 0.04, zc, m.position); grp.add(m);
    } else if (row.cells[k] === PAD) {
      const m = new THREE.Mesh(GEO.pad, MAT.pad);
      Wp(xc, 0.17, zc, m.position); m.rotation.x = Math.atan2(0.3, 1.5); grp.add(m);
    }
  }
  for (const k of row.gems) {
    const m = new THREE.Mesh(GEO.gem, MAT.gem); m.castShadow = true;
    Wp(k - HALF + 0.5, 0.6, zc, m.position); grp.add(m); row.spin.push(m); row.gemMeshes[k] = m;
  }
  if (row.power) {
    const g = new THREE.Group();
    if (row.power.type === 'shield') g.add(new THREE.Mesh(GEO.shield, MAT.shield));
    else if (row.power.type === 'slow') {
      const top = new THREE.Mesh(GEO.hour, MAT.slow); top.rotation.x = Math.PI;   // hourglass: two cones tip to tip
      g.add(top, new THREE.Mesh(GEO.hour, MAT.slow));
    } else if (row.power.type === 'double') {
      const gm = new THREE.Mesh(GEO.gem, MAT.gold); gm.scale.setScalar(1.6); g.add(gm);
    } else {
      g.add(new THREE.Mesh(GEO.magnet, MAT.magnet));
      for (const s of [-1, 1]) { const t = new THREE.Mesh(GEO.tip, MAT.tip); t.position.set(s * 0.2, -0.05, 0); g.add(t); }
      g.rotation.z = Math.PI;
    }
    Wp(row.power.k - HALF + 0.5, 0.65, zc, g.position); grp.add(g); row.spin.push(g); row.powerMesh = g;
  }
  for (const mv of row.movers) {
    if (mv.gone) continue;
    const m = new THREE.Mesh(GEO.box, MAT.mover); m.castShadow = true;
    m.add(new THREE.LineSegments(GEO.boxEdges, MAT.moverEdge));
    grp.add(m); row.moverMeshes.push([mv, m]);
  }
  if (row.tunnel) {
    const a = new THREE.Mesh(GEO.arch, themeMat(th.arch[i % 2]));
    Wp(0, -0.6, zc, a.position); grp.add(a);
  }
  row.group = grp; row.dirty = false; row.index = i;
  scene.add(grp);
}
// one glowing material per colour, shared by all rows; render() makes them pulse on the beat
const glowMats = {};
function themeMat(color, twoSided) {
  const key = color + (twoSided ? 'd' : '');
  if (!glowMats[key]) { glowMats[key] = new THREE.MeshBasicMaterial({ color, side: twoSided ? THREE.DoubleSide : THREE.FrontSide }); glowMats[key].base = new THREE.Color(color); }
  return glowMats[key];
}
function dropRow(r) {
  if (!r.group) return;
  scene.remove(r.group);
  r.group.traverse(o => { if (o.isMesh && o.geometry && !Object.values(GEO).includes(o.geometry) && o.geometry !== GEO.ball) o.geometry.dispose(); });
  r.group = null;
}
function takeGemMesh(r, k) {
  const m = r.gemMeshes && r.gemMeshes[k]; if (!m) return null;
  r.group.remove(m); scene.add(m); delete r.gemMeshes[k];
  return m;
}
function hideGemMesh(r, k) { const m = r.gemMeshes && r.gemMeshes[k]; if (m) m.visible = false; }

function render() {
  const b = ball;
  const first = Math.max(0, Math.floor((b.z - 10) / ROW)), last = Math.floor((b.z + VIEW) / ROW);
  for (const r of rows) if (r.group && (r.index < first || r.index > last || r.dirty)) dropRow(r);
  for (let i = first; i <= last; i++) { const r = rowAt(i); if (!r.group) buildRow(i); }
  // animate pickups and sliding walls in view
  for (let i = first; i <= last; i++) {
    const r = rows[i];
    for (const m of r.spin) { m.rotation.y = time * 2.5 + i; }
    for (const [mv, m] of r.moverMeshes) Wp(moverX(mv), BLOCK_H / 2 - 0.04, i * ROW + 1, m.position);
  }
  for (const g of pulled) if (g.mesh) Wp(g.x, g.y, g.z, g.mesh.position);

  // ball
  // very slight stretch along the jump while in the air, plus the landing wobble
  const stretch = b.air && !b.fall ? Math.min(0.15, Math.abs(b.vy) * 0.017) : 0;
  const sy = clamp(1 - 0.16 * b.def + stretch, 0.85, 1.15), sxz = clamp(1 + 0.09 * b.def - stretch * 0.5, 0.92, 1.1);
  Wp(b.x, b.y + R * sy, b.z, ballGroup.position);
  const beat = 1 + 0.04 * S.pulse;
  ballGroup.scale.set(sxz * beat, sy * beat, sxz * beat);
  ballMesh.rotation.set(-b.rot, 0, 0);
  ballMesh.visible = !b.dead;
  ballLight.position.copy(ballGroup.position).y += 0.7;
  ballLight.intensity = b.dead ? 0 : (1.4 + 1.6 * S.pulse) * clamp(1 + b.y / 4, 0, 1);
  const blink = (t, edge) => t > 0 && (t > edge || Math.sin(time * 20) > 0);
  shieldMesh.visible = shieldWire.visible = !b.dead && blink(b.shield, 3);
  shieldMesh.position.copy(ballGroup.position); shieldWire.position.copy(ballGroup.position);
  shieldWire.rotation.y = time; shieldWire.rotation.x = time * 0.7;
  magnetRings.visible = !b.dead && blink(b.magnet, 2);
  magnetRings.position.copy(ballGroup.position); magnetRings.rotation.y = time * 3;

  // camera follows from behind, tilts with the track, and leans over holes
  const cz = b.z - cam.back;
  const camPos = Wp(camX, cam.h, cz);
  if (S.shake > 0) camPos.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), 0).multiplyScalar(S.shake * 0.5));
  camPos.y += cam.jolt;
  camera.position.copy(camPos);
  const look = b.fall ? ballGroup.position.clone() : Wp(camX * 0.5 + b.x * 0.25, 0.2 + cam.jolt * 0.6, b.z + 9);
  camera.up.set(Math.sin(cam.roll), Math.cos(cam.roll), 0);
  camera.lookAt(look);
  starGroup.position.copy(camera.position);

  // light follows the ball so its shadow stays sharp; tunnels dim the world
  sun.target.position.copy(ballGroup.position);
  sun.position.copy(ballGroup.position).add(new THREE.Vector3(3, 12, 5));
  hemi.intensity = 0.8 - 0.45 * S.dark;
  scene.fog.color.lerpColors(FOG_N, FOG_H, Math.min(1, S.hard * 2));
  // beat pulse: rails, arches and the ball flash with the music
  for (const m of Object.values(glowMats)) m.color.copy(m.base).multiplyScalar(0.55 + 0.75 * S.pulse);
  ballMesh.material.emissiveIntensity = 1 + 3 * S.pulse;
  sun.intensity = 0.85 - 0.5 * S.dark;
  renderer.render(scene, camera);
}

// ---------- loading ----------
function setProgress(p, txt) {
  $('barFill').style.width = p + '%';
  $('loadTxt').textContent = (txt || 'Loading…') + ' ' + Math.round(p) + '%';
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
// draw one of every object type once, so no shader compiles in the middle of a run
function warmUp() {
  const grp = new THREE.Group(), at = Wp(0, 0.6, ball.z + 5);
  const add = m => { m.position.copy(at); grp.add(m); };
  add(new THREE.Mesh(GEO.box, MAT.box)); add(new THREE.Mesh(GEO.box, MAT.mover));
  add(new THREE.LineSegments(GEO.boxEdges, MAT.boxEdge)); add(new THREE.LineSegments(GEO.boxEdges, MAT.moverEdge));
  add(new THREE.Mesh(GEO.pad, MAT.pad)); add(new THREE.Mesh(GEO.gem, MAT.gem)); add(new THREE.Mesh(GEO.shield, MAT.shield));
  add(new THREE.Mesh(GEO.hour, MAT.slow)); add(new THREE.Mesh(GEO.gem, MAT.gold));
  add(new THREE.Mesh(GEO.magnet, MAT.magnet)); add(new THREE.Mesh(GEO.tip, MAT.tip));
  for (const th of [...THEMES, HARD_THEME]) { add(new THREE.Mesh(GEO.arch, themeMat(th.arch[0]))); add(new THREE.Mesh(GEO.arch, themeMat(th.arch[1]))); add(new THREE.Mesh(GEO.arch, themeMat(th.rail, true))); }
  for (const c of [0x4cc9f0, 0xffffff, 0xf72585, 0xffd60a, 0x80ffdb, 0xb5179e]) add(new THREE.Mesh(GEO.part, MAT.partFor(c)));
  grp.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(grp);
  shieldMesh.visible = shieldWire.visible = magnetRings.visible = true;
  renderer.compile(scene, camera);
  renderer.render(scene, camera);
  scene.remove(grp);
}

let last = 0, perf = { n: 0, sum: 0, done: lowQ };
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now;
  // quality check: if the first second of the menu runs slow, drop shadows and resolution
  if (!perf.done && S.phase === 'menu') {
    perf.n++; if (perf.n > 10) perf.sum += now - perf.prev; perf.prev = now;
    if (perf.n === 70) {
      perf.done = true;
      if (perf.sum / 60 > 24) {
        lowQ = true; save('rb_lowq', '1');
        renderer.setPixelRatio(1); renderer.shadowMap.enabled = false;
        scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
        layout();
      }
    }
  }
  update(dt); render();
  requestAnimationFrame(frame);
}

async function boot() {
  const t0 = performance.now();
  layout();
  setProgress(5);
  try {
    await loadScript('three.min.js');
    THREE = window.THREE;
  } catch (e) { $('loadTxt').textContent = 'Could not load the game files.'; return; }
  // songs: song1.js, song2.js... as many as are bundled; each is decoded once up front
  for (let n = 1; n <= 9; n++) { try { await loadScript('song' + n + '.js'); } catch (e) { break; } setProgress(15 + n * 5, 'Loading music…'); }
  const a = ac();
  for (const song of (window.SONGS || []).filter(Boolean)) {
    try {
      const bin = atob(song.audio), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      song.buf = await a.decodeAudioData(u8.buffer);
    } catch (e) { song.buf = null; }
    song.audio = null;
  }
  setProgress(35, 'Starting 3D…'); await nextFrame();
  try { initRenderer(); } catch (e) { $('loadTxt').textContent = 'Sorry, 3D is not supported on this phone.'; return; }
  setProgress(50, 'Building world…'); await nextFrame();
  initWorld();
  setProgress(65, 'Building track…'); await nextFrame();
  reset(); update(0.016); render();
  setProgress(85, 'Warming up…'); await nextFrame();
  warmUp(); render();
  setProgress(100, 'Ready!');
  while (performance.now() - t0 < 1200) await nextFrame();
  S.phase = 'menu';
  $('menuBest').textContent = (S.best ? 'Best: ' + S.best + '   ' : '') + (S.bank ? '💎 ' + S.bank : '');
  $('menu').classList.remove('hidden');
  $('loading').classList.add('fade');
  setTimeout(() => $('loading').classList.add('hidden'), 450);
  hud();
  last = performance.now();
  requestAnimationFrame(frame);
}
addEventListener('resize', layout);
boot();
})();
</script>
</body>

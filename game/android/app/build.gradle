plugins {
    id 'com.android.application'
}

android {
    namespace 'com.malek.rollingball'
    compileSdk 35

    defaultConfig {
        applicationId 'com.malek.rollingball'
        minSdk 26
        targetSdk 35
        // CI passes its run number, so every build installs as an update over the last one
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName "1.${versionCode}"
    }

    // Builds for installing straight from the download link are signed with the sideload key
    // kept in the repo, so every build installs over the last one and keeps saved progress.
    // A Google Play build uses the private upload key from GitHub secrets instead (game/SIGNING.md).
    signingConfigs {
        sideload {
            storeFile rootProject.file('sideload.jks')
            storePassword 'rollingball'
            keyAlias 'sideload'
            keyPassword 'rollingball'
        }
        upload {
            if (System.getenv('RB_KEYSTORE')) {
                storeFile file(System.getenv('RB_KEYSTORE'))
                storePassword System.getenv('RB_STORE_PASSWORD')
                keyAlias 'upload'
                keyPassword System.getenv('RB_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('RB_KEYSTORE') ? signingConfigs.upload : signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
